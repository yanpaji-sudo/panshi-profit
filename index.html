<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">


<title>磐石收益账本 Pro</title>


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;

}



body{

min-height:100vh;

display:flex;

justify-content:center;

padding:15px;

font-family:

"PingFang SC",
"Microsoft YaHei",
Arial;


background:#050505;

}



body.gold{

--bg:#050505;
--card:#111;
--main:#d4af37;
--light:#fff0a8;
--sub:#a88635;

}


body.jade{

--bg:#02130d;
--card:#09251b;
--main:#19c997;
--light:#d7fff5;
--sub:#55a88a;

}


body.blue{

--bg:#061326;
--card:#0b203c;
--main:#4aa3ff;
--light:#e0f2ff;
--sub:#799bc5;

}



body.purple{

--bg:#17051f;
--card:#281035;
--main:#c77dff;
--light:#f2dcff;
--sub:#aa7cc4;

}



body.red{

--bg:#200303;
--card:#310909;
--main:#ff5252;
--light:#ffe1e1;
--sub:#c27b7b;

}



body.black{

--bg:#000;
--card:#080808;
--main:#aaa;
--light:#fff;
--sub:#888;

}



body.silver{

--bg:#111;
--card:#222;
--main:#ddd;
--light:#fff;
--sub:#999;

}



body.bronze{

--bg:#180b03;
--card:#281407;
--main:#c47a32;
--light:#ffe2b0;
--sub:#aa7948;

}




.wrap{

width:100%;
max-width:430px;

}




.card{

position:relative;

overflow:hidden;

background:

linear-gradient(
160deg,
rgba(255,255,255,.1),
transparent 40%
),

var(--card);


border:

1.5px solid var(--main);


border-radius:30px;


padding:25px 18px;


box-shadow:

0 20px 80px rgba(0,0,0,.9);


}



.inner{

position:absolute;

inset:6px;

border:

1px solid rgba(255,255,255,.12);

border-radius:25px;


}




.content{

position:relative;

z-index:5;

}



.title{

text-align:center;

font-size:30px;

font-weight:900;

letter-spacing:5px;


background:

linear-gradient(
180deg,
#fff,
var(--light)
);


-webkit-background-clip:text;

color:transparent;

}



.sub{

text-align:center;

font-size:12px;

margin-top:8px;

letter-spacing:3px;

color:var(--sub);

}




.theme{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:8px;

margin:20px 0;

}




.theme button{


height:32px;

border-radius:18px;

border:

1px solid var(--main);


background:

rgba(255,255,255,.05);


color:var(--light);


font-size:11px;

}





.stats{

display:flex;

gap:10px;

}



.stat{


flex:1;

padding:15px 5px;


border-radius:16px;


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.15);


text-align:center;


}



.label{

font-size:11px;

color:var(--sub);

}



.value{


margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--light);

}




.month{


display:flex;

justify-content:space-between;

align-items:center;

margin:22px 0;


}



.month button{


width:40px;

height:36px;

border-radius:20px;

background:none;

border:

1px solid var(--main);

font-size:25px;

color:var(--light);

}




.month span{


font-size:20px;

font-weight:900;

color:var(--light);


}




.week{


display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

color:var(--sub);

font-size:12px;

margin-bottom:8px;

}




.grid{


display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;


}




.day{


height:60px;


position:relative;


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


border-radius:12px;


background:

rgba(255,255,255,.04);


border:

1px solid rgba(255,255,255,.12);


color:var(--light);


font-size:12px;


}



.day.active{


border-color:var(--main);


background:

rgba(255,220,80,.15);


}




.day input{


width:85%;


height:20px;


background:rgba(0,0,0,.4);


border:0;


outline:none;


border-radius:8px;


text-align:center;


color:var(--light);


font-size:12px;


font-weight:bold;


}



.note-icon{


position:absolute;

right:5px;

top:3px;

font-size:12px;

display:none;


}



.day.has-note .note-icon{

display:block;

}



.notes-box{


margin-top:18px;


padding:15px;


border-radius:18px;


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.15);


}



.notes-title{


font-size:15px;

font-weight:900;

color:var(--light);

margin-bottom:10px;


}



.note-item{


font-size:12px;

line-height:24px;

color:var(--sub);

border-bottom:

1px solid rgba(255,255,255,.08);


}




/*================
收益计算器
================*/


.calculator{


margin-top:18px;


padding:16px;


border-radius:20px;


background:

rgba(255,255,255,.05);


border:

1px solid var(--main);


}



.calc-title{


text-align:center;


font-size:18px;


font-weight:900;


color:var(--light);


margin-bottom:15px;


}



.calculator input,
.calculator select{


width:100%;


height:45px;


margin-bottom:12px;


border-radius:12px;


border:

1px solid var(--main);


background:#000;


color:var(--light);


font-size:15px;


text-align:center;


outline:none;


}



.calculator button{


width:100%;


height:45px;


border-radius:15px;


border:0;


background:


linear-gradient(

135deg,

var(--main),

var(--light)

);



font-weight:bold;


font-size:15px;


}




.calc-result{


margin-top:15px;


padding:12px;


background:

rgba(0,0,0,.35);


border-radius:15px;


}



.calc-result div{


display:flex;


justify-content:space-between;


padding:8px;


color:var(--sub);


}



.calc-result span{


font-size:20px;


font-weight:900;


color:var(--light);


}







.buttons{


display:flex;


gap:12px;


margin-top:20px;


}




.buttons button{


flex:1;


height:52px;


border-radius:18px;


font-weight:bold;


}



.export{


border:0;


background:


linear-gradient(

135deg,

var(--main),

var(--light)

);


}



.clear{


background:none;


border:

1px solid var(--main);


color:var(--light);


}





.brand{


margin-top:20px;


text-align:center;


font-size:11px;


letter-spacing:5px;


color:rgba(255,255,255,.35);


}




/*备注弹窗*/


.note-mask{


position:fixed;


inset:0;


background:

rgba(0,0,0,.75);


display:none;


align-items:center;


justify-content:center;


z-index:100;


}




.note-panel{


width:85%;


background:#111;


border:

1px solid var(--main);


border-radius:22px;


padding:20px;


}




.note-panel h3{


text-align:center;


color:var(--light);


margin-bottom:15px;


}




.note-panel textarea{


width:100%;


height:120px;


background:#000;


border:

1px solid var(--main);


border-radius:12px;


color:#fff;


padding:10px;


resize:none;


}




.note-panel button{


width:100%;


height:42px;


margin-top:15px;


border:0;


border-radius:15px;


background:var(--main);


font-weight:bold;


}



canvas{

display:none;

}



</style>

</head><body class="gold">


<div class="wrap">


<div class="card" id="card">


<div class="inner"></div>


<div class="content">



<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 收益计算 · 智能管理
</div>





<!--主题-->

<div class="theme">

<button onclick="changeTheme('gold')">
鎏金
</button>

<button onclick="changeTheme('jade')">
翡翠
</button>

<button onclick="changeTheme('blue')">
星耀
</button>

<button onclick="changeTheme('black')">
黑钻
</button>


<button onclick="changeTheme('purple')">
紫晶
</button>

<button onclick="changeTheme('red')">
红曜
</button>

<button onclick="changeTheme('silver')">
银白
</button>

<button onclick="changeTheme('bronze')">
古铜
</button>

</div>






<!--统计-->

<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>

</div>



<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>

</div>



<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>

</div>


</div>







<!--月份-->

<div class="month">

<button id="prev">
‹
</button>


<span id="ym">
</span>


<button id="next">
›
</button>

</div>







<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>




<!--日历-->

<div class="grid" id="grid"></div>







<!--备注-->

<div class="notes-box">


<div class="notes-title">
📝 本月备注账本
</div>


<div id="notesList">

暂无备注

</div>


</div>









<!--收益计算器-->

<div class="calculator">


<div class="calc-title">

📈 收益计算器

</div>




<input id="position"

type="number"

placeholder="请输入仓位金额">





<select id="incomeType">


<option value="0.018">

动态收入（日息1.8%）

</option>


<option value="0.012">

静态收入（日息1.2%）

</option>


</select>





<input id="daysInput"

type="number"

placeholder="请输入收益时间（天）">






<button id="calculate">

开始盈利计算

</button>







<div class="calc-result">


<div>

纯利润

<span id="profit">

¥0

</span>

</div>



<div>

总金额

<span id="total">

¥0

</span>

</div>



</div>



</div>









<div class="buttons">


<button class="export" id="export">

📸 导出高清图片

</button>



<button class="clear" id="clear">

清空

</button>



</div>






<div class="brand">

P A N S H I · WEALTH

</div>



</div>


</div>


</div>







<!--备注弹窗-->


<div class="note-mask" id="noteMask">


<div class="note-panel">


<h3 id="noteTitle">
日期备注
</h3>



<textarea id="noteText"
placeholder="请输入当天备注内容"></textarea>



<button id="saveNote">

保存备注

</button>


</div>


</div>





<canvas id="cv" width="1200" height="2000"></canvas>

<script>


//======================
//主题切换
//======================


function changeTheme(type){

document.body.className=type;

localStorage.setItem(
"ps_theme",
type
);

}


let saveTheme=
localStorage.getItem("ps_theme");


if(saveTheme){

document.body.className=saveTheme;

}



//======================
//数据
//======================


let now=new Date();


let income=
JSON.parse(
localStorage.getItem("ps_income")||"{}"
);



let notes=
JSON.parse(
localStorage.getItem("ps_notes")||"{}"
);



let selectDay=null;




function getKey(){


return now.getFullYear()
+
"-"
+
now.getMonth();


}





//======================
//日历渲染
//======================


function render(){



let y=now.getFullYear();


let m=now.getMonth();



document.getElementById("ym").innerHTML=

y+"年"+(m+1)+"月";



let grid=
document.getElementById("grid");



grid.innerHTML="";



let start=

(new Date(y,m,1).getDay()+6)%7;



let total=

new Date(y,m+1,0).getDate();




for(let i=0;i<start;i++){


let e=document.createElement("div");


e.className="day";


e.style.visibility="hidden";


grid.appendChild(e);


}





let key=getKey();



if(!income[key]){

income[key]={};

}


if(!notes[key]){

notes[key]={};

}




for(let d=1;d<=total;d++){



let box=
document.createElement("div");



box.className="day";



let value=
income[key][d]||"";



if(value){

box.classList.add("active");

}




if(notes[key][d]){


box.classList.add("has-note");


}





let icon=
document.createElement("span");


icon.className="note-icon";


icon.innerHTML="📝";



box.appendChild(icon);





let number=
document.createElement("div");


number.innerHTML=d;



box.appendChild(number);





let input=
document.createElement("input");



input.value=value;


input.placeholder="0";


input.inputMode="numeric";



input.onclick=function(e){

e.stopPropagation();

};






input.oninput=function(){



this.value=this.value

.replace(/\D/g,"")

.substring(0,8);





if(this.value){


income[key][d]=
Number(this.value);


box.classList.add("active");


}else{


delete income[key][d];


box.classList.remove("active");


}



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();



};






box.onclick=function(){


openNote(d);


};




box.appendChild(input);


grid.appendChild(box);



}



calc();


showNotes();



}






//======================
//统计
//======================


function calc(){


let key=getKey();


let sum=0;


let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(income[key][i]);


days++;


}


}



document.getElementById("sum").innerHTML=

"¥"+
sum.toLocaleString();



document.getElementById("days").innerHTML=

days;



document.getElementById("avg").innerHTML=

"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}






//======================
//备注
//======================


function openNote(day){


selectDay=day;



let key=getKey();



document.getElementById("noteTitle").innerHTML=

(now.getMonth()+1)
+
"月"
+
day+
"日备注";



document.getElementById("noteText").value=

notes[key][day]||"";



document.getElementById("noteMask")
.style.display="flex";



}







document.getElementById("saveNote")
.onclick=function(){


let key=getKey();


let text=

document.getElementById("noteText")
.value
.trim();




if(!notes[key]){

notes[key]={};

}




if(text){


notes[key][selectDay]=text;


}else{


delete notes[key][selectDay];


}





localStorage.setItem(

"ps_notes",

JSON.stringify(notes)

);



document.getElementById("noteMask")
.style.display="none";



render();



};







document.getElementById("noteMask")
.onclick=function(e){


if(e.target===this){


this.style.display="none";


}


};





//======================
//备注显示
//======================


function showNotes(){


let box=
document.getElementById("notesList");


let key=getKey();


let html="";



for(let d in notes[key]||{}){


html+=

"<div class='note-item'>"+

"📅 "+d+"日："+notes[key][d]

+

"</div>";



}



if(!html){

html="暂无备注";

}


box.innerHTML=html;


}





//======================
//月份切换
//======================


document.getElementById("prev")
.onclick=function(){


now.setMonth(
now.getMonth()-1
);


render();


};





document.getElementById("next")
.onclick=function(){


now.setMonth(
now.getMonth()+1
);


render();


};







//======================
//清空收益
//======================


document.getElementById("clear")
.onclick=function(){


if(confirm("确定清空本月收益记录？")){


delete income[getKey()];


localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



render();


}


};








//======================
//收益计算器
//======================


document.getElementById("calculate")
.onclick=function(){



let position=

Number(
document.getElementById("position").value
);



let rate=

Number(
document.getElementById("incomeType").value
);



let time=

Number(
document.getElementById("daysInput").value
);





if(!position||!time){


alert("请输入仓位和收益时间");


return;


}





let profit=

position*
rate*
time;




let total=

position+
profit;





document.getElementById("profit")
.innerHTML=

"¥"+
Math.round(profit)
.toLocaleString();





document.getElementById("total")
.innerHTML=

"¥"+
Math.round(total)
.toLocaleString();




};









//======================
//启动
//======================


render();


//======================
//高清导出
//======================


document.getElementById("export")
.onclick=function(){



let card=
document.getElementById("card");



let water=
document.createElement("div");



water.style.position="absolute";

water.style.left="-30%";

water.style.top="0";

water.style.width="160%";

water.style.height="160%";

water.style.transform=
"rotate(-35deg)";

water.style.zIndex="2";

water.style.pointerEvents="none";

water.style.display="flex";

water.style.flexWrap="wrap";

water.style.alignContent="center";

water.style.justifyContent="center";

water.style.gap="80px";




let color=

getComputedStyle(document.body)
.getPropertyValue("--main");





for(let i=0;i<35;i++){



let item=
document.createElement("div");


item.innerHTML=
"磐石收益";


item.style.width="220px";


item.style.textAlign="center";


item.style.fontSize="28px";


item.style.fontWeight="900";


item.style.letterSpacing="5px";


item.style.color=color;


item.style.opacity=".07";



water.appendChild(item);


}




card.appendChild(water);






//备注导出补充


let note=

document.createElement("div");



note.style.marginTop="15px";


note.style.padding="12px";


note.style.borderRadius="15px";


note.style.border=
"1px solid "+color;


note.style.color="var(--light)";


note.style.fontSize="12px";


note.style.lineHeight="24px";




let key=getKey();



let html=
"📝 本月备注记录<br>";



let has=false;



for(let d in notes[key]||{}){


has=true;


html+=

"📅 "+

d+

"日："+

notes[key][d]

+
"<br>";



}



if(!has){

html+="暂无备注";

}




note.innerHTML=html;




card.appendChild(note);







setTimeout(()=>{



html2canvas(card,{

scale:4,

backgroundColor:null,

useCORS:true

})

.then(canvas=>{



let a=document.createElement("a");


a.download=

"磐石收益账本_"

+

now.getFullYear()

+

"年"

+

(now.getMonth()+1)

+

"月.png";



a.href=

canvas.toDataURL(
"image/png",
1
);



a.click();





card.removeChild(water);

card.removeChild(note);



});



},300);



};



</script>



</body>

</html>
