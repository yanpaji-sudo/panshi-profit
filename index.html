<style>

*{
margin:0;
padding:0;

body{

/*==================
主题
==================*/


body.gold{

--card:#151515;

}


body.jade{

--main:#19c997;
--light:#d5fff4;
--sub:#69b89b;

}



body.blue{

--bg:#061326;
--card:#0b203d;
--main:#4fa3ff;
--light:#e2f1ff;
--sub:#7896bb;

}



body.purple{

--bg:#160824;
--card:#24103b;
--main:#c77dff;
--light:#f1dcff;
--sub:#aa8ac5;

}



body.red{

--bg:#210505;
--card:#330909;
--main:#ff5252;
--light:#ffe1e1;
--sub:#c98787;

}



body.black{

--bg:#000;
--card:#090909;
--main:#999;
--light:#fff;
--sub:#666;

}





.wrap{

width:100%;

max-width:440px;

}





.card{

position:relative;

overflow:hidden;

width:100%;

background:

linear-gradient(
160deg,
rgba(255,255,255,.08),
transparent 35%
),

var(--card);


border-radius:30px;


padding:25px 18px;


border:

1px solid var(--main);



box-shadow:

0 20px 80px rgba(0,0,0,.8);


}




.card:before{

content:"";

position:absolute;

width:350px;

height:350px;

left:-120px;

top:-120px;


background:

radial-gradient(
circle,
rgba(255,255,255,.12),
transparent 65%
);


}



.inner{

position:absolute;

inset:6px;

border-radius:25px;

border:

1px solid rgba(255,255,255,.12);


pointer-events:none;

}




.content{

position:relative;

z-index:2;

}





.title{

text-align:center;

font-size:30px;

font-weight:900;

letter-spacing:6px;


background:

linear-gradient(
180deg,
#fff,
var(--light)
);


-webkit-background-clip:text;

color:transparent;


}



.sub{

text-align:center;

margin-top:8px;

font-size:12px;

letter-spacing:3px;

color:var(--sub);


}





.theme{

margin:20px 0;

display:grid;

grid-template-columns:repeat(4,1fr);

gap:8px;


}



.theme button{

border-radius:18px;

background:

rgba(255,255,255,.05);


border:

1px solid var(--main);


color:var(--light);

font-size:12px;


}







.stats{

display:flex;

gap:10px;


}



.stat{

flex:1;

padding:15px 5px;

text-align:center;

border-radius:16px;


background:

rgba(255,255,255,.06);


border:

1px solid rgba(255,255,255,.12);


}



.label{

font-size:11px;

color:var(--sub);

}



.value{

margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--light);

}






.month{

display:flex;

justify-content:space-between;

align-items:center;

margin:22px 0;


}



.month button{

width:42px;

height:36px;

border-radius:20px;


background:none;

border:

1px solid var(--main);


color:var(--light);

font-size:22px;

}





.month span{

font-size:20px;

font-weight:bold;

color:var(--light);

}







.week{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

font-size:12px;

color:var(--sub);

margin-bottom:8px;

}




.grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;


}





.day{

height:58px;

border-radius:12px;

background:

rgba(255,255,255,.04);


border:

1px solid rgba(255,255,255,.12);


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


position:relative;


}



.day.active{

border-color:var(--main);

background:

rgba(255,255,255,.12);

}





.day input{

width:85%;

border:0;

outline:0;

background:transparent;


text-align:center;


color:var(--light);

font-size:12px;


}





.note-icon{

position:absolute;

right:3px;

top:2px;

font-size:10px;

}



.note-box{

margin-top:18px;

padding:15px;

border-radius:18px;

background:

rgba(255,255,255,.05);

border:

1px solid rgba(255,255,255,.12);

}



.note-title{

font-size:15px;

font-weight:900;

color:var(--light);

margin-bottom:10px;

}



.note-item{

font-size:12px;

line-height:25px;

color:var(--sub);

border-bottom:

1px solid rgba(255,255,255,.08);

}




/*收益计算器*/


.calculator{

margin-top:18px;

padding:16px;

border-radius:20px;


background:

rgba(255,255,255,.06);


border:

1px solid var(--main);

}



.calc-title{

text-align:center;

font-size:18px;

font-weight:900;

color:var(--light);

margin-bottom:15px;

}




.calculator input,

.calculator select{


width:100%;

height:45px;

margin-bottom:12px;

border-radius:12px;


background:#000;

border:

1px solid var(--main);


color:var(--light);


text-align:center;


font-size:15px;


outline:none;


}





.calculator button{


width:100%;

height:45px;

border-radius:15px;


border:0;


background:

linear-gradient(

135deg,

var(--main),

var(--light)

);


font-weight:bold;

}





.calc-result{


margin-top:15px;

padding:10px;

background:

rgba(0,0,0,.35);


border-radius:15px;


}



.calc-result div{


display:flex;

justify-content:space-between;

padding:8px;


color:var(--sub);

}



.calc-result span{


font-size:20px;

font-weight:900;

color:var(--light);

}





.buttons{

display:flex;

gap:12px;

margin-top:20px;


}



.buttons button{

flex:1;

height:52px;

border-radius:18px;


font-size:15px;

font-weight:bold;


}





.export{


border:0;


background:

linear-gradient(

135deg,

var(--main),

var(--light)

);


}





.clear{


background:none;


border:

1px solid var(--main);


color:var(--light);

}





.brand{


text-align:center;


margin-top:20px;


font-size:11px;


letter-spacing:5px;


color:rgba(255,255,255,.3);


}





/*备注弹窗*/


.mask{


position:fixed;

inset:0;


background:

rgba(0,0,0,.75);


display:none;


align-items:center;


justify-content:center;


z-index:99;


}



.panel{


width:85%;


padding:20px;


border-radius:20px;


background:#111;


border:

1px solid var(--main);


}




.panel h3{


text-align:center;


color:var(--light);

margin-bottom:15px;


}




.panel textarea{


width:100%;


height:120px;


background:#000;


color:#fff;


border:

1px solid var(--main);


border-radius:12px;


padding:10px;


}




.panel button{


width:100%;


height:42px;


margin-top:15px;


border:0;


border-radius:15px;


background:var(--main);


font-weight:bold;


}



</style>


</head><body class="gold">


<div class="wrap">


<div class="card" id="card">


<div class="inner"></div>

<div class="stat">

<div class="stat">

<div class="label">
日均收益
</div>

¥0
</div>

</div>



</div>








<!--月份-->

<div class="month">


<button id="prev">
‹
</button>


<span id="ym">
</span>


<button id="next">
›
</button>

<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>





<div class="grid" id="grid">

</div>






<!--备注-->

<div class="note-box">


<div class="note-title">

📝 本月备注

</div>


<div id="noteList">

暂无备注

</div>


</div>









<!--计算器-->

<div class="calculator">


<div class="calc-title">

📈 收益计算器

</div>



<input

id="position"

type="number"

placeholder="输入仓位金额">





<select id="incomeType">


<option value="0.018">

动态收入（日息1.8%）

</option>


<option value="0.012">

静态收入（日息1.2%）

</option>


</select>

id="time"

type="number"

placeholder="输入收益时间（天）">

开始计算盈利

</button>

<div>

<span id="profit">
¥0
</span>


</div>



<div>

<span id="total">
¥0
</span>


</div>



</div>


</div>









<div class="buttons">

📸 高清导出

</button>

</div>







<div class="brand">

P A N S H I · WEALTH

</div>


</div>


</div>


</div>








<!--备注窗口-->

<div class="mask" id="mask">


<div class="panel">


<h3 id="noteTitle">
日期备注
</h3>


<textarea id="noteText"
placeholder="输入当天备注内容">
</textarea>

保存备注

</button>


</div>

</div>





<canvas id="canvas"

width="1200"

height="1500"

style="display:none">

</canvas><script>


//=======================
//主题
//=======================


function changeTheme(type){

document.body.className=type;

localStorage.setItem(
"ps_theme",
type
);

}



let oldTheme=
localStorage.getItem("ps_theme");


if(oldTheme){

document.body.className=oldTheme;

}





//=======================
//数据
//=======================


let now=new Date();



let income=
JSON.parse(

localStorage.getItem("ps_income")

||

"{}"

);



let notes=
JSON.parse(

localStorage.getItem("ps_notes")

||

"{}"

);



let currentNoteDay=null;






function monthKey(){


return now.getFullYear()

+

"-"

+

now.getMonth();


}







//=======================
//渲染日历
//=======================


function render(){


let y=now.getFullYear();


let m=now.getMonth();




document.getElementById("ym").innerHTML=

y+"年"+(m+1)+"月";




let grid=

document.getElementById("grid");



grid.innerHTML="";





let start=

(new Date(y,m,1).getDay()+6)%7;



let days=

new Date(y,m+1,0).getDate();





for(let i=0;i<start;i++){


let empty=document.createElement("div");


empty.className="day";


empty.style.visibility="hidden";


grid.appendChild(empty);


}





let key=monthKey();




if(!income[key]){

income[key]={};

}


if(!notes[key]){

notes[key]={};

}






for(let d=1;d<=days;d++){



let box=document.createElement("div");


box.className="day";




let val=

income[key][d]||"";



if(val){

box.classList.add("active");

}





//备注标记


if(notes[key][d]){


let icon=document.createElement("span");


icon.className="note-icon";


icon.innerHTML="📝";


box.appendChild(icon);


}






let num=document.createElement("div");


num.innerHTML=d;


box.appendChild(num);







let input=document.createElement("input");


input.type="text";

input.inputMode="numeric";

input.placeholder="0";

input.value=val;



//输入居中修复


input.style.textAlign="center";

input.style.display="block";

input.style.margin="2px auto";






input.onclick=function(e){

e.stopPropagation();

};





input.oninput=function(){



this.value=this.value

.replace(/\D/g,"")

.substring(0,8);





if(this.value){


income[key][d]=Number(this.value);


box.classList.add("active");


}else{


delete income[key][d];


box.classList.remove("active");


}



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();


};






box.onclick=function(){

openNote(d);

};





box.appendChild(input);


grid.appendChild(box);



}



calc();

showNotes();


}







//=======================
//统计
//=======================


function calc(){


let key=monthKey();


let sum=0;


let days=0;




for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(income[key][i]);


days++;


}


}




document.getElementById("sum").innerHTML=

"¥"+sum.toLocaleString();



document.getElementById("days").innerHTML=

days;



document.getElementById("avg").innerHTML=

"¥"+

(
days?

Math.round(sum/days):

0

)

.toLocaleString();



}



//=======================
//备注功能
//=======================


function openNote(day){


currentNoteDay=day;


let key=monthKey();



document.getElementById("noteTitle").innerHTML=

(now.getMonth()+1)

+

"月"

+

day

+

"日备注";




document.getElementById("noteText").value=

notes[key][day]||"";




document.getElementById("mask")
.style.display="flex";



}




document.getElementById("saveNote")
.onclick=function(){



let key=monthKey();



let text=

document.getElementById("noteText")
.value
.trim();




if(!notes[key]){

notes[key]={};

}



if(text){


notes[key][currentNoteDay]=text;


}else{


delete notes[key][currentNoteDay];


}





localStorage.setItem(

"ps_notes",

JSON.stringify(notes)

);




document.getElementById("mask")
.style.display="none";



render();



};






document.getElementById("mask")
.onclick=function(e){


if(e.target===this){

this.style.display="none";

}


};








function showNotes(){



let box=

document.getElementById("noteList");



let key=monthKey();


let html="";



for(let d in notes[key]||{}){


html+=

"<div class='note-item'>"

+

"📅 "

+

d

+

"日："

+

notes[key][d]

+

"</div>";



}




if(!html){

html="暂无备注";

}



box.innerHTML=html;



}









//=======================
//月份
//=======================


document.getElementById("prev")
.onclick=function(){


now.setMonth(

now.getMonth()-1

);


render();


};





document.getElementById("next")
.onclick=function(){


now.setMonth(

now.getMonth()+1

);


render();


};









//=======================
//清空
//=======================


document.getElementById("clear")
.onclick=function(){



if(confirm("确定清空本月收益？")){


delete income[monthKey()];



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



render();



}



};









//=======================
//收益计算器
//=======================


document.getElementById("calcBtn")
.onclick=function(){



let position=

Number(

document.getElementById("position")
.value

);



let rate=

Number(

document.getElementById("incomeType")
.value

);



let time=

Number(

document.getElementById("time")
.value

);





if(!position||!time){


alert("请输入仓位和时间");


return;


}





let profit=

position*

rate*

time;



let total=

position+

profit;





document.getElementById("profit")
.innerHTML=

"¥"+

Math.round(profit)
.toLocaleString();





document.getElementById("total")
.innerHTML=

"¥"+

Math.round(total)
.toLocaleString();




};






//初始化


render();


//=======================
// 高清海报导出
//=======================


document.getElementById("export")
.onclick=function(){


let canvas=document.getElementById("canvas");

let ctx=canvas.getContext("2d");


let W=1200;

let H=1500;



ctx.clearRect(0,0,W,H);





// 当前主题颜色


let style=getComputedStyle(document.body);


let main=

style.getPropertyValue("--main");


let light=

style.getPropertyValue("--light");





//背景


let bg=

ctx.createLinearGradient(
0,
0,
0,
H
);


bg.addColorStop(
0,
"#111"
);


bg.addColorStop(
1,
"#000"
);


ctx.fillStyle=bg;

ctx.fillRect(
0,
0,
W,
H
);






//卡片背景


ctx.beginPath();

ctx.roundRect(
60,
60,
1080,
1380,
45
);


ctx.fillStyle="rgba(255,255,255,.05)";

ctx.fill();



ctx.strokeStyle=main;

ctx.lineWidth=4;

ctx.stroke();








//标题


ctx.textAlign="center";


ctx.fillStyle=light;


ctx.font=

"bold 72px Microsoft YaHei";



ctx.fillText(

"磐石收益账本",

600,

160

);




ctx.font=

"30px Microsoft YaHei";



ctx.fillStyle="#aaa";


ctx.fillText(

"财富记录 · 智能管理",

600,

220

);







//统计


let key=monthKey();


let sum=0;

let count=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(income[key][i]);

count++;


}


}



let avg=

count?

Math.round(sum/count):

0;






ctx.font=

"32px Arial";


ctx.fillStyle=light;



ctx.fillText(

"累计 ¥"+sum.toLocaleString()

+

"     天数 "

+

count

+

"     日均 ¥"+avg.toLocaleString(),

600,

330

);








//月份


ctx.font=

"45px Microsoft YaHei";


ctx.fillText(

now.getFullYear()

+

"年"

+

(now.getMonth()+1)

+

"月",

600,

420

);








//日历


let start=

(new Date(

now.getFullYear(),

now.getMonth(),

1

).getDay()+6)%7;



let total=

new Date(

now.getFullYear(),

now.getMonth()+1,

0

).getDate();





let x0=100;

let y0=500;


let cw=140;

let ch=100;

let gap=10;




let bottom=0;



for(let d=1;d<=total;d++){



let index=start+d-1;


let row=Math.floor(index/7);


let col=index%7;



let x=x0+col*(cw+gap);


let y=y0+row*(ch+gap);



bottom=y+ch;




ctx.strokeStyle="rgba(255,255,255,.2)";


ctx.strokeRect(
x,
y,
cw,
ch
);



ctx.fillStyle=light;


ctx.font=

"26px Arial";



ctx.fillText(

d,

x+70,

y+35

);






if(income[key][d]){


ctx.font=

"30px Arial";


ctx.fillText(

income[key][d],

x+70,

y+75

);



}


}









//备注区域自动避让


let noteY=

bottom+80;



if(noteY>1120){

noteY=1120;

}




ctx.textAlign="left";


ctx.font=

"30px Microsoft YaHei";


ctx.fillStyle=light;


ctx.fillText(

"📝 本月备注",

100,

noteY

);





ctx.font=

"24px Microsoft YaHei";


let line=noteY+45;


let hasNote=false;



for(let d in notes[key]||{}){


hasNote=true;


ctx.fillText(

d+"日："+notes[key][d],

100,

line

);


line+=40;


if(line>1300)break;


}



if(!hasNote){


ctx.fillStyle="#888";


ctx.fillText(

"暂无备注",

100,

line

);


}







//====================
//倾斜水印
//====================


ctx.save();



ctx.translate(
600,
850
);



ctx.rotate(
-35*Math.PI/180
);



ctx.font=

"bold 80px Microsoft YaHei";



ctx.textAlign="center";


ctx.fillStyle=

main;


ctx.globalAlpha=.08;



for(let y=-800;y<800;y+=180){


ctx.fillText(

"磐石收益",

0,

y

);


}



ctx.globalAlpha=1;


ctx.restore();







//底部品牌


ctx.textAlign="center";


ctx.fillStyle="rgba(255,255,255,.3)";


ctx.font=

"22px Arial";



ctx.fillText(

"P A N S H I · WEALTH",

600,

1400

);






//生成图片


canvas.toBlob(function(blob){


let a=document.createElement("a");


a.href=

URL.createObjectURL(blob);



a.download=

"磐石收益账本_"

+

now.getFullYear()

+

"年"

+

(now.getMonth()+1)

+

"月.png";



a.click();



URL.revokeObjectURL(a.href);



},"image/png");



};





</script>


</body>
