<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>磐石收益账本 Pro</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

padding:16px;

font-family:

"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;

background:#050505;

}


/*================
主题
================*/


body.gold{

--bg:#050505;
--card:#111;
--main:#d4af37;
--light:#fff0aa;
--sub:#a88835;

}


body.jade{

--bg:#03140e;
--card:#08261b;
--main:#18c995;
--light:#d5fff3;
--sub:#55a889;

}


body.blue{

--bg:#061326;
--card:#0b203d;
--main:#4aa3ff;
--light:#e1f1ff;
--sub:#789bc5;

}


body.black{

--bg:#000;
--card:#080808;
--main:#aaa;
--light:#fff;
--sub:#777;

}


body.purple{

--bg:#12051c;
--card:#241030;
--main:#c77dff;
--light:#f1dcff;
--sub:#aa7bc5;

}


body.red{

--bg:#200303;
--card:#300808;
--main:#ff5252;
--light:#ffe3e3;
--sub:#c07b7b;

}


body.silver{

--bg:#111;
--card:#202328;
--main:#dce2ea;
--light:#fff;
--sub:#999;

}


body.bronze{

--bg:#170a03;
--card:#271306;
--main:#c47a32;
--light:#ffe2b0;
--sub:#a0784d;

}



.wrap{

width:100%;
max-width:430px;

}



.card{


position:relative;

overflow:hidden;

background:

linear-gradient(
150deg,
rgba(255,255,255,.12),
transparent 40%
),

var(--card);


border:

1.5px solid var(--main);


border-radius:32px;


padding:25px 18px;


box-shadow:

0 25px 90px rgba(0,0,0,.85);


}




.inner{

position:absolute;

inset:6px;

border:

1px solid rgba(255,255,255,.15);

border-radius:27px;

}




.content{

position:relative;

z-index:5;

}



.title{

text-align:center;

font-size:30px;

font-weight:900;

letter-spacing:5px;


background:

linear-gradient(
180deg,
#fff,
var(--light)
);


-webkit-background-clip:text;

color:transparent;

}



.sub{

margin-top:8px;

text-align:center;

font-size:12px;

letter-spacing:3px;

color:var(--sub);

}



/*主题按钮*/

.theme{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:8px;

margin:22px 0;

}



.theme button{

height:32px;

border-radius:20px;

background:

rgba(255,255,255,.06);

border:

1px solid var(--main);

color:var(--light);

font-size:11px;

}



/*统计*/

.stats{

display:flex;

gap:10px;

}


.stat{

flex:1;

padding:15px 5px;

background:

rgba(255,255,255,.05);

border:

1px solid rgba(255,255,255,.15);

border-radius:16px;

text-align:center;

}



.label{

font-size:11px;

color:var(--sub);

}



.value{

margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--light);

}




.month{

display:flex;

justify-content:space-between;

align-items:center;

margin:22px 0;

}


.month button{

width:40px;

height:36px;

border-radius:20px;

background:none;

border:

1px solid var(--main);

font-size:25px;

color:var(--light);

}


.month span{

font-size:20px;

font-weight:900;

color:var(--light);

}





.week{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

font-size:12px;

color:var(--sub);

margin-bottom:8px;

}




.grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;

}




.day{


height:60px;

position:relative;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


background:

rgba(255,255,255,.04);


border-radius:12px;


border:

1px solid rgba(255,255,255,.12);


color:var(--light);

font-size:12px;


cursor:pointer;


}




.day.active{

border-color:var(--main);

background:

rgba(255,215,100,.15);

}




.day input{


width:90%;

height:20px;

margin:3px auto 0;

border:0;

outline:none;

background:

rgba(0,0,0,.3);

border-radius:8px;

text-align:center;

font-size:12px;

font-weight:900;

color:var(--light);

}




/*备注标志*/


.note-icon{


position:absolute;


right:5px;


top:3px;


font-size:12px;


display:none;


}



.day.has-note .note-icon{

display:block;

}





/*备注区域*/


.notes-box{


margin-top:18px;


padding:14px;


border-radius:18px;


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.15);


}



.notes-title{


font-size:14px;

font-weight:900;

color:var(--light);


margin-bottom:10px;


}



.note-item{


font-size:12px;


line-height:22px;


color:var(--sub);


border-bottom:

1px solid rgba(255,255,255,.08);


padding:4px 0;


}




.buttons{

display:flex;

gap:12px;

margin-top:20px;

}


.buttons button{

flex:1;

height:52px;

border-radius:18px;

font-weight:bold;

}



.export{


border:0;


background:

linear-gradient(
135deg,
var(--main),
var(--light)
);


color:#111;

}



.clear{


background:none;


border:

1px solid var(--main);


color:var(--light);

}




.brand{

margin-top:20px;

text-align:center;

font-size:11px;

letter-spacing:5px;

color:rgba(255,255,255,.35);

}



/*弹窗*/

.note-mask{


display:none;


position:fixed;


inset:0;


background:rgba(0,0,0,.75);


z-index:99;


align-items:center;


justify-content:center;


}



.note-panel{


width:85%;


background:#111;


border:1px solid var(--main);


border-radius:22px;


padding:20px;


}



.note-panel h3{


color:var(--light);

text-align:center;

margin-bottom:15px;


}



.note-panel textarea{


width:100%;


height:120px;


background:#000;


color:#fff;


border:1px solid var(--main);


border-radius:12px;


padding:10px;


resize:none;


}



.note-panel button{


width:100%;


margin-top:15px;


height:42px;


border-radius:15px;


border:0;


background:var(--main);


font-weight:bold;


}




</style>

</head><body class="gold">


<div class="wrap">


<div class="card" id="card">


<div class="inner"></div>


<div class="content">


<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 智能累计 · 备注管理
</div>



<div class="theme">

<button onclick="changeTheme('gold')">鎏金</button>
<button onclick="changeTheme('jade')">翡翠</button>
<button onclick="changeTheme('blue')">星辰</button>
<button onclick="changeTheme('black')">黑钻</button>

<button onclick="changeTheme('purple')">紫晶</button>
<button onclick="changeTheme('red')">红曜</button>
<button onclick="changeTheme('silver')">银白</button>
<button onclick="changeTheme('bronze')">古铜</button>

</div>





<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>

</div>



<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>

</div>



<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>

</div>



</div>







<div class="month">

<button id="prev">
‹
</button>


<span id="ym">
</span>


<button id="next">
›
</button>


</div>





<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>


</div>





<div class="grid" id="grid"></div>





<!--备注显示-->

<div class="notes-box">


<div class="notes-title">

📝 本月备注记录

</div>



<div id="notesList">

暂无备注

</div>



</div>





<div class="buttons">


<button class="export" id="export">

📸 导出品牌图

</button>



<button class="clear" id="clear">

清空

</button>


</div>





<div class="brand">

P A N S H I · WEALTH

</div>



</div>


</div>


</div>







<!--备注弹窗-->


<div class="note-mask" id="noteMask">


<div class="note-panel">


<h3 id="noteTitle">
日期备注
</h3>



<textarea id="noteText"
placeholder="请输入当天备注内容..."></textarea>



<button id="saveNote">

保存备注

</button>



</div>


</div>







<script>


//======================
//主题
//======================


function changeTheme(t){


document.body.className=t;


localStorage.setItem(
"ps_theme",
t
);


}



let themeSave=
localStorage.getItem(
"ps_theme"
);



if(themeSave){

document.body.className=
themeSave;

}






//======================
//数据
//======================


let now=new Date();



//收益

let income=
JSON.parse(

localStorage.getItem(
"ps_income"
)

|| "{}"

);



//备注

let notes=
JSON.parse(

localStorage.getItem(
"ps_notes"
)

|| "{}"

);






let selectDay=null;





function getKey(){


return now.getFullYear()
+
"-"
+
now.getMonth();

}








//======================
//日历生成
//======================


function render(){



let y=
now.getFullYear();


let m=
now.getMonth();



document.getElementById("ym")
.innerHTML=

y+"年"+(m+1)+"月";



let grid=
document.getElementById("grid");


grid.innerHTML="";



let first=

(new Date(
y,
m,
1
).getDay()+6)%7;




let total=

new Date(
y,
m+1,
0
)
.getDate();




for(let i=0;i<first;i++){


let e=document.createElement("div");


e.className="day";


e.style.visibility="hidden";


grid.appendChild(e);


}




let key=getKey();



if(!income[key]){

income[key]={};

}




if(!notes[key]){

notes[key]={};

}






for(let d=1;d<=total;d++){



let box=document.createElement("div");



box.className="day";



let val=
income[key][d]||"";



if(val){

box.classList.add(
"active"
);

}




if(notes[key][d]){


box.classList.add(
"has-note"
);


}





let num=
document.createElement("div");


num.innerHTML=d;





let icon=
document.createElement("span");


icon.className="note-icon";


icon.innerHTML="📝";



box.appendChild(icon);



box.appendChild(num);






let input=
document.createElement("input");



input.type="text";


input.inputMode="numeric";



input.value=val;


input.placeholder="0";





input.onclick=function(e){

e.stopPropagation();

};




input.oninput=function(){



this.value=

this.value
.replace(/\D/g,"")
.substring(0,8);





if(this.value){


income[key][d]=
Number(this.value);


box.classList.add(
"active"
);


}else{


delete income[key][d];


box.classList.remove(
"active"
);


}



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();


};







box.onclick=function(){


openNote(d);


};





box.appendChild(input);



grid.appendChild(box);


}




calc();


showNotes();


}//======================
//统计
//======================


function calc(){


let key=getKey();


let sum=0;


let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(
income[key][i]
);


days++;


}

}




document.getElementById("sum")
.innerHTML=
"¥"+
sum.toLocaleString();



document.getElementById("days")
.innerHTML=
days;



document.getElementById("avg")
.innerHTML=

"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}







//======================
//打开备注
//======================


function openNote(day){



selectDay=day;



let key=getKey();



document.getElementById("noteTitle")
.innerHTML=

(now.getMonth()+1)
+
"月"
+
day
+
"日备注";




document.getElementById("noteText")
.value=

notes[key][day]||"";



document.getElementById("noteMask")
.style.display="flex";



}






//======================
//保存备注
//======================


document.getElementById("saveNote")
.onclick=function(){



let key=getKey();



let text=

document.getElementById("noteText")
.value
.trim();





if(!notes[key]){

notes[key]={};

}




if(text){


notes[key][selectDay]=text;


}else{


delete notes[key][selectDay];


}





localStorage.setItem(

"ps_notes",

JSON.stringify(notes)

);




document.getElementById("noteMask")
.style.display="none";



render();



};






//点击遮罩关闭


document.getElementById("noteMask")
.onclick=function(e){


if(e.target===this){


this.style.display="none";


}


};







//======================
//备注列表
//======================


function showNotes(){



let box=
document.getElementById("notesList");



let key=getKey();



let html="";




for(let d in notes[key]||{}){


html+=

"<div class='note-item'>"+
"📅 "+d+"日："+

notes[key][d]

+

"</div>";



}





if(html===""){


html="暂无备注";


}



box.innerHTML=html;



}






//======================
//月份切换
//======================


document.getElementById("prev")
.onclick=function(){



now.setMonth(
now.getMonth()-1
);



render();


};





document.getElementById("next")
.onclick=function(){



now.setMonth(
now.getMonth()+1
);



render();


};








//======================
//清空本月收益
//======================


document.getElementById("clear")
.onclick=function(){



if(confirm("确定清空本月收益记录？")){


delete income[getKey()];


localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



render();


}


};






//启动


render();



</script><script>


//==============================
// 高清导出（收益+备注版）
//==============================


document.getElementById("export")
.onclick=function(){



let card=
document.getElementById("card");




//临时增加导出水印

let watermark=
document.createElement("div");



watermark.style.position="absolute";


watermark.style.left="-35%";


watermark.style.top="-20%";


watermark.style.width="170%";


watermark.style.height="170%";


watermark.style.zIndex="1";


watermark.style.pointerEvents="none";


watermark.style.transform=
"rotate(-35deg)";



watermark.style.display="flex";


watermark.style.flexWrap="wrap";


watermark.style.alignContent="center";


watermark.style.justifyContent="center";


watermark.style.gap="100px";




let mainColor=
getComputedStyle(document.body)
.getPropertyValue("--main");




for(let i=0;i<28;i++){


let w=
document.createElement("div");



w.innerHTML=
"P A N S H I";



w.style.width="180px";


w.style.textAlign="center";


w.style.fontSize="26px";


w.style.fontWeight="900";


w.style.letterSpacing="5px";


w.style.color=
mainColor;



w.style.opacity=".06";



watermark.appendChild(w);


}



card.appendChild(watermark);





//生成备注导出区域


let exportNotes=
document.createElement("div");



exportNotes.style.marginTop="15px";


exportNotes.style.padding="12px";


exportNotes.style.borderRadius="15px";


exportNotes.style.border=
"1px solid "+mainColor;



exportNotes.style.color=
"var(--light)";



exportNotes.style.fontSize="12px";


exportNotes.style.lineHeight="22px";




let key=getKey();



let noteHtml=
"📝 本月备注记录<br>";



let has=false;



for(let d in notes[key]||{}){


has=true;


noteHtml+=

"📅 "+
d+
"日："+
notes[key][d]
+
"<br>";



}



if(!has){


noteHtml+="暂无备注";


}




exportNotes.innerHTML=
noteHtml;



//放到卡片底部

card.appendChild(exportNotes);






//等待渲染


setTimeout(function(){



html2canvas(card,{


scale:4,


backgroundColor:null,


useCORS:true,


allowTaint:true



})


.then(function(canvas){



let a=
document.createElement("a");



a.download=

"磐石收益账本_"+

now.getFullYear()

+

"年"

+

(now.getMonth()+1)

+

"月.png";



a.href=
canvas.toDataURL(
"image/png",
1
);



a.click();




//清除临时元素


card.removeChild(watermark);


card.removeChild(exportNotes);



});



},300);



};




</script>



</body>

</html>
