/* ========== 通用结构 ========== */
.wrap{width:100%;max-width:440px;}
.card{position:relative;overflow:hidden;width:100%;padding:24px 18px;border-radius:30px;}
.card::before{content:"";position:absolute;width:500px;height:500px;left:-200px;top:-200px;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 60%);pointer-events:none;}
.card::after{content:"";position:absolute;width:300px;height:300px;right:-100px;bottom:-100px;background:radial-gradient(circle,rgba(255,255,255,.03),transparent 60%);pointer-events:none;}
.inner{position:absolute;inset:6px;border-radius:25px;border:1px solid rgba(255,255,255,.06);pointer-events:none;}
.title{position:relative;text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;}
.sub{text-align:center;margin-top:8px;font-size:12px;letter-spacing:3px;}
.theme{display:flex;gap:5px;margin:20px 0;flex-wrap:wrap;position:relative;}
.theme button{flex:1;min-width:52px;height:34px;border-radius:18px;font-size:11px;cursor:pointer;transition:all .2s;}
.stats{display:flex;gap:10px;position:relative;}
.stat{flex:1;padding:15px 5px;border-radius:16px;text-align:center;}
.label{font-size:11px;}
.value{margin-top:8px;font-size:20px;font-weight:900;}
.month{margin:22px 0;display:flex;align-items:center;justify-content:space-between;position:relative;}
.month button{width:42px;height:36px;border-radius:18px;background:none;font-size:22px;cursor:pointer;transition:all .2s;}
.month span{font-size:20px;font-weight:900;}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;margin-bottom:6px;opacity:.5;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:relative;}
.day{height:54px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;cursor:pointer;transition:all .15s;}
.day:hover{filter:brightness(1.15);}
.day input{width:90%;height:20px;border:0;outline:0;background:none;text-align:center!important;font-size:12px;font-weight:bold;}
.note-icon{position:absolute;right:3px;top:2px;font-size:10px;}
.note-box{margin-top:16px;padding:14px;border-radius:18px;position:relative;}
.note-title{font-weight:bold;margin-bottom:10px;font-size:13px;}
.note-item{font-size:12px;line-height:22px;}
.calculator{margin-top:16px;padding:15px;border-radius:20px;position:relative;}
.calc-title{text-align:center;font-size:17px;font-weight:900;margin-bottom:14px;}
.calculator input,.calculator select{width:100%;height:44px;margin-bottom:12px;border-radius:12px;outline:none;font-size:14px;text-align:center;}
.calculator select{appearance:none;cursor:pointer;}
#calcBtn{width:100%;height:46px;border-radius:15px;border:0;font-size:15px;font-weight:bold;cursor:pointer;transition:all .2s;}
#calcBtn:hover{filter:brightness(1.1);}
.calc-result{margin-top:12px;border-radius:15px;padding:12px;}
.calc-result div{display:flex;justify-content:space-between;padding:7px 4px;font-size:13px;}
.calc-result span{font-size:19px;font-weight:900;}
.buttons{display:flex;gap:12px;margin-top:20px;position:relative;}
.buttons button{flex:1;height:52px;border-radius:18px;font-size:15px;font-weight:bold;cursor:pointer;transition:all .2s;}
.buttons button:hover{filter:brightness(1.1);}
.export{border:0;}
.clear{background:transparent;}
.brand{margin-top:18px;text-align:center;font-size:10px;letter-spacing:6px;color:rgba(255,255,255,.2);}
.mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:999;backdrop-filter:blur(4px);}
.panel{width:85%;padding:24px;border-radius:22px;}
.panel h3{text-align:center;margin-bottom:16px;font-size:16px;}
.panel textarea{width:100%;height:130px;border-radius:15px;padding:12px;font-size:14px;resize:none;outline:none;}
.panel button{width:100%;height:46px;margin-top:15px;border-radius:15px;font-size:15px;font-weight:bold;cursor:pointer;border:0;}
</style>
</head>

<body class="gold">
<div class="wrap">
<div class="card" id="capture">

<script>
/* ========= 主题 ========= */
function changeTheme(t){
document.body.className=t;
try{localStorage.setItem("ps_theme",t);}catch(e){}
}
(function(){
try{
var t=localStorage.getItem("ps_theme");
document.body.className=t||"gold";
}catch(e){document.body.className="gold";}
})();

/* ========= 数据 ========= */
var now=new Date();
var income={},notes={};
try{income=JSON.parse(localStorage.getItem("ps_income")||"{}");}catch(e){}
try{notes=JSON.parse(localStorage.getItem("ps_notes")||"{}");}catch(e){}
var currentDay=null;
function getKey(){return now.getFullYear()+"-"+now.getMonth();}

/* ========= 日历 ========= */
function render(){
var y=now.getFullYear(),m=now.getMonth();
document.getElementById("ym").innerHTML=y+"年"+(m+1)+"月";
var grid=document.getElementById("grid");
grid.innerHTML="";
var first=(new Date(y,m,1).getDay()+6)%7;
var total=new Date(y,m+1,0).getDate();
var key=getKey();
if(!income[key])income[key]={};
if(!notes[key])notes[key]={};

for(var i=0;i<first;i++){
var e=document.createElement("div");
e.className="day";e.style.visibility="hidden";
grid.appendChild(e);
}

for(var d=1;d<=total;d++){
var box=document.createElement("div");
box.className="day";
if(income[key][d])box.classList.add("active");

if(notes[key][d]){
var ic=document.createElement("span");
ic.className="note-icon";ic.innerHTML="📝";
box.appendChild(ic);
}

var num=document.createElement("div");
num.innerHTML=d;num.style.fontSize="14px";num.style.fontWeight="bold";
box.appendChild(num);

var inp=document.createElement("input");
inp.value=income[key][d]||"";
inp.placeholder="0";inp.inputMode="numeric";

(function(k,day,box){
inp.oninput=function(){
this.value=this.value.replace(/\D/g,"").substring(0,8);
if(this.value){income[k][day]=Number(this.value);box.classList.add("active");}
else{delete income[k][day];box.classList.remove("active");}
try{localStorage.setItem("ps_income",JSON.stringify(income));}catch(e){}
calc();
};
})(key,d,box);

inp.onclick=function(e){e.stopPropagation();};
box.onclick=(function(day){return function(){openNote(day);};})(d);
box.appendChild(inp);
grid.appendChild(box);
}
calc();showNotes();
}

/* ========= 统计 ========= */
function calc(){
var key=getKey(),sum=0,days=0;
for(var i in income[key]||{}){if(income[key][i]){sum+=income[key][i];days++;}}
document.getElementById("sum").innerHTML="¥"+sum.toLocaleString();
document.getElementById("days").innerHTML=days;
document.getElementById("avg").innerHTML="¥"+(days?Math.round(sum/days):0).toLocaleString();
}

/* ========= 备注 ========= */
function openNote(day){
currentDay=day;
var key=getKey();
document.getElementById("noteTitle").innerHTML=(now.getMonth()+1)+"月"+day+"日备注";
document.getElementById("noteText").value=(notes[key]&&notes[key][day])||"";
document.getElementById("mask").style.display="flex";
}
document.getElementById("saveNote").onclick=function(){
var key=getKey(),txt=document.getElementById("noteText").value.trim();
if(!notes[key])notes[key]={};
if(txt)notes[key][currentDay]=txt;
else delete notes[key][currentDay];
try{localStorage.setItem("ps_notes",JSON.stringify(notes));}catch(e){}
document.getElementById("mask").style.display="none";
render();
};
document.getElementById("mask").onclick=function(e){if(e.target===this)this.style.display="none";};
function showNotes(){
var key=getKey(),box=document.getElementById("noteList"),html="";
for(var d in notes[key]||[])html+="<div>📝 "+d+"日："+notes[key][d]+"</div>";
box.innerHTML=html||"<span style='opacity:.4'>暂无备注</span>";
}

/* ========= 月份 ========= */
document.getElementById("prev").onclick=function(){now.setMonth(now.getMonth()-1);render();};
document.getElementById("next").onclick=function(){now.setMonth(now.getMonth()+1);render();};

/* ========= 清空 ========= */
document.getElementById("clear").onclick=function(){
if(confirm("确定清空本月收益？")){delete income[getKey()];try{localStorage.setItem("ps_income",JSON.stringify(income));}catch(e){}render();}
};

/* ========= 复利计算 ========= */
document.getElementById("calcBtn").onclick=function(){
var money=Number(document.getElementById("position").value);
var rate=Number(document.getElementById("incomeType").value);
var days=Number(document.getElementById("time").value);
if(!money||!days){alert("请输入本金和天数");return;}
var total=money*Math.pow(1+rate,days);
var profit=total-money;
document.getElementById("profit").innerHTML="¥"+Math.round(profit).toLocaleString();
document.getElementById("total").innerHTML="¥"+Math.round(total).toLocaleString();
document.getElementById("rateShow").innerHTML=(rate*100).toFixed(1)+"%/天";
};

/* ========= 高清导出（高端渲染）========= */
document.getElementById("export").onclick=function(){
var btn=this;
btn.innerHTML="渲染中...";

// 隐藏UI控件
var hideEls=[];
[".theme",".calculator",".buttons"].forEach(function(sel){
var el=document.querySelector(sel);if(el)hideEls.push(el);
});
hideEls.forEach(function(e){e.style.display="none";});

requestAnimationFrame(function(){
setTimeout(function(){
var card=document.getElementById("capture");
var rect=card.getBoundingClientRect();
var dpr=Math.min(window.devicePixelRatio||2,3);
var W=Math.round(rect.width*dpr),H=Math.round(rect.height*dpr);

var c=document.createElement("canvas");
c.width=W;c.height=H;
var ctx=c.getContext("2d");
ctx.scale(dpr,dpr);

// 读取当前主题色
var bodyCS=getComputedStyle(document.body);
var cardCS=getComputedStyle(card);
var borderColor=cardCS.borderColor||"#c9a84c";
var bgColor=cardCS.backgroundColor||"#111";

// 绘制卡片背景
var r=30;
roundRect(ctx,0,0,rect.width,rect.height,r);
ctx.fillStyle=bgColor;
ctx.fill();

// 绘制渐变叠加
var grad=ctx.createLinearGradient(0,0,rect.width,rect.height);
grad.addColorStop(0,"rgba(255,255,255,0.03)");
grad.addColorStop(0.5,"transparent");
grad.addColorStop(1,"rgba(255,255,255,0.02)");
ctx.fillStyle=grad;
ctx.fill();

// 边框
ctx.strokeStyle=borderColor;
ctx.lineWidth=1;
roundRect(ctx,0.5,0.5,rect.width-1,rect.height-1,r);
ctx.stroke();

// 顶部光晕
var glow=ctx.createRadialGradient(rect.width/2,-50,0,rect.width/2,0,300);
glow.addColorStop(0,rgbaFromColor(borderColor,0.08));
glow.addColorStop(1,"transparent");
ctx.fillStyle=glow;
ctx.fillRect(0,0,rect.width,200);

// 标题
ctx.textAlign="center";
var titleGrad=ctx.createLinearGradient(rect.width/2-80,35,rect.width/2+80,55);
titleGrad.addColorStop(0,"#ffffff");
titleGrad.addColorStop(1,lightenColor(borderColor,40));
ctx.fillStyle=titleGrad;
ctx.font="900 30px 'PingFang SC','Microsoft YaHei',sans-serif";
ctx.fillText("磐石收益账本",rect.width/2,50);

// 副标题
ctx.fillStyle=rgbaFromColor(borderColor,0.5);
ctx.font="12px 'PingFang SC',sans-serif";
ctx.fillText("财富记录 · 智能累计",rect.width/2,72);

// 统计卡片
var statY=88;
var statW=(rect.width-40)/3;
var stats=[
["累计收益","¥"+(function(){var k=getKey(),s=0;for(var i in income[k]||{})s+=income[k][i]||0;return s.toLocaleString();})()],
["收益天数",(function(){var k=getKey(),d=0;for(var i in income[k]||{})if(income[k][i])d++;return d;})()],
["日均收益","¥"+(function(){var k=getKey(),s=0,d=0;for(var i in income[k]||{}){if(income[k][i]){s+=income[k][i];d++;}}return d?Math.round(s/d).toLocaleString():0;})()]
];
stats.forEach(function(st,i){
var sx=10+i*(statW+10);
// 背景
roundRect(ctx,sx,statY,statW,68,14);
ctx.fillStyle=rgbaFromColor(borderColor,0.04);
ctx.fill();
ctx.strokeStyle=rgbaFromColor(borderColor,0.12);
ctx.lineWidth=0.5;
ctx.stroke();

ctx.fillStyle=rgbaFromColor(borderColor,0.6);
ctx.font="11px sans-serif";
ctx.textAlign="center";
ctx.fillText(st[0],sx+statW/2,statY+22);

ctx.fillStyle=lightenColor(borderColor,30);
ctx.font="900 19px sans-serif";
ctx.fillText(st[1],sx+statW/2,statY+46);
});

// 年月
var monY=statY+88;
ctx.fillStyle=lightenColor(borderColor,30);
ctx.font="900 20px 'PingFang SC',sans-serif";
ctx.textAlign="center";
ctx.fillText(now.getFullYear()+"年"+(now.getMonth()+1)+"月",rect.width/2,monY);

// 左右箭头
ctx.fillStyle=rgbaFromColor(borderColor,0.5);
ctx.font="22px sans-serif";
ctx.fillText("‹",30,monY);
ctx.fillText("›",rect.width-30,monY);

// 星期标题
var wkY=monY+22;
ctx.font="bold 11px sans-serif";
ctx.fillStyle=rgbaFromColor(borderColor,0.35);
var ww=(rect.width-20)/7;
["一","二","三","四","五","六","日"].forEach(function(w,i){
ctx.fillText(w,10+i*ww+ww/2,wkY);
});

// 日期网格
var cellW=(rect.width-20)/7;
var cellH=48;
var gridStartY=wkY+8;
var k=getKey();
var first=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7;
var totalDays=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();

for(var d=1;d<=totalDays;d++){
var idx=first+d-1;
var col=idx%7;var row=Math.floor(idx/7);
var cx=10+col*cellW;var cy=gridStartY+row*cellH;

// 日期框
if(income[k]&&income[k][d]){
roundRect(ctx,cx+1,cy+1,cellW-2,cellH-2,10);
ctx.fillStyle=rgbaFromColor(borderColor,0.08);
ctx.fill();
ctx.strokeStyle=borderColor;
ctx.lineWidth=1;
roundRect(ctx,cx+1.5,cy+1.5,cellW-3,cellH-3,10);
ctx.stroke();
// 发光
ctx.shadowColor=rgbaFromColor(borderColor,0.3);
ctx.shadowBlur=8;
ctx.stroke();
ctx.shadowBlur=0;
}

ctx.fillStyle="#fff";
ctx.font="bold 14px sans-serif";
ctx.textAlign="center";
ctx.fillText(d,cx+cellW/2,cy+20);

if(income[k]&&income[k][d]){
ctx.fillStyle=lightenColor(borderColor,20);
ctx.font="11px sans-serif";
var val=String(income[k][d]);
if(val.length>6)val=val.substring(0,6);
ctx.fillText(val,cx+cellW/2,cy+38);
}
if(notes[k]&&notes[k][d]){
ctx.font="10px sans-serif";
ctx.fillText("📝",cx+cellW-12,cy+8);
}

// 备注区域
var noteY=gridStartY+Math.ceil((first+totalDays)/7)*cellH+12;
ctx.textAlign="left";
ctx.fillStyle=rgbaFromColor(borderColor,0.5);
ctx.font="bold 13px sans-serif";
ctx.fillText("📝 日期备注",14,noteY);

var niY=noteY+20;
ctx.font="12px sans-serif";
var n=0;
if(notes[k]){
for(var dk in notes[k]){
if(n<6){ctx.fillStyle=rgbaFromColor(borderColor,0.4);ctx.fillText("📝 "+dk+"日："+notes[k][dk],14,niY+n*20);n++;}
}
}else{
ctx.fillStyle=rgbaFromColor(borderColor,0.2);
ctx.fillText("暂无备注",14,niY);
}

// 底部品牌
var brandY=niY+(n||1)*20+20;
ctx.fillStyle=rgbaFromColor(borderColor,0.15);
ctx.font="10px sans-serif";
ctx.textAlign="center";
ctx.fillText("P A N S H I · WEALTH",rect.width/2,brandY);

// 右下角水印
ctx.fillStyle=rgbaFromColor(borderColor,0.1);
ctx.font="9px sans-serif";
ctx.textAlign="right";
var now2=new Date();
ctx.fillText("生成于 "+now2.getFullYear()+"-"+(now2.getMonth()+1)+"-"+now2.getDate(),rect.width-14,brandY);

// 导出
c.toBlob(function(blob){
var url=URL.createObjectURL(blob);
var a=document.createElement("a");
a.href=url;
a.download="磐石收益账本_"+now.getFullYear()+"年"+(now.getMonth()+1)+"月.png";
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);},1000);
hideEls.forEach(function(e){e.style.display="";});
btn.innerHTML="📸 高清导出";
},"image/png",0.95);
},150);
});
};

/* ========= 工具函数 ========= */
function roundRect(ctx,x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}

function rgbaFromColor(hex,r){
var result=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
if(result){
return "rgba("+parseInt(result[1],16)+","+parseInt(result[2],16)+","+parseInt(result[3],16)+","+r+")";
}
// 处理rgb/rgba格式
var m2=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(hex);
if(m2)return "rgba("+m2[1]+","+m2[2]+","+m2[3]+","+r+")";
return "rgba(200,200,200,"+r+")";
}

function lightenColor(hex,p){
var result=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
if(result){
var r=Math.min(255,parseInt(result[1],16)+p);
var g=Math.min(255,parseInt(result[2],16)+p);
var b=Math.min(255,parseInt(result[3],16)+p);
return "rgb("+r+","+g+","+b+")";
}
return "#ffffff";
}

render();
</script>
