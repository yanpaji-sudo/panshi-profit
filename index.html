<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>磐石收益账本 V3.1</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}



body{

min-height:100vh;

padding:15px;

display:flex;

justify-content:center;

background:#050505;

font-family:

"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;

}




/* =====================
八大主题
===================== */


body.gold{

--bg:#080808;
--card:#111111;
--main:#c9a84c;
--light:#ffeeb0;
--sub:#9c8750;

}



body.jade{

--bg:#031710;
--card:#08271d;
--main:#23c997;
--light:#d0fff2;
--sub:#65a890;

}



body.blue{

--bg:#061326;
--card:#0b203d;
--main:#4da3ff;
--light:#d8ecff;
--sub:#7698c0;

}



body.purple{

--bg:#12051d;
--card:#221035;
--main:#b46cff;
--light:#efd7ff;
--sub:#a58ac0;

}



body.black{

--bg:#000000;
--card:#080808;
--main:#eeeeee;
--light:#ffffff;
--sub:#777777;

}



body.rose{

--bg:#1b080d;
--card:#2b1119;
--main:#ff8fa3;
--light:#ffe0e8;
--sub:#d18b9b;

}



body.ocean{

--bg:#02131d;
--card:#062b3a;
--main:#20d5ff;
--light:#d9f8ff;
--sub:#6aaabd;

}



body.silver{

--bg:#111111;
--card:#222222;
--main:#dddddd;
--light:#ffffff;
--sub:#999999;

}





.wrap{

width:100%;

max-width:440px;

}





.card{


position:relative;

overflow:hidden;

width:100%;


padding:24px 18px;


border-radius:30px;


background:


linear-gradient(
160deg,
rgba(255,255,255,.1),
transparent 35%
),


var(--card);



border:1px solid var(--main);



box-shadow:

0 20px 80px rgba(0,0,0,.8);


}



.card:before{


content:"";


position:absolute;


width:420px;

height:420px;


left:-160px;

top:-160px;



background:

radial-gradient(
circle,
rgba(255,255,255,.15),
transparent 65%
);


}





.inner{


position:absolute;

inset:6px;


border-radius:25px;


border:

1px solid rgba(255,255,255,.12);


pointer-events:none;


}




.title{


position:relative;


text-align:center;


font-size:30px;


font-weight:900;


letter-spacing:5px;



background:

linear-gradient(
180deg,
#fff,
var(--light)
);



-webkit-background-clip:text;


color:transparent;


}





.sub{


text-align:center;


font-size:12px;


margin-top:8px;


letter-spacing:3px;


color:var(--sub);


}



.theme{


display:flex;


gap:5px;


margin:20px 0;


flex-wrap:wrap;


}




.theme button{


flex:1;


min-width:60px;


height:34px;


border-radius:18px;


border:

1px solid var(--main);



background:

rgba(255,255,255,.05);



color:var(--light);



font-size:11px;


}
<!-- 第2段 / 4段 -->


<style>


.stats{

display:flex;

gap:10px;

}



.stat{

flex:1;

padding:15px 5px;

border-radius:16px;


background:

rgba(255,255,255,.05);



border:

1px solid rgba(255,255,255,.12);



text-align:center;

}




.label{

font-size:11px;

color:var(--sub);

}




.value{

margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--light);

}




.month{

margin:22px 0;

display:flex;

align-items:center;

justify-content:space-between;

}




.month button{


width:42px;

height:36px;

border-radius:18px;


background:none;


border:

1px solid var(--main);


color:var(--light);


font-size:25px;


}




.month span{


font-size:20px;

font-weight:900;


color:var(--light);


}





.week{


display:grid;

grid-template-columns:repeat(7,1fr);


text-align:center;


font-size:12px;


color:var(--sub);


margin-bottom:8px;


}




.grid{


display:grid;


grid-template-columns:repeat(7,1fr);


gap:6px;


}





.day{


height:58px;


border-radius:12px;


background:

rgba(255,255,255,.04);



border:

1px solid rgba(255,255,255,.1);



display:flex;


flex-direction:column;


align-items:center;


justify-content:center;



position:relative;


}





.day.active{


border-color:var(--main);


background:

rgba(255,255,255,.08);


}





.day input{


width:90%;


height:22px;


border:0;


outline:0;


background:transparent;


text-align:center!important;


color:var(--light);


font-size:13px;


font-weight:bold;


}





.note-icon{


position:absolute;


right:3px;


top:2px;


font-size:11px;


}




.note-box{


margin-top:18px;


padding:14px;


border-radius:18px;


background:

rgba(255,255,255,.05);



border:

1px solid rgba(255,255,255,.12);



}





.note-title{


font-weight:bold;


color:var(--light);


margin-bottom:10px;


}




.note-item{


font-size:12px;


line-height:24px;


color:var(--sub);


}






.calculator{


margin-top:18px;


padding:15px;


border-radius:20px;


border:

1px solid var(--main);



background:

rgba(255,255,255,.05);


}




.calc-title{


text-align:center;


font-size:18px;


font-weight:900;


color:var(--light);


margin-bottom:15px;


}




.calculator input,


.calculator select{


width:100%;


height:45px;


margin-bottom:12px;


border-radius:12px;


background:#000;


border:

1px solid var(--main);



color:var(--light);



text-align:center;


outline:none;


}





#calcBtn{


width:100%;


height:45px;


border-radius:15px;


border:0;


background:var(--main);


font-weight:bold;


}





.calc-result{


margin-top:12px;


padding:10px;


background:#000;


border-radius:15px;


}



.calc-result div{


display:flex;


justify-content:space-between;


padding:8px;


color:var(--sub);


}





.calc-result span{


font-size:20px;


font-weight:900;


color:var(--light);


}





.buttons{


display:flex;


gap:12px;


margin-top:20px;


}




.buttons button{


flex:1;


height:52px;


border-radius:18px;


font-size:15px;


font-weight:bold;


}




.export{


border:0;


background:

linear-gradient(
135deg,
var(--main),
var(--light)
);


}





.clear{


background:none;


border:

1px solid var(--main);


color:var(--light);


}





.brand{


margin-top:20px;


text-align:center;


font-size:11px;


letter-spacing:5px;


color:rgba(255,255,255,.3);


}





.mask{


position:fixed;


inset:0;


display:none;


align-items:center;


justify-content:center;


background:

rgba(0,0,0,.75);


z-index:999;


}




.panel{


width:85%;


background:#111;


border:

1px solid var(--main);


border-radius:22px;


padding:20px;


}




.panel h3{


text-align:center;


color:var(--light);


margin-bottom:15px;


}




.panel textarea{


width:100%;


height:130px;


background:#000;


border:

1px solid var(--main);


border-radius:15px;


color:white;


padding:10px;


resize:none;


}





.panel button{


width:100%;


height:45px;


margin-top:15px;


border:0;


border-radius:15px;


background:var(--main);


font-weight:bold;


}


</style>


</head>


<body class="gold">


<div class="wrap">


<div class="card" id="capture">


<div class="inner"></div>


<div class="title">

磐石收益账本

</div>


<div class="sub">

财富记录 · 智能累计

</div>



<div class="theme">


<button onclick="changeTheme('gold')">鎏金</button>

<button onclick="changeTheme('jade')">翡翠</button>

<button onclick="changeTheme('blue')">星耀</button>

<button onclick="changeTheme('purple')">紫晶</button>

<button onclick="changeTheme('black')">黑钻</button>

<button onclick="changeTheme('rose')">玫瑰</button>

<button onclick="changeTheme('ocean')">深海</button>

<button onclick="changeTheme('silver')">银灰</button>


</div>
<!-- 第3段 / 4段 -->


<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>

</div>




<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>

</div>




<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>

</div>


</div>






<div class="month">


<button id="prev">
‹
</button>


<span id="ym"></span>


<button id="next">
›
</button>


</div>





<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>





<div class="grid" id="grid"></div>






<div class="note-box">


<div class="note-title">

📝 日期备注

</div>



<div id="noteList">

暂无备注

</div>



</div>






<div class="calculator">


<div class="calc-title">

📈 收益计算器

</div>




<input id="position"

type="number"

placeholder="输入仓位金额">





<select id="incomeType">


<option value="0.018">

动态收入（日息1.8%）

</option>


<option value="0.012">

静态收入（日息1.2%）

</option>


</select>






<input id="time"

type="number"

placeholder="输入时间（天）">





<button id="calcBtn">

计算盈利

</button>






<div class="calc-result">


<div>

纯利润

<span id="profit">

¥0

</span>

</div>



<div>

总金额

<span id="total">

¥0

</span>

</div>



</div>


</div>






<div class="buttons">


<button class="export" id="export">

📸 高清导出

</button>


<button class="clear" id="clear">

清空

</button>


</div>





<div class="brand">

P A N S H I · WEALTH

</div>



</div>

</div>






<div class="mask" id="mask">


<div class="panel">


<h3 id="noteTitle">

日期备注

</h3>


<textarea id="noteText"

placeholder="输入当天备注">

</textarea>




<button id="saveNote">

保存备注

</button>


</div>


</div>







<script>


//======================
//主题修复版
//======================


function changeTheme(type){


let list=[

"gold",
"jade",
"blue",
"purple",
"black",
"rose",
"ocean",
"silver"

];



list.forEach(function(t){

document.body.classList.remove(t);

});



document.body.classList.add(type);



localStorage.setItem(
"ps_theme",
type
);


}



let saveTheme=

localStorage.getItem("ps_theme");



if(saveTheme){

document.body.classList.add(saveTheme);

}






//======================
//数据
//======================


let now=new Date();



let income=

JSON.parse(

localStorage.getItem("ps_income")

||

"{}"

);





let notes=

JSON.parse(

localStorage.getItem("ps_notes")

||

"{}"

);





function getKey(){


return now.getFullYear()

+

"-"

+

now.getMonth();


}




let currentDay=null;





//======================
//日历
//======================


function render(){


let y=now.getFullYear();


let m=now.getMonth();




document.getElementById("ym").innerHTML=

y+"年"+(m+1)+"月";





let grid=document.getElementById("grid");


grid.innerHTML="";





let first=

(new Date(y,m,1).getDay()+6)%7;



let total=

new Date(y,m+1,0).getDate();





for(let i=0;i<first;i++){


let e=document.createElement("div");


e.className="day";


e.style.visibility="hidden";


grid.appendChild(e);


}




let key=getKey();



if(!income[key]) income[key]={};

if(!notes[key]) notes[key]={};





for(let d=1;d<=total;d++){


let box=document.createElement("div");


box.className="day";





if(income[key][d]){


box.classList.add("active");


}




if(notes[key][d]){


let icon=document.createElement("span");


icon.className="note-icon";


icon.innerHTML="📝";


box.appendChild(icon);


}





let num=document.createElement("div");


num.innerHTML=d;


box.appendChild(num);





let input=document.createElement("input");



input.value=

income[key][d]||"";



input.placeholder="0";



input.inputMode="numeric";





input.oninput=function(){


this.value=this.value

.replace(/\D/g,"")

.substring(0,8);




if(this.value){


income[key][d]=Number(this.value);


box.classList.add("active");


}else{


delete income[key][d];


box.classList.remove("active");


}





localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();



};




input.onclick=function(e){

e.stopPropagation();

};



box.onclick=function(){

openNote(d);

};



box.appendChild(input);


grid.appendChild(box);



}



calc();


showNotes();


}

<!-- 第4段 / 4段 -->


//======================
//统计
//======================


function calc(){


let key=getKey();


let sum=0;

let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(income[key][i]);

days++;


}


}



document.getElementById("sum").innerHTML=

"¥"+sum.toLocaleString();



document.getElementById("days").innerHTML=

days;



document.getElementById("avg").innerHTML=

"¥"+

(

days?

Math.round(sum/days):

0

)

.toLocaleString();



}





//======================
//备注
//======================


function openNote(day){


currentDay=day;


let key=getKey();



document.getElementById("noteTitle").innerHTML=

(now.getMonth()+1)

+

"月"

+

day

+

"日备注";




document.getElementById("noteText").value=

notes[key][day]||"";





document.getElementById("mask")

.style.display="flex";



}





document.getElementById("saveNote")

.onclick=function(){



let key=getKey();



let text=

document.getElementById("noteText")

.value

.trim();





if(!notes[key]){

notes[key]={};

}





if(text){


notes[key][currentDay]=text;


}else{


delete notes[key][currentDay];


}





localStorage.setItem(

"ps_notes",

JSON.stringify(notes)

);




document.getElementById("mask")

.style.display="none";



render();



};







document.getElementById("mask")

.onclick=function(e){



if(e.target===this){


this.style.display="none";


}



};








function showNotes(){


let key=getKey();


let box=document.getElementById("noteList");


let html="";




for(let d in notes[key]||{}){


html+=

"<div class='note-item'>📝 "

+

d

+

"日："

+

notes[key][d]

+

"</div>";



}




box.innerHTML=

html||"暂无备注";



}







//======================
//月份切换
//======================



document.getElementById("prev")

.onclick=function(){


now.setMonth(

now.getMonth()-1

);


render();


};





document.getElementById("next")

.onclick=function(){


now.setMonth(

now.getMonth()+1

);


render();


};







//======================
//清空
//======================


document.getElementById("clear")

.onclick=function(){



if(confirm("确定清空本月收益记录？")){


delete income[getKey()];



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



render();


}



};








//======================
//收益计算器
//======================


document.getElementById("calcBtn")

.onclick=function(){



let money=

Number(

document.getElementById("position")

.value

);



let rate=

Number(

document.getElementById("incomeType")

.value

);



let time=

Number(

document.getElementById("time")

.value

);






if(!money||!time){


alert("请输入仓位和时间");


return;


}





let profit=

money*

rate*

time;





let total=

money+

profit;






document.getElementById("profit")

.innerHTML=

"¥"+

Math.round(profit)

.toLocaleString();






document.getElementById("total")

.innerHTML=

"¥"+

Math.round(total)

.toLocaleString();



};









//======================
//高清导出
//======================


document.getElementById("export")

.onclick=function(){



let card=document.getElementById("capture");



let hide=[

document.querySelector(".theme"),

document.querySelector(".calculator"),

document.querySelector(".buttons")

];




hide.forEach(function(e){

e.style.display="none";

});







html2canvas(card,{

scale:4,

backgroundColor:null,

useCORS:true

})

.then(function(canvas){



let a=document.createElement("a");



a.download=

"磐石收益账本_"

+

now.getFullYear()

+

"年"

+

(now.getMonth()+1)

+

"月.png";





a.href=

canvas.toDataURL(

"image/png"

);



a.click();





hide.forEach(function(e){

e.style.display="";

});



});



};






//启动


render();



</script>


</body>

</html>
