<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>磐石收益账本</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

background:#050505;

min-height:100vh;

display:flex;

justify-content:center;

align-items:flex-start;

padding:15px;

font-family:
"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;

transition:.3s;

}


/* 三主题 */

body.gold{

--bg:#070707;
--card:#111;
--main:#c9a84c;
--gold:#f9e7a0;
--text:#fff0c0;
--sub:#8d7740;

}


body.jade{

--bg:#04150f;
--card:#09251b;
--main:#21c997;
--gold:#c8fff0;
--text:#dffff7;
--sub:#5ba98d;

}


body.blue{

--bg:#06101f;
--card:#0c1c34;
--main:#4fa3ff;
--gold:#d9ecff;
--text:#e8f5ff;
--sub:#7896bb;

}


.wrap{

width:100%;

max-width:430px;

}



.card{

position:relative;

width:100%;

background:

linear-gradient(
160deg,
rgba(255,255,255,.08),
transparent 35%
),

var(--card);


border-radius:28px;

padding:25px 18px;

overflow:hidden;


border:1px solid var(--main);


box-shadow:

0 15px 60px rgba(0,0,0,.8);

}



.card:before{

content:"";

position:absolute;

width:300px;

height:300px;

left:-100px;

top:-100px;


background:

radial-gradient(
circle,
rgba(255,255,255,.12),
transparent 65%
);

}




.inner{

position:absolute;

left:5px;
right:5px;
top:5px;
bottom:5px;

border:1px solid rgba(255,255,255,.12);

border-radius:23px;

}




.title{

position:relative;

text-align:center;

font-size:30px;

font-weight:900;

letter-spacing:5px;


background:
linear-gradient(
180deg,
#fff,
var(--gold)
);


-webkit-background-clip:text;

color:transparent;

}



.sub{

text-align:center;

font-size:12px;

letter-spacing:3px;

color:var(--sub);

margin-top:8px;

}




.theme{

display:flex;

gap:10px;

margin:20px 0;

}



.theme button{

flex:1;

height:36px;

border-radius:18px;

border:1px solid var(--main);

background:rgba(255,255,255,.05);

color:var(--gold);

font-size:13px;

}





.stats{

display:flex;

gap:10px;

}


.stat{

flex:1;

background:rgba(255,255,255,.05);

border-radius:15px;

padding:15px 5px;

text-align:center;

border:1px solid rgba(255,255,255,.1);

}



.label{

font-size:11px;

color:var(--sub);

}


.value{

margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--gold);

}




.month{

display:flex;

justify-content:space-between;

align-items:center;

margin:22px 0;

}


.month button{

width:42px;

height:36px;

border-radius:18px;

border:1px solid var(--main);

background:none;

color:var(--gold);

font-size:20px;

}



.month span{

font-size:20px;

font-weight:bold;

color:var(--gold);

}




.week{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

font-size:12px;

color:var(--sub);

margin-bottom:8px;

}




.grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;

}




.day{

height:55px;

background:rgba(255,255,255,.04);

border-radius:10px;

border:1px solid rgba(255,255,255,.1);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

font-size:12px;

color:var(--gold);

}



.day.active{

border-color:var(--main);

background:rgba(201,168,76,.15);

}



.day input{

width:80%;

border:none;

outline:none;

background:none;

text-align:center;

color:var(--gold);

font-size:11px;

}




.buttons{

display:flex;

gap:12px;

margin-top:20px;

}


.buttons button{

flex:1;

height:52px;

border-radius:16px;

font-size:15px;

font-weight:bold;

}



.export{

border:none;

background:

linear-gradient(
135deg,
var(--main),
var(--gold)
);

color:#111;

}



.clear{

background:none;

border:1px solid var(--main);

color:var(--gold);

}




.brand{

margin-top:20px;

text-align:center;

font-size:11px;

letter-spacing:5px;

color:rgba(255,255,255,.25);

}




canvas{

display:none;

}



</style>

</head>


<body class="gold">


<div class="wrap">


<div class="card">


<div class="inner"></div>


<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 智能累计
</div>



<div class="theme">

<button onclick="changeTheme('gold')">
鎏金
</button>

<button onclick="changeTheme('jade')">
玉石
</button>

<button onclick="changeTheme('blue')">
星耀
</button>

</div>




<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>

</div>


<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>

</div>


<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>

</div>


</div>




<div class="month">

<button id="prev">
‹
</button>

<span id="ym"></span>

<button id="next">
›
</button>

</div>



<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>



<div class="grid" id="grid"></div>



<div class="buttons">

<button class="export" id="export">
📸 导出图片
</button>


<button class="clear" id="clear">
清空
</button>

</div>



<div class="brand">
P A N S H I · WEALTH
</div>


</div>

</div>



<canvas id="cv" width="1200" height="1800"></canvas>


<script>


//=====================
// 主题切换
//=====================


function changeTheme(type){

document.body.className=type;

localStorage.setItem(
"ps_theme",
type
);

}



let oldTheme=
localStorage.getItem("ps_theme");


if(oldTheme){

document.body.className=oldTheme;

}



//=====================
// 数据
//=====================


let now=new Date();


let income=
JSON.parse(

localStorage.getItem(
"ps_income"
)

||

"{}"

);



function getKey(){

return now.getFullYear()
+
"-"
+
now.getMonth();

}




//=====================
// 渲染
//=====================


function render(){


let y=
now.getFullYear();


let m=
now.getMonth();



document.getElementById("ym")
.innerHTML=
y+"年"+(m+1)+"月";



let grid=
document.getElementById("grid");


grid.innerHTML="";



let first=
new Date(
y,
m,
1
)
.getDay();



let start=
(first+6)%7;



let totalDay=
new Date(
y,
m+1,
0
)
.getDate();



for(let i=0;i<start;i++){

let e=document.createElement("div");

e.className="day";

e.style.visibility="hidden";

grid.appendChild(e);

}



let key=
getKey();



if(!income[key]){

income[key]={};

}




for(let d=1;d<=totalDay;d++){



let box=
document.createElement("div");


box.className="day";



let old=
income[key][d]
||
"";



if(old){

box.classList.add("active");

}




let number=
document.createElement("div");

number.innerHTML=d;



let input=
document.createElement("input");


input.value=old;


input.placeholder="0";



input.oninput=function(){


this.value=
this.value
.replace(/\D/g,"")
.substring(0,8);



if(this.value){

income[key][d]=
Number(this.value);

box.classList.add("active");


}else{

delete income[key][d];

box.classList.remove("active");

}



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();



};



box.appendChild(number);

box.appendChild(input);


grid.appendChild(box);



}


calc();


}




//=====================
// 统计
//=====================



function calc(){


let key=getKey();


let sum=0;

let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=
Number(income[key][i]);


days++;


}

}




document.getElementById("sum")
.innerHTML=
"¥"+
sum.toLocaleString();



document.getElementById("days")
.innerHTML=
days;



document.getElementById("avg")
.innerHTML=
"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}



//=====================
// 月份
//=====================


document
.getElementById("prev")
.onclick=function(){

now.setMonth(
now.getMonth()-1
);

render();

};



document
.getElementById("next")
.onclick=function(){

now.setMonth(
now.getMonth()+1
);

render();

};




//=====================
// 清空
//=====================


document
.getElementById("clear")
.onclick=function(){


if(confirm("确定清空本月记录？")){


delete income[getKey()];


localStorage.setItem(

"ps_income",

JSON.stringify(income)

);


render();


}


};




//=====================
// 导出图片
//=====================


document
.getElementById("export")
.onclick=function(){


let canvas=
document.getElementById("cv");


let ctx=
canvas.getContext("2d");


let W=1200;

let H=1800;



ctx.clearRect(
0,
0,
W,
H
);



//颜色


let theme=
document.body.className;



let main="#c9a84c";

let light="#f9e7a0";

let bg="#111";



if(theme=="jade"){

main="#21c997";

light="#c8fff0";

bg="#09251b";

}


if(theme=="blue"){

main="#4fa3ff";

light="#d9ecff";

bg="#0c1c34";

}



//背景


let bgc=
ctx.createLinearGradient(
0,
0,
0,
H
);


bgc.addColorStop(
0,
bg
);


bgc.addColorStop(
1,
"#000"
);


ctx.fillStyle=bgc;

ctx.fillRect(
0,
0,
W,
H
);




//卡片


ctx.fillStyle=
"rgba(0,0,0,.6)";


ctx.strokeStyle=
main;


ctx.lineWidth=3;


ctx.beginPath();

ctx.moveTo(60,60);

ctx.lineTo(1140,60);

ctx.lineTo(1140,1740);

ctx.lineTo(60,1740);

ctx.closePath();

ctx.fill();

ctx.stroke();





//标题


ctx.textAlign="center";


ctx.fillStyle=light;


ctx.font=
"bold 70px Microsoft YaHei";


ctx.fillText(
"磐石收益账本",
600,
170
);




ctx.font=
"28px Microsoft YaHei";


ctx.fillText(
"财富记录 · 智能累计",
600,
230
);




//统计


let key=getKey();

let sum=0;

let days=0;


for(let i in income[key]||{}){

if(income[key][i]){

sum+=Number(income[key][i]);

days++;

}

}


let avg=
days?
Math.round(sum/days):
0;



ctx.font=
"32px Arial";


ctx.fillStyle=light;


ctx.fillText(
"累计 ¥"+sum.toLocaleString()
+
"     天数 "+days
+
"     日均 ¥"+avg.toLocaleString(),
600,
330
);




//日期


let y=now.getFullYear();

let m=now.getMonth();


ctx.font=
"40px Microsoft YaHei";

ctx.fillText(

y+"年"+(m+1)+"月",

600,

430

);




//日历


let gx=90;

let gy=520;


let cw=140;

let ch=100;

let gap=10;


let first=
(new Date(y,m,1).getDay()+6)%7;


let max=
new Date(y,m+1,0).getDate();



let bottom=gy;



for(let d=1;d<=max;d++){


let index=
first+d-1;


let row=
Math.floor(index/7);


let col=
index%7;



let x=
gx+col*(cw+gap);



let yy=
gy+row*(ch+gap);



bottom=
yy+ch;



ctx.strokeStyle=
"rgba(255,255,255,.15)";


ctx.strokeRect(
x,
yy,
cw,
ch
);



ctx.fillStyle=light;


ctx.font=
"26px Arial";


ctx.fillText(
d,
x+70,
yy+35
);



let v=
income[key]&&income[key][d];

if(v){

ctx.font=
"28px Arial";

ctx.fillText(
v,
x+70,
yy+75
);


}



}



//=====================
// 自动水印
//=====================



let wmY=
bottom+120;


if(wmY>1450){

wmY=1450;

}



ctx.font=
"bold 60px Microsoft YaHei";


ctx.lineWidth=12;

ctx.strokeStyle=
"rgba(0,0,0,.8)";


ctx.strokeText(
"加入磐石开启财富人生",
600,
wmY
);



ctx.fillStyle=main;


ctx.globalAlpha=.7;


ctx.fillText(
"加入磐石开启财富人生",
600,
wmY
);



ctx.globalAlpha=1;



ctx.font=
"22px Arial";


ctx.fillStyle=
"rgba(255,255,255,.4)";


ctx.fillText(
"P A N S H I · WEALTH",
600,
wmY+70
);




//下载


canvas.toBlob(function(blob){


let a=document.createElement("a");


a.href=
URL.createObjectURL(blob);


a.download=
"磐石收益账本.png";


a.click();


},


"image/png"

);



};




//启动

render();


</script>
</body>
</html>
