/* 通用结构样式 */
.wrap{width:100%;max-width:440px;}
.card{position:relative;overflow:hidden;width:100%;padding:24px 18px;border-radius:30px;border-width:1px;border-style:solid;}
.card:before{content:"";position:absolute;width:420px;height:420px;left:-160px;top:-160px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);pointer-events:none;}
.inner{position:absolute;inset:6px;border-radius:25px;border:1px solid rgba(255,255,255,.1);pointer-events:none;}
.title{position:relative;text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;}
.sub{text-align:center;margin-top:8px;font-size:12px;letter-spacing:3px;}
.theme{display:flex;gap:5px;margin:20px 0;flex-wrap:wrap;}
.theme button{flex:1;min-width:60px;height:34px;border-radius:18px;background:rgba(255,255,255,.05);font-size:11px;cursor:pointer;border-width:1px;border-style:solid;}
.theme button:hover{filter:brightness(1.2);}
.stats{display:flex;gap:10px;}
.stat{flex:1;padding:15px 5px;border-radius:16px;text-align:center;border-width:1px;border-style:solid;}
.label{font-size:11px;}
.value{margin-top:8px;font-size:20px;font-weight:900;}
.month{margin:22px 0;display:flex;align-items:center;justify-content:space-between;}
.month button{width:42px;height:36px;border-radius:18px;background:none;font-size:25px;cursor:pointer;border-width:1px;border-style:solid;}
.month span{font-size:20px;font-weight:900;}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;margin-bottom:8px;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{height:58px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;cursor:pointer;border-width:1px;border-style:solid;}
.day-num{font-size:12px;font-weight:bold;line-height:1;margin-bottom:2px;}
.day input{width:90%;height:22px;border:0;outline:0;background:none;text-align:center!important;font-size:13px;font-weight:bold;}
.day input::placeholder{font-size:11px;}
.note-icon{position:absolute;right:3px;top:2px;font-size:11px;}
.note-box{margin-top:18px;padding:14px;border-radius:18px;border-width:1px;border-style:solid;}
.note-title{font-weight:bold;margin-bottom:10px;}
.note-item{font-size:12px;line-height:22px;}
.calculator{margin-top:18px;padding:15px;border-radius:20px;border-width:1px;border-style:solid;}
.calc-title{text-align:center;font-size:18px;font-weight:900;margin-bottom:15px;}
.calculator input,.calculator select{width:100%;height:45px;margin-bottom:12px;border-radius:12px;background:#000;outline:none;font-size:14px;text-align:center;border-width:1px;border-style:solid;}
#calcBtn{width:100%;height:45px;border-radius:15px;border:0;font-size:15px;font-weight:bold;cursor:pointer;}
.calc-result{margin-top:12px;background:#000;border-radius:15px;padding:10px;}
.calc-result div{display:flex;justify-content:space-between;padding:8px;font-size:13px;}
.calc-result span{font-size:20px;font-weight:900;}
.buttons{display:flex;gap:12px;margin-top:20px;}
.buttons button{flex:1;height:52px;border-radius:18px;font-size:15px;font-weight:bold;cursor:pointer;border-width:0;}
.export{border-width:0;}
.clear{background:transparent;}
.brand{margin-top:20px;text-align:center;font-size:11px;letter-spacing:5px;color:rgba(255,255,255,.25);}
.mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:999;}
.panel{width:85%;padding:20px;border-radius:22px;border-width:1px;border-style:solid;}
.panel h3{text-align:center;margin-bottom:15px;font-size:16px;}
.panel textarea{width:100%;height:130px;border-radius:15px;padding:10px;font-size:14px;resize:none;outline:none;}
.panel button{width:100%;height:45px;margin-top:15px;border-radius:15px;font-size:15px;font-weight:bold;cursor:pointer;border-width:0;}

/* 移动端点击反馈 */
@media (hover:none){
.day:active{opacity:0.7;transform:scale(0.95);}
.day{transition:transform 0.1s,opacity 0.1s;}
}
</style>
</head>

<body class="gold">
<div class="wrap">
<div class="card" id="capture">
<div class="inner"></div>
<div class="title">磐石收益账本</div>
<div class="sub">财富记录 · 智能累计</div>

<div class="theme">
<button onclick="changeTheme('gold')">鎏金</button>
<button onclick="changeTheme('jade')">翡翠</button>

<button onclick="changeTheme('rose')">玫瑰</button>

</div>

</div>

</div>

</div>
</div>

</div>

</div>
</div>

<div class="mask" id="mask">
<div class="panel">
<h3 id="noteTitle">日期备注</h3>
<textarea id="noteText" placeholder="输入当天备注"></textarea>
<button id="saveNote">保存备注</button>
</div>

ocean:{main:"#20d5ff",light:"#d9f8ff",dark:"#0a8abf",bg1:"#03151f",bg2:"#052030",bg3:"#072b41",cardBg1:"#082030",cardBg2:"#041520",cardBg3:"#020a10",textLight:"rgba(217,248,255,0.4)",textBright:"#d9f8ff",icon:"💎"},
silver:{main:"#dddddd",light:"#ffffff",dark:"#999999",bg1:"#1a1a1a",bg2:"#222222",bg3:"#2a2a2a",cardBg1:"#222222",cardBg2:"#1a1a1a",cardBg3:"#111111",textLight:"rgba(255,255,255,0.4)",textBright:"#ffffff",icon:"🤍"}
};

function getCurrentTheme(){
var t=document.body.className;
return themeColors[t]||themeColors.gold;
}

/* ========= 主题切换 ========= */
function changeTheme(t){
document.body.className=t;
try{localStorage.setItem("ps_theme",t);}catch(e){}
}
(function(){
var t=localStorage.getItem("ps_theme");
document.body.className=t?t:"gold";
})();

/* ========= 数据 ========= */
var now=new Date();
var income={},notes={};
try{income=JSON.parse(localStorage.getItem("ps_income")||"{}");}catch(e){}
try{notes=JSON.parse(localStorage.getItem("ps_notes")||"{}");}catch(e){}
var currentDay=null;

function getKey(){return now.getFullYear()+"-"+now.getMonth();}

/* ========= 日历 ========= */
function render(){
var y=now.getFullYear(),m=now.getMonth();
document.getElementById("ym").innerHTML=y+"年"+(m+1)+"月";
var grid=document.getElementById("grid");
grid.innerHTML="";
var first=(new Date(y,m,1).getDay()+6)%7;
var total=new Date(y,m+1,0).getDate();
var key=getKey();
if(!income[key])income[key]={};
if(!notes[key])notes[key]={};

for(var i=0;i<first;i++){
var e=document.createElement("div");
e.className="day";e.style.visibility="hidden";
grid.appendChild(e);
}

for(var d=1;d<=total;d++){
var box=document.createElement("div");
box.className="day";
if(income[key][d])box.classList.add("active");

if(notes[key][d]){
var ic=document.createElement("span");
ic.className="note-icon";ic.textContent="📝";
box.appendChild(ic);
}

var num=document.createElement("div");
num.className="day-num";
num.textContent=d;
box.appendChild(num);

var inp=document.createElement("input");
inp.value=income[key][d]||"";
inp.placeholder="0";inp.inputMode="numeric";

(function(k,day,box){
inp.oninput=function(){
this.value=this.value.replace(/\D/g,"").substring(0,8);
if(this.value){income[k][day]=Number(this.value);box.classList.add("active");}
else{delete income[k][day];box.classList.remove("active");}
try{localStorage.setItem("ps_income",JSON.stringify(income));}catch(e){}
calc();
};
})(key,d,box);

inp.onclick=function(e){e.stopPropagation();};
box.onclick=(function(day){return function(){openNote(day);};})(d);
box.appendChild(inp);
grid.appendChild(box);
}
calc();showNotes();
}

/* ========= 统计 ========= */
function calc(){
var key=getKey(),sum=0,days=0;
for(var i in income[key]||{}){if(income[key][i]){sum+=income[key][i];days++;}}
document.getElementById("sum").textContent="¥"+sum.toLocaleString();
document.getElementById("days").textContent=days;
document.getElementById("avg").textContent="¥"+(days?Math.round(sum/days):0).toLocaleString();
}

/* ========= 备注 ========= */
function openNote(day){
currentDay=day;
var key=getKey();
document.getElementById("noteTitle").textContent=(now.getMonth()+1)+"月"+day+"日备注";
document.getElementById("noteText").value=(notes[key]&&notes[key][day])||"";
document.getElementById("mask").style.display="flex";
}
document.getElementById("saveNote").onclick=function(){
var key=getKey(),txt=document.getElementById("noteText").value.trim();
if(!notes[key])notes[key]={};
if(txt)notes[key][currentDay]=txt;
else delete notes[key][currentDay];
try{localStorage.setItem("ps_notes",JSON.stringify(notes));}catch(e){}
document.getElementById("mask").style.display="none";
render();
};
document.getElementById("mask").onclick=function(e){if(e.target===this)this.style.display="none";};
function showNotes(){
var key=getKey(),box=document.getElementById("noteList"),frag=document.createDocumentFragment();
var hasNotes=false;
for(var d in notes[key]||{}){
hasNotes=true;
var div=document.createElement("div");
div.textContent="📝 "+d+"日："+notes[key][d];
frag.appendChild(div);
}
box.innerHTML="";
if(hasNotes){box.appendChild(frag);}
else{
var span=document.createElement("span");
span.style.cssText="color:inherit;opacity:.5";
span.textContent="暂无备注";
box.appendChild(span);
}
}

/* ========= 月份 ========= */
document.getElementById("prev").onclick=function(){now.setMonth(now.getMonth()-1);render();};
document.getElementById("next").onclick=function(){now.setMonth(now.getMonth()+1);render();};

/* ========= 清空 ========= */
document.getElementById("clear").onclick=function(){
if(confirm("确定清空本月收益？")){delete income[getKey()];try{localStorage.setItem("ps_income",JSON.stringify(income));}catch(e){}render();}
};

/* ========= 复利计算 ========= */
document.getElementById("calcBtn").onclick=function(){
var money=Number(document.getElementById("position").value);
var rate=Number(document.getElementById("incomeType").value);
var days=Number(document.getElementById("time").value);
if(!money||!days){alert("请输入本金和天数");return;}
var total=money*Math.pow(1+rate,days);
var profit=total-money;
document.getElementById("profit").textContent="¥"+Math.round(profit).toLocaleString();
document.getElementById("total").textContent="¥"+Math.round(total).toLocaleString();
document.getElementById("rateShow").textContent=(rate*100).toFixed(1)+"%/天";
};

/* ========= 导出（跟随主题 + 直接保存）========= */
document.getElementById("export").onclick=function(){
var btn=this;
var origText=btn.textContent;
btn.textContent="生成中...";
btn.disabled=true;

var hide=[];
var t=document.querySelector(".theme");if(t)hide.push(t);
var c=document.querySelector(".calculator");if(c)hide.push(c);
var b=document.querySelector(".buttons");if(b)hide.push(b);
hide.forEach(function(e){e.style.display="none";});

requestAnimationFrame(function(){
setTimeout(function(){
var card=document.getElementById("capture");
var rect=card.getBoundingClientRect();
var dpr=3;
var padding=30*dpr;
var cw=Math.round(rect.width*dpr+padding*2);
var ch=Math.round(rect.height*dpr+padding*2);
var w=rect.width*dpr;
var h=rect.height*dpr;

var canvas=document.createElement("canvas");
canvas.width=cw;canvas.height=ch;
var ctx=canvas.getContext("2d");

var tc=getCurrentTheme();
var mainColor=tc.main;
var lightColor=tc.light;
var darkColor=tc.dark;
var bg1=tc.bg1;
var bg2=tc.bg2;
var bg3=tc.bg3;
var cardBg1=tc.cardBg1;
var cardBg2=tc.cardBg2;
var cardBg3=tc.cardBg3;
var iconEmoji=tc.icon;

// 背景
var bgGrad=ctx.createLinearGradient(0,0,0,ch);
bgGrad.addColorStop(0,bg1);
bgGrad.addColorStop(0.5,bg2);
bgGrad.addColorStop(1,bg3);
ctx.fillStyle=bgGrad;
ctx.fillRect(0,0,cw,ch);

// 网格
ctx.strokeStyle="rgba(255,255,255,0.03)";
ctx.lineWidth=1;
for(var i=0;i<cw;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,ch);ctx.stroke();}
for(var j=0;j<ch;j+=40){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(cw,j);ctx.stroke();}

// 光晕
var glow=ctx.createRadialGradient(cw/2,ch*0.4,0,cw/2,ch*0.4,ch*0.8);
glow.addColorStop(0,mainColor.replace(")","")+",0.15)");
glow.addColorStop(0.5,mainColor.replace(")","")+",0.05)");
glow.addColorStop(1,"transparent");
ctx.fillStyle=glow;
ctx.fillRect(0,0,cw,ch);

// 阴影
ctx.save();
ctx.shadowColor=mainColor.replace(")","")+",0.5)";
ctx.shadowBlur=40*dpr;
ctx.shadowOffsetX=0;
ctx.shadowOffsetY=10*dpr;
roundRect(ctx,padding,padding,w,h,30*dpr);
ctx.fillStyle="#111111";
ctx.fill();
ctx.restore();

// 卡片背景
var cardGrad=ctx.createLinearGradient(padding,padding,padding,padding+h);
cardGrad.addColorStop(0,cardBg1);
cardGrad.addColorStop(0.3,cardBg2);
cardGrad.addColorStop(1,cardBg3);
roundRect(ctx,padding,padding,w,h,30*dpr);
ctx.fillStyle=cardGrad;
ctx.fill();

// 顶部高光
var topGlow=ctx.createLinearGradient(0,padding,0,padding+h*0.3);
topGlow.addColorStop(0,"rgba(255,255,255,0.05)");
topGlow.addColorStop(1,"transparent");
roundRect(ctx,padding,padding,w,h*0.3,30*dpr);
ctx.fillStyle=topGlow;
ctx.fill();

// 渐变边框
ctx.save();
roundRect(ctx,padding,padding,w,h,30*dpr);
var borderGrad=ctx.createLinearGradient(padding,padding,padding+w,padding+h);
borderGrad.addColorStop(0,mainColor);
borderGrad.addColorStop(0.3,lightColor);
borderGrad.addColorStop(0.7,mainColor);
borderGrad.addColorStop(1,darkColor);
ctx.strokeStyle=borderGrad;
ctx.lineWidth=2*dpr;
ctx.stroke();
ctx.restore();

// 内边框
roundRect(ctx,padding+3*dpr,padding+3*dpr,w-6*dpr,h-6*dpr,27*dpr);
ctx.strokeStyle=mainColor.replace(")","")+",0.3)";
ctx.lineWidth=1;
ctx.stroke();

// 装饰线
var decorAlpha=mainColor.replace(")","")+",0.4)";
var decorAlphaBright=mainColor.replace(")","")+",0.8)";
ctx.strokeStyle=decorAlpha;
ctx.lineWidth=1;

ctx.beginPath();
ctx.moveTo(padding+40*dpr,padding+60*dpr);
ctx.lineTo(padding+w-40*dpr,padding+60*dpr);
ctx.stroke();
drawDiamond(ctx,padding+w/2,padding+60*dpr,8*dpr,decorAlphaBright);

var bottomY=padding+h-80*dpr;
ctx.beginPath();
ctx.moveTo(padding+40*dpr,bottomY);
ctx.lineTo(padding+w-40*dpr,bottomY);
ctx.stroke();
drawDiamond(ctx,padding+w/2,bottomY,8*dpr,decorAlphaBright);

// 四角
var corAlpha=mainColor.replace(")","")+",0.5)";
var corFillAlpha=mainColor.replace(")","")+",0.6)";
var corSize=15*dpr;
var corX=[padding+5*dpr,padding+w-5*dpr-corSize];
var corY=[padding+5*dpr,padding+h-5*dpr-corSize];
for(var ci=0;ci<2;ci++){
for(var cj=0;cj<2;cj++){
ctx.strokeStyle=corAlpha;
ctx.lineWidth=1;
var cx=corX[ci],cy=corY[cj];
ctx.beginPath();ctx.moveTo(cx,cy+corSize);ctx.lineTo(cx,cy);ctx.lineTo(cx+corSize,cy);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx+corSize,cy+corSize);ctx.arc(cx+corSize/2,cy+corSize/2,2*dpr,0,Math.PI*2);ctx.fillStyle=corFillAlpha;ctx.fill();
}
}

// 标题
var titleY=padding+100*dpr;
ctx.font=40*dpr+"px serif";
ctx.textAlign="center";
ctx.fillText(iconEmoji,padding+w/2,titleY-30*dpr);

ctx.font="bold "+36*dpr+"px 'PingFang SC','Microsoft YaHei',sans-serif";
var titleGrad=ctx.createLinearGradient(padding,titleY,padding+w,titleY);
titleGrad.addColorStop(0,mainColor);
titleGrad.addColorStop(0.3,lightColor);
titleGrad.addColorStop(0.7,lightColor);
titleGrad.addColorStop(1,mainColor);
ctx.fillStyle=titleGrad;
ctx.fillText("磐 石 收 益 账 本",padding+w/2,titleY);

ctx.font=14*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle=mainColor.replace(")","")+",0.6)";
ctx.fillText("P A N S H I · W E A L T H",padding+w/2,titleY+35*dpr);

// 统计卡片
var statY=titleY+80*dpr;
var statW=(w-80*dpr)/3;
var statH=100*dpr;
var statData=[
{label:"累计收益",value:"¥"+getStatSum(),icon:"💰"},
{label:"收益天数",value:getStatDays(),icon:"📅"},
{label:"日均收益",value:"¥"+getStatAvg(),icon:"📊"}
];

statData.forEach(function(st,i){
var sx=padding+25*dpr+i*(statW+15*dpr);
var sy=statY;

roundRect(ctx,sx,sy,statW,statH,16*dpr);
var statBgGrad=ctx.createLinearGradient(sx,sy,sx,sy+statH);
statBgGrad.addColorStop(0,mainColor.replace(")","")+",0.1)");
statBgGrad.addColorStop(1,mainColor.replace(")","")+",0.02)");
ctx.fillStyle=statBgGrad;
ctx.fill();

roundRect(ctx,sx,sy,statW,statH,16*dpr);
ctx.strokeStyle=mainColor.replace(")","")+",0.3)";
ctx.lineWidth=1;
ctx.stroke();

ctx.font=22*dpr+"px serif";
ctx.textAlign="center";
ctx.fillText(st.icon,sx+statW/2,sy+32*dpr);

ctx.font=12*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle=mainColor.replace(")","")+",0.5)";
ctx.fillText(st.label,sx+statW/2,sy+60*dpr);

ctx.font="bold "+20*dpr+"px 'PingFang SC',sans-serif";
var valGrad=ctx.createLinearGradient(sx,sy+70*dpr,sx+statW,sy+70*dpr);
valGrad.addColorStop(0,lightColor);
valGrad.addColorStop(1,mainColor);
ctx.fillStyle=valGrad;
ctx.fillText(st.value,sx+statW/2,sy+90*dpr);
});

// 月份
var monthY=statY+statH+50*dpr;
ctx.fillStyle=lightColor;
ctx.font="bold "+22*dpr+"px 'PingFang SC',sans-serif";
ctx.fillText("📆 "+now.getFullYear()+"年"+(now.getMonth()+1)+"月",padding+w/2,monthY);

// 日历
var gridY=monthY+40*dpr;
var cellW=(w-60*dpr)/7;
var cellH=50*dpr;
var k=getKey();
var first=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7;
var totalDays=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();

var weekDays=["一","二","三","四","五","六","日"];
ctx.font="bold "+11*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle=lightColor.replace(")","")+",0.7)";
weekDays.forEach(function(wd,i){
ctx.fillText(wd,padding+20*dpr+i*cellW+cellW/2,gridY-8*dpr);
});

for(var d=1;d<=totalDays;d++){
var idx=first+d-1;
var col=idx%7;var row=Math.floor(idx/7);
var x=padding+20*dpr+col*cellW;
var y=gridY+row*cellH;
var cx=x+cellW/2;
var cy=y+cellH/2;

if(income[k]&&income[k][d]){
roundRect(ctx,x+1,y+1,cellW-2,cellH-2,8*dpr);
ctx.fillStyle=mainColor.replace(")","")+",0.15)";
ctx.fill();
roundRect(ctx,x+1,y+1,cellW-2,cellH-2,8*dpr);
ctx.strokeStyle=mainColor.replace(")","")+",0.6)";
ctx.lineWidth=1;
ctx.stroke();
}

ctx.font="bold "+11*dpr+"px 'PingFang SC',sans-serif";
var isActive=income[k]&&income[k][d];
ctx.fillStyle=isActive?lightColor:tc.textLight;
ctx.textAlign="center";
ctx.fillText(d,cx,cy-4*dpr);

if(isActive){
ctx.font="bold "+9*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle=lightColor;
var val=String(income[k][d]);
if(val.length>5)val=val.substring(0,5)+"..";
ctx.fillText(val,cx,cy+14*dpr);
}
}

// 备注
var noteY=gridY+Math.ceil((first+totalDays)/7)*cellH+35*dpr;

ctx.font="bold "+14*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle=lightColor;
ctx.textAlign="left";
ctx.fillText("📝 本月备注",padding+25*dpr,noteY);

var niY=noteY+25*dpr;
if(notes[k]&&Object.keys(notes[k]).length>0){
ctx.font=11*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle="rgba(255,255,255,0.5)";
var n=0;
for(var dk in notes[k]){
if(n>=5)break;
ctx.fillText("• "+dk+"日  "+notes[k][dk],padding+25*dpr,niY+n*22*dpr);
n++;
}
if(Object.keys(notes[k]).length>5){
ctx.fillText("... 还有"+(Object.keys(notes[k]).length-5)+"条备注",padding+25*dpr,niY+5*22*dpr);
}
}else{
ctx.font=11*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle="rgba(255,255,255,0.2)";
ctx.fillText("暂无备注记录",padding+25*dpr,niY+10*dpr);
}

// 水印
var footerY=padding+h-40*dpr;
ctx.font=10*dpr+"px 'PingFang SC',sans-serif";
ctx.fillStyle="rgba(255,255,255,0.15)";
ctx.textAlign="center";
ctx.fillText("P A N S H I  ·  W E A L T H  ·  "+new Date().getFullYear(),padding+w/2,footerY);

// 直接触发下载
var fileName="磐石收益账本_"+now.getFullYear()+"年"+(now.getMonth()+1)+"月.png";
if(canvas.toBlob){
canvas.toBlob(function(blob){
var url=URL.createObjectURL(blob);
var a=document.createElement("a");
a.href=url;
a.download=fileName;
a.style.display="none";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);},1000);
hide.forEach(function(e){e.style.display="";});
btn.textContent=origText;
btn.disabled=false;
},"image/png");
}else{
// 降级方案：使用toDataURL
var dataUrl=canvas.toDataURL("image/png");
var a=document.createElement("a");
a.href=dataUrl;
a.download=fileName;
a.style.display="none";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
hide.forEach(function(e){e.style.display="";});
btn.textContent=origText;
btn.disabled=false;
}
},100);
});
};

/* ========= 辅助函数 ========= */
function roundRect(ctx,x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}

function drawDiamond(ctx,x,y,size,color){
ctx.fillStyle=color;
ctx.beginPath();
ctx.moveTo(x,y-size);
ctx.lineTo(x+size*0.6,y);
ctx.lineTo(x,y+size);
ctx.lineTo(x-size*0.6,y);
ctx.closePath();
ctx.fill();
}

function getStatSum(){
var k=getKey(),s=0;
for(var i in income[k]||{})s+=income[k][i]||0;
return s.toLocaleString();
}

function getStatDays(){
var k=getKey(),d=0;
for(var i in income[k]||{})if(income[k][i])d++;
return d;
}

function getStatAvg(){
var k=getKey(),s=0,d=0;
for(var i in income[k]||{}){if(income[k][i]){s+=income[k][i];d++;}}
return d?Math.round(s/d).toLocaleString():0;
}

render();
</script>
</body>
