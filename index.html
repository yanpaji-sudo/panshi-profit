<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">


<title>磐石收益账本 Pro</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

padding:16px;

font-family:

"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;

background:var(--bg);

}


/*================
主题
================*/


body.gold{

--bg:#050505;
--card:#111;
--main:#d4af37;
--light:#fff0aa;
--sub:#a88835;

}


body.jade{

--bg:#03140e;
--card:#08261b;
--main:#18c995;
--light:#d5fff3;
--sub:#55a889;

}


body.blue{

--bg:#061326;
--card:#0b203d;
--main:#4aa3ff;
--light:#e1f1ff;
--sub:#789bc5;

}


body.black{

--bg:#000;
--card:#080808;
--main:#999;
--light:#fff;
--sub:#777;

}


body.purple{

--bg:#12051c;
--card:#241030;
--main:#c77dff;
--light:#f1dcff;
--sub:#aa7bc5;

}


body.red{

--bg:#200303;
--card:#300808;
--main:#ff5252;
--light:#ffe3e3;
--sub:#c07b7b;

}


body.silver{

--bg:#111;
--card:#202328;
--main:#dce2ea;
--light:#fff;
--sub:#999;

}


body.bronze{

--bg:#170a03;
--card:#271306;
--main:#c47a32;
--light:#ffe2b0;
--sub:#a0784d;

}



/*================
布局
================*/


.wrap{

width:100%;

max-width:430px;

}



.card{


position:relative;

overflow:hidden;


background:

linear-gradient(
150deg,
rgba(255,255,255,.12),
transparent 40%
),

var(--card);



border:

1.5px solid var(--main);


border-radius:32px;


padding:25px 18px;


box-shadow:

0 25px 90px rgba(0,0,0,.85);


}




.card:before{


content:"";


position:absolute;


width:420px;

height:420px;


left:-200px;

top:-200px;



background:

radial-gradient(
circle,
rgba(255,255,255,.18),
transparent 65%
);



}



.card:after{


content:"";


position:absolute;


width:350px;


height:350px;


right:-180px;


bottom:-180px;



background:

radial-gradient(
circle,
rgba(255,210,100,.12),
transparent 65%
);


}





.inner{

position:absolute;

inset:6px;


border:

1px solid rgba(255,255,255,.15);


border-radius:27px;


}




.content{

position:relative;

z-index:5;

}





.title{

text-align:center;


font-size:30px;


font-weight:900;


letter-spacing:5px;



background:

linear-gradient(
180deg,
#fff,
var(--light)
);



-webkit-background-clip:text;

color:transparent;


}



.sub{


margin-top:8px;


text-align:center;


font-size:12px;


letter-spacing:3px;


color:var(--sub);


}




/*主题*/


.theme{


display:grid;


grid-template-columns:repeat(4,1fr);


gap:8px;


margin:22px 0;


}


.theme button{


height:32px;


border-radius:20px;


background:

rgba(255,255,255,.06);



border:

1px solid var(--main);



color:var(--light);


font-size:11px;


}




/*统计*/


.stats{


display:flex;


gap:10px;


}



.stat{


flex:1;


padding:15px 5px;


border-radius:16px;



background:

rgba(255,255,255,.05);



border:

1px solid rgba(255,255,255,.15);



text-align:center;


}



.label{


font-size:11px;


color:var(--sub);


}


.value{


margin-top:8px;


font-size:20px;


font-weight:900;


color:var(--light);


}




.month{


display:flex;


justify-content:space-between;


align-items:center;


margin:22px 0;


}



.month button{


width:40px;


height:36px;


border-radius:20px;



background:none;


border:

1px solid var(--main);



font-size:25px;


color:var(--light);


}



.month span{


font-size:20px;


font-weight:900;


color:var(--light);


}




.week{


display:grid;


grid-template-columns:repeat(7,1fr);


text-align:center;


font-size:12px;


color:var(--sub);


margin-bottom:8px;


}




.grid{


display:grid;


grid-template-columns:repeat(7,1fr);


gap:6px;


}




.day{


height:58px;


border-radius:12px;


display:flex;


flex-direction:column;


justify-content:center;


align-items:center;


background:

rgba(255,255,255,.04);


border:

1px solid rgba(255,255,255,.12);


color:var(--light);


font-size:12px;


}



.day.active{


border-color:var(--main);


background:

rgba(255,215,100,.18);


}




/*重点修复：收益输入*/


.day input{


width:90%;


height:20px;



margin:4px auto 0;


padding:0;


display:block;



border:0;


outline:none;



background:

rgba(0,0,0,.3);



border-radius:8px;



text-align:center;



font-family:

Arial,
"Microsoft YaHei",
sans-serif;



font-size:12px;


font-weight:900;



line-height:20px;



color:var(--light);



letter-spacing:0;



appearance:none;


-webkit-appearance:none;


}



.day input::-webkit-inner-spin-button,
.day input::-webkit-outer-spin-button{


-webkit-appearance:none;


margin:0;


}



/*按钮*/


.buttons{


display:flex;


gap:12px;


margin-top:22px;


}



.buttons button{


flex:1;


height:52px;


border-radius:18px;


font-weight:bold;


}



.export{


border:0;


background:

linear-gradient(
135deg,
var(--main),
var(--light)

);


color:#111;


}



.clear{


background:none;


border:

1px solid var(--main);


color:var(--light);


}



.brand{


margin-top:20px;


text-align:center;


font-size:11px;


letter-spacing:5px;


color:rgba(255,255,255,.35);


}



</style>

</head><body class="gold">


<div class="wrap">


<div class="card" id="card">


<div class="inner"></div>


<div class="content">


<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 智能累计 · 品牌管理
</div>




<div class="theme">

<button onclick="changeTheme('gold')">鎏金</button>
<button onclick="changeTheme('jade')">翡翠</button>
<button onclick="changeTheme('blue')">星辰</button>
<button onclick="changeTheme('black')">黑钻</button>

<button onclick="changeTheme('purple')">紫晶</button>
<button onclick="changeTheme('red')">红曜</button>
<button onclick="changeTheme('silver')">银白</button>
<button onclick="changeTheme('bronze')">古铜</button>

</div>




<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>

</div>



<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>

</div>



<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>

</div>


</div>






<div class="month">

<button id="prev">
‹
</button>


<span id="ym">
</span>


<button id="next">
›
</button>


</div>





<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>


</div>




<div class="grid" id="grid"></div>





<div class="buttons">

<button class="export" id="export">
📸 导出品牌图
</button>


<button class="clear" id="clear">
清空
</button>


</div>



<div class="brand">

P A N S H I · WEALTH

</div>


</div>


</div>


</div>






<script>


//=====================
//主题
//=====================


function changeTheme(t){

document.body.className=t;

localStorage.setItem(
"ps_theme",
t
);

}



let oldTheme=
localStorage.getItem("ps_theme");


if(oldTheme){

document.body.className=
oldTheme;

}





//=====================
//数据
//=====================


let now=new Date();



let income=
JSON.parse(

localStorage.getItem(
"ps_income"
)

|| "{}"

);




function getKey(){

return now.getFullYear()
+
"-"
+
now.getMonth();

}







//=====================
//生成日历
//=====================


function render(){



let y=
now.getFullYear();


let m=
now.getMonth();



document.getElementById("ym")
.innerHTML=
y+"年"+(m+1)+"月";



let grid=
document.getElementById("grid");



grid.innerHTML="";




let first=
(new Date(y,m,1).getDay()+6)%7;



let total=
new Date(y,m+1,0).getDate();





for(let i=0;i<first;i++){


let e=document.createElement("div");

e.className="day";


e.style.visibility="hidden";


grid.appendChild(e);


}






let key=getKey();



if(!income[key]){

income[key]={};

}




for(let d=1;d<=total;d++){



let box=
document.createElement("div");


box.className="day";



let value=
income[key][d]||"";



if(value){

box.classList.add("active");

}





let num=
document.createElement("div");


num.innerHTML=d;




let input=
document.createElement("input");



//关键修复
//不用number避免手机样式错乱


input.type="text";


input.inputMode="numeric";


input.value=value;


input.placeholder="0";





input.oninput=function(){



this.value=
this.value
.replace(/\D/g,"")
.substring(0,8);





if(this.value){



income[key][d]=
Number(this.value);



box.classList.add(
"active"
);


}else{


delete income[key][d];


box.classList.remove(
"active"
);


}




localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();



};




box.appendChild(num);


box.appendChild(input);


grid.appendChild(box);



}



calc();


}






//=====================
//统计
//=====================


function calc(){



let key=getKey();


let sum=0;


let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(
income[key][i]
);


days++;


}

}



document.getElementById("sum")
.innerHTML=
"¥"+sum.toLocaleString();



document.getElementById("days")
.innerHTML=
days;



document.getElementById("avg")
.innerHTML=
"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}








//月份切换


document.getElementById("prev")
.onclick=function(){


now.setMonth(
now.getMonth()-1
);


render();


};



document.getElementById("next")
.onclick=function(){


now.setMonth(
now.getMonth()+1
);


render();


};







//清空


document.getElementById("clear")
.onclick=function(){


if(confirm("确定清空本月记录？")){


delete income[getKey()];


localStorage.setItem(
"ps_income",
JSON.stringify(income)
);


render();


}


};





render();



</script><script>


//==============================
//高清导出模块
//==============================


document.getElementById("export").onclick=function(){



let card=document.getElementById("card");


//创建品牌水印层

let wm=document.createElement("div");


wm.className="export-watermark";



wm.style.position="absolute";

wm.style.left="-40%";

wm.style.top="-20%";

wm.style.width="180%";

wm.style.height="180%";


wm.style.zIndex="3";

wm.style.pointerEvents="none";


wm.style.transform="rotate(-35deg)";



wm.style.display="flex";


wm.style.flexWrap="wrap";


wm.style.alignContent="center";


wm.style.justifyContent="center";


wm.style.gap="90px";




let color=
getComputedStyle(document.body)
.getPropertyValue("--main");





for(let i=0;i<30;i++){


let t=document.createElement("div");



t.innerHTML=
"P A N S H I";



t.style.width="180px";


t.style.textAlign="center";


t.style.fontSize="26px";


t.style.fontWeight="900";


t.style.letterSpacing="5px";



t.style.color=color;


t.style.opacity=".08";



wm.appendChild(t);



}



card.appendChild(wm);






//底部固定品牌标识

let footer=document.createElement("div");


footer.innerHTML=
"加入磐石开启财富人生";



footer.style.position="absolute";


footer.style.bottom="28px";


footer.style.left="0";


footer.style.right="0";


footer.style.textAlign="center";


footer.style.fontSize="14px";


footer.style.fontWeight="900";


footer.style.color=color;


footer.style.opacity=".75";


footer.style.zIndex="5";



card.appendChild(footer);






//生成高清图片


html2canvas(card,{


scale:4,


useCORS:true,


backgroundColor:null,


allowTaint:true



})


.then(canvas=>{



let a=document.createElement("a");



a.download=

"磐石收益账本_"+

now.getFullYear()+

"年"+

(now.getMonth()+1)+

"月.png";



a.href=
canvas.toDataURL(
"image/png",
1
);



a.click();



//删除临时水印


card.removeChild(wm);


card.removeChild(footer);



});



};



</script>



</body>

</html>
