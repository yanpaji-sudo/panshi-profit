<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>磐石收益账本 V3.3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
min-height:100vh;
padding:15px;
display:flex;
justify-content:center;
font-family:
"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;
transition:.3s;
}


/*========================
8种主题系统
========================*/


body.gold{
--bg:#080808;
--card:#111;
--main:#c9a84c;
--light:#ffeeb0;
--text:#fff4d0;
--sub:#9c8750;
}


body.jade{
--bg:#031710;
--card:#08271d;
--main:#23c997;
--light:#d0fff2;
--text:#e7fff8;
--sub:#65a890;
}


body.blue{
--bg:#061326;
--card:#0b203d;
--main:#4da3ff;
--light:#d8ecff;
--text:#e9f5ff;
--sub:#7698c0;
}


body.purple{
--bg:#12051d;
--card:#221035;
--main:#b46cff;
--light:#efd7ff;
--text:#fff;
--sub:#a58ac0;
}


body.black{
--bg:#000;
--card:#080808;
--main:#eeeeee;
--light:#fff;
--text:#fff;
--sub:#777;
}


body.rose{
--bg:#1b080d;
--card:#2a1018;
--main:#ff8fa3;
--light:#ffe0e7;
--text:#fff;
--sub:#c98c99;
}


body.ocean{
--bg:#03151f;
--card:#082938;
--main:#20d5ff;
--light:#d9f8ff;
--text:#fff;
--sub:#6aaabd;
}


body.silver{
--bg:#111;
--card:#222;
--main:#ddd;
--light:#fff;
--text:#fff;
--sub:#999;
}


body{
background:var(--bg);
}



.wrap{

width:100%;
max-width:440px;

}



.card{

position:relative;

overflow:hidden;

width:100%;

padding:24px 18px;

border-radius:30px;

background:

linear-gradient(
160deg,
rgba(255,255,255,.12),
transparent 35%
),
var(--card);

border:

1px solid var(--main);

box-shadow:

0 20px 80px rgba(0,0,0,.8);

}



.card:before{

content:"";

position:absolute;

width:420px;

height:420px;

left:-160px;

top:-160px;

background:

radial-gradient(
circle,
rgba(255,255,255,.15),
transparent 65%
);

}



.inner{

position:absolute;

inset:6px;

border-radius:25px;

border:

1px solid rgba(255,255,255,.12);

pointer-events:none;

}



.title{

position:relative;

text-align:center;

font-size:30px;

font-weight:900;

letter-spacing:5px;

background:

linear-gradient(
180deg,
#fff,
var(--light)
);

-webkit-background-clip:text;

color:transparent;

}



.sub{

text-align:center;

margin-top:8px;

font-size:12px;

letter-spacing:3px;

color:var(--sub);

}



/*主题按钮*/

.theme{

display:flex;

gap:5px;

margin:20px 0;

flex-wrap:wrap;

}



.theme button{

flex:1;

min-width:60px;

height:34px;

border-radius:18px;

border:

1px solid var(--main);

background:

rgba(255,255,255,.05);

color:var(--light);

font-size:11px;

}



/*统计*/


.stats{

display:flex;

gap:10px;

}



.stat{

flex:1;

padding:15px 5px;

border-radius:16px;

background:

rgba(255,255,255,.05);

border:

1px solid rgba(255,255,255,.12);

text-align:center;

}


.label{

font-size:11px;

color:var(--sub);

}


.value{

margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--light);

}
.month{

margin:22px 0;

display:flex;

align-items:center;

justify-content:space-between;

}


.month button{

width:42px;

height:36px;

border-radius:18px;

background:none;

border:

1px solid var(--main);

color:var(--light);

font-size:25px;

}


.month span{

font-size:20px;

font-weight:900;

color:var(--light);

}




.week{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

font-size:12px;

color:var(--sub);

margin-bottom:8px;

}




.grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;

}




.day{

height:58px;

border-radius:12px;

background:

rgba(255,255,255,.04);

border:

1px solid rgba(255,255,255,.12);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

position:relative;

}




.day.active{

border-color:var(--main);

background:

rgba(255,255,255,.08);

}




.day input{

width:85%;

height:20px;

border:0;

outline:none;

background:none;

text-align:center;

color:var(--light);

font-size:12px;

font-weight:bold;

}



.note-icon{

position:absolute;

right:3px;

top:2px;

font-size:11px;

}



/*备注*/


.note-box{

margin-top:18px;

padding:14px;

border-radius:18px;

background:

rgba(255,255,255,.05);

border:

1px solid rgba(255,255,255,.12);

}


.note-title{

font-weight:900;

color:var(--light);

margin-bottom:10px;

}


.note-item{

font-size:12px;

line-height:22px;

color:var(--sub);

}




/*复利计算器*/


.calculator{

margin-top:18px;

padding:15px;

border-radius:20px;

border:

1px solid var(--main);

background:

rgba(255,255,255,.05);

}



.calc-title{

text-align:center;

font-size:18px;

font-weight:900;

color:var(--light);

margin-bottom:15px;

}



.calculator input,
.calculator select{

width:100%;

height:45px;

margin-bottom:12px;

border-radius:12px;

background:#000;

border:

1px solid var(--main);

color:var(--light);

text-align:center;

outline:none;

}



#calcBtn{

width:100%;

height:45px;

border-radius:15px;

border:0;

font-weight:bold;

font-size:15px;

}



.calc-result{

margin-top:12px;

padding:10px;

border-radius:15px;

background:#000;

}



.calc-result div{

display:flex;

justify-content:space-between;

padding:8px;

color:var(--sub);

}



.calc-result span{

font-size:20px;

font-weight:900;

color:var(--light);

}





/*按钮*/


.buttons{

display:flex;

gap:12px;

margin-top:20px;

}



.buttons button{

flex:1;

height:52px;

border-radius:18px;

font-size:15px;

font-weight:bold;

}



.export{

border:0;

background:

linear-gradient(
135deg,
var(--main),
var(--light)
);

color:#111;

}


.clear{

background:none;

border:

1px solid var(--main);

color:var(--light);

}



.brand{

margin-top:20px;

text-align:center;

font-size:11px;

letter-spacing:5px;

color:rgba(255,255,255,.3);

}
.mask{

position:fixed;

inset:0;

display:none;

align-items:center;

justify-content:center;

background:

rgba(0,0,0,.75);

z-index:999;

}



.panel{

width:85%;

background:#111;

border:

1px solid var(--main);

border-radius:22px;

padding:20px;

}



.panel h3{

text-align:center;

color:var(--light);

margin-bottom:15px;

}



.panel textarea{

width:100%;

height:130px;

border-radius:15px;

background:#000;

border:

1px solid var(--main);

color:white;

padding:10px;

resize:none;

}



.panel button{

width:100%;

height:45px;

margin-top:15px;

border:0;

border-radius:15px;

background:var(--main);

font-weight:bold;

}



/*========================
主体
========================*/


</style>

</head>


<body class="gold">


<div class="wrap">


<div class="card" id="capture">


<div class="inner"></div>


<div class="title">
磐石收益账本
</div>

</div>

</button>

</button>

<button onclick="changeTheme('blue')">

</button>

</button>

</button>

</button>

</button>

<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">

</div>



<div class="stat">

</div>

</div>

</div>



<div class="stat">

<div class="label">

</div>

</button>

</span>

</button>

<div>一</div>
<div>二</div>
<div>三</div>

<div>六</div>
<div>日</div>

</div>

<div class="note-box">

<div class="note-title">
📝 日期备注

</div>

type="number"
placeholder="输入本金金额">

<option value="0.018">
动态收入（日息1.8%）

placeholder="输入当天备注">
</textarea>

保存备注
</button>


</div>


</div>
<script>


/*========================
主题系统修复
8种主题永久保存
========================*/


function changeTheme(t){

document.body.className=t;

localStorage.setItem(
"ps_theme",
t
);

}



(function(){

let t=localStorage.getItem("ps_theme");

if(t){

document.body.className=t;

}else{

document.body.className="gold";

}

})();





/*========================
数据
========================*/


let now=new Date();


let income=

JSON.parse(

localStorage.getItem("ps_income")||"{}"

);



let notes=

JSON.parse(

localStorage.getItem("ps_notes")||"{}"

);



let currentDay=null;



function getKey(){

return now.getFullYear()

+

"-"

+

now.getMonth();

}






/*========================
日历
========================*/


function render(){


let y=now.getFullYear();

let m=now.getMonth();



document.getElementById("ym").innerHTML=

y+"年"+(m+1)+"月";



let grid=document.getElementById("grid");


grid.innerHTML="";



let first=

(new Date(y,m,1).getDay()+6)%7;



let total=

new Date(y,m+1,0).getDate();



let key=getKey();



if(!income[key]){

income[key]={};

}



if(!notes[key]){

notes[key]={};

}




for(let i=0;i<first;i++){


let empty=document.createElement("div");


empty.className="day";


empty.style.visibility="hidden";


grid.appendChild(empty);


}






for(let d=1;d<=total;d++){



let box=document.createElement("div");


box.className="day";



if(income[key][d]){

box.classList.add("active");

}





if(notes[key][d]){


let icon=document.createElement("span");


icon.className="note-icon";


icon.innerHTML="📝";


box.appendChild(icon);


}





let num=document.createElement("div");


num.innerHTML=d;


box.appendChild(num);






let input=document.createElement("input");


input.value=

income[key][d]||"";


input.placeholder="0";


input.inputMode="numeric";



input.style.textAlign="center";





input.onclick=function(e){

e.stopPropagation();

};





input.oninput=function(){


this.value=

this.value.replace(/\D/g,"")

.substring(0,8);



if(this.value){


income[key][d]=Number(this.value);


box.classList.add("active");


}else{


delete income[key][d];


box.classList.remove("active");


}



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();


};






box.onclick=function(){

openNote(d);

};



box.appendChild(input);


grid.appendChild(box);



}




calc();


showNotes();



}
<script>


/*========================
统计
========================*/


function calc(){


let key=getKey();


let sum=0;

let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(income[key][i]);

days++;


}


}





document.getElementById("sum").innerHTML=

"¥"+sum.toLocaleString();



document.getElementById("days").innerHTML=

days;



document.getElementById("avg").innerHTML=

"¥"+

(days?

Math.round(sum/days):

0)

.toLocaleString();



}







/*========================
备注功能
========================*/



function openNote(day){


currentDay=day;


let key=getKey();



document.getElementById("noteTitle").innerHTML=

(now.getMonth()+1)

+

"月"

+

day

+

"日备注";




document.getElementById("noteText").value=

notes[key][day]||"";



document.getElementById("mask").style.display="flex";


}







document.getElementById("saveNote")

.onclick=function(){



let key=getKey();



let text=

document.getElementById("noteText")

.value

.trim();





if(!notes[key]){

notes[key]={};

}





if(text){


notes[key][currentDay]=text;


}else{


delete notes[key][currentDay];


}





localStorage.setItem(

"ps_notes",

JSON.stringify(notes)

);



document.getElementById("mask")

.style.display="none";



render();



};






document.getElementById("mask")

.onclick=function(e){


if(e.target===this){


this.style.display="none";


}


};







function showNotes(){



let key=getKey();



let box=document.getElementById("noteList");



let html="";





for(let d in notes[key]||{}){


html+=


"<div class='note-item'>"

+

"📝 "

+

d

+

"日："

+

notes[key][d]

+

"</div>";



}





box.innerHTML=

html||"暂无备注";



}








/*========================
月份切换
========================*/


document.getElementById("prev")

.onclick=function(){


now.setMonth(

now.getMonth()-1

);


render();


};







document.getElementById("next")

.onclick=function(){


now.setMonth(

now.getMonth()+1

);


render();


};









/*========================
清空
========================*/


document.getElementById("clear")

.onclick=function(){



if(confirm("确定清空本月收益记录？")){


delete income[getKey()];



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



render();


}



};









/*========================
复利计算
========================*/


document.getElementById("calcBtn")

.onclick=function(){



let money=

Number(

document.getElementById("position").value

);



let rate=

Number(

document.getElementById("incomeType").value

);



let day=

Number(

document.getElementById("time").value

);





if(!money||!day){


alert("请输入本金和天数");


return;


}





let total=

money*Math.pow(

1+rate,

day

);



let profit=

total-money;





document.getElementById("profit")

.innerHTML=

"¥"

+

Math.round(profit)

.toLocaleString();





document.getElementById("total")

.innerHTML=

"¥"

+

Math.round(total)

.toLocaleString();





document.getElementById("rateShow")

.innerHTML=

(rate*100).toFixed(1)

+

"%/天";



};






/*========================
高清高级导出
保持主题风格
自动字体适配
手机直接打开图片
========================*/


document.getElementById("export")

.onclick=function(){



let themeBox=document.querySelector(".theme");

let calcBox=document.querySelector(".calculator");

let btnBox=document.querySelector(".buttons");



themeBox.style.display="none";

calcBox.style.display="none";

btnBox.style.display="none";






setTimeout(function(){



let card=document.getElementById("capture");


let width=1200;


let height=1600;



let canvas=document.createElement("canvas");


canvas.width=width;

canvas.height=height;



let ctx=canvas.getContext("2d");





let style=getComputedStyle(document.body);



let main=

style.getPropertyValue("--main").trim();



let light=

style.getPropertyValue("--light").trim();



let bg=

style.getPropertyValue("--bg").trim();



let cardColor=

style.getPropertyValue("--card").trim();







/* 背景 */


let bgGradient=

ctx.createLinearGradient(

0,

0,

0,

height

);



bgGradient.addColorStop(

0,

bg

);



bgGradient.addColorStop(

1,

"#000"

);



ctx.fillStyle=bgGradient;


ctx.fillRect(

0,

0,

width,

height

);







/* 光晕 */


let glow=

ctx.createRadialGradient(

200,

200,

0,

200,

200,

500

);



glow.addColorStop(

0,

main+"55"

);



glow.addColorStop(

1,

"transparent"

);



ctx.fillStyle=glow;


ctx.fillRect(

0,

0,

width,

height

);








/* 主卡 */


roundRect(

ctx,

50,

50,

1100,

1450,

45

);



ctx.fillStyle=cardColor;


ctx.fill();



ctx.strokeStyle=main;


ctx.lineWidth=4;


ctx.stroke();






/* 内边框 */


roundRect(

ctx,

70,

70,

1060,

1410,

35

);



ctx.strokeStyle="rgba(255,255,255,.12)";


ctx.lineWidth=2;


ctx.stroke();








/*标题*/


ctx.textAlign="center";


ctx.fillStyle=light;


ctx.font=

"900 70px Microsoft YaHei";


ctx.fillText(

"磐石收益账本",

600,

170

);





ctx.font=

"28px Microsoft YaHei";


ctx.fillStyle=

"rgba(255,255,255,.6)";



ctx.fillText(

"财富记录 · 智能累计",

600,

225

);









/*统计*/


let key=getKey();


let sum=0;


let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(income[key][i]);

days++;


}


}



let avg=

days?

Math.round(sum/days):

0;



let stats=[


["累计收益","¥"+sum.toLocaleString()],


["收益天数",days],


["日均收益","¥"+avg.toLocaleString()]


];







for(let i=0;i<3;i++){



let x=100+i*340;



roundRect(

ctx,

x,

300,

300,

130,

25

);



ctx.fillStyle=

"rgba(255,255,255,.06)";


ctx.fill();



ctx.strokeStyle=

main+"66";


ctx.stroke();





ctx.fillStyle=

"rgba(255,255,255,.5)";


ctx.font=

"24px Microsoft YaHei";


ctx.fillText(

stats[i][0],

x+150,

350

);





ctx.fillStyle=

light;


ctx.font=

"bold 38px Arial";


ctx.fillText(

stats[i][1],

x+150,

405

);



}





/*========================
导出日历
========================*/


ctx.fillStyle=light;

ctx.font=

"bold 42px Microsoft YaHei";


ctx.textAlign="center";


ctx.fillText(

now.getFullYear()

+

"年"

+

(now.getMonth()+1)

+

"月",

600,

520

);





let weeks=[

"一","二","三","四","五","六","日"

];


ctx.font=

"28px Microsoft YaHei";


ctx.fillStyle=

"rgba(255,255,255,.55)";



for(let i=0;i<7;i++){


ctx.fillText(

weeks[i],

150+i*140,

590

);


}







let offset=

(new Date(

now.getFullYear(),

now.getMonth(),

1

).getDay()+6)%7;



let total=

new Date(

now.getFullYear(),

now.getMonth()+1,

0

).getDate();





let cellW=140;

let cellH=115;


let startX=80;

let startY=640;



for(let d=1;d<=total;d++){


let index=

offset+d-1;



let row=

Math.floor(index/7);



let col=

index%7;



let x=

startX+

col*cellW;



let y=

startY+

row*cellH;





roundRect(

ctx,

x,

y,

125,

95,

18

);





if(income[key]&&income[key][d]){


ctx.fillStyle=

main+"33";


ctx.fill();



ctx.strokeStyle=

main;


}else{


ctx.strokeStyle=

"rgba(255,255,255,.18)";


}



ctx.lineWidth=2;


ctx.stroke();





ctx.fillStyle=light;


ctx.font=

"28px Arial";



ctx.fillText(

d,

x+62,

y+35

);





if(income[key]&&income[key][d]){


ctx.font=

"bold 28px Arial";


ctx.fillText(

income[key][d],

x+62,

y+72

);



}


}







/*========================
备注区域
========================*/


let noteY=1200;



ctx.textAlign="left";


ctx.fillStyle=light;


ctx.font=

"bold 30px Microsoft YaHei";


ctx.fillText(

"📝 日期备注",

100,

noteY

);



ctx.font=

"24px Microsoft YaHei";


ctx.fillStyle=

"rgba(255,255,255,.65)";



let n=0;



for(let d in notes[key]||{}){


if(n<6){


ctx.fillText(

"📝 "+d+"日："+notes[key][d],

100,

noteY+45+n*40

);



n++;


}


}






if(n===0){


ctx.fillText(

"暂无备注",

100,

noteY+45

);


}








/*========================
高级水印
========================*/


ctx.save();



ctx.translate(

600,

1350

);



ctx.rotate(

-12*Math.PI/180

);



ctx.textAlign="center";


ctx.globalAlpha=.12;


ctx.fillStyle=main;


ctx.font=

"900 80px Microsoft YaHei";



ctx.fillText(

"磐石收益账本",

0,

0

);



ctx.restore();



ctx.globalAlpha=1;







/*底部品牌*/


ctx.textAlign="center";


ctx.fillStyle=

"rgba(255,255,255,.35)";


ctx.font=

"28px Arial";



ctx.fillText(

"P A N S H I · WEALTH",

600,

1450

);

手机打开图片

let url=

URL.createObjectURL(blob);

},


"image/png"

);






themeBox.style.display="flex";


calcBox.style.display="block";


btnBox.style.display="flex";



};






/*圆角绘制*/

function roundRect(

ctx,

x,

y,

w,

h,

r

){



ctx.beginPath();



ctx.moveTo(

x+r,

y

);



ctx.lineTo(

x+w-r,

y

);



ctx.quadraticCurveTo(

x+w,

y,

x+w,

y+r

);



ctx.lineTo(

x+w,

y+h-r

);



ctx.quadraticCurveTo(

x+w,

y+h,

x+w-r,

y+h

);



ctx.lineTo(

x+r,

y+h

);



ctx.quadraticCurveTo(

x,

y+h,

x,

y+h-r

);



ctx.lineTo(

x,

y+r

);



ctx.quadraticCurveTo(

x,

y,

x+r,

y

);



ctx.closePath();

}






render();


</script>
