<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>磐石收益账本</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

min-height:100vh;

padding:15px;

display:flex;

justify-content:center;

background:#050505;

font-family:
"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;

}



body.gold{

--bg:#080808;
--card:#111;
--main:#c9a84c;
--light:#ffeeb0;
--sub:#9c8750;

}


body.jade{

--bg:#031710;
--card:#08271d;
--main:#23c997;
--light:#d0fff2;
--sub:#65a890;

}


body.blue{

--bg:#061326;
--card:#0b203d;
--main:#4da3ff;
--light:#d8ecff;
--sub:#7698c0;

}


body.purple{

--bg:#12051d;
--card:#221035;
--main:#b46cff;
--light:#efd7ff;
--sub:#a58ac0;

}


body.black{

--bg:#000;
--card:#080808;
--main:#eee;
--light:#fff;
--sub:#777;

}




.wrap{

width:100%;

max-width:440px;

}



.card{

position:relative;

overflow:hidden;

width:100%;

border-radius:30px;

padding:24px 18px;


background:

linear-gradient(
160deg,
rgba(255,255,255,.1),
transparent 35%
),

var(--card);



border:1px solid var(--main);



box-shadow:

0 20px 80px rgba(0,0,0,.8);

}



.card:before{

content:"";

position:absolute;

width:400px;

height:400px;

left:-150px;

top:-150px;


background:

radial-gradient(
circle,
rgba(255,255,255,.15),
transparent 65%
);

}




.inner{

position:absolute;

inset:6px;

border:1px solid rgba(255,255,255,.12);

border-radius:25px;

pointer-events:none;

}




.title{

position:relative;

text-align:center;

font-size:30px;

font-weight:900;

letter-spacing:5px;


background:

linear-gradient(
180deg,
#fff,
var(--light)
);


-webkit-background-clip:text;

color:transparent;

}




.sub{

text-align:center;

margin-top:8px;

font-size:12px;

letter-spacing:3px;

color:var(--sub);

}




.theme{

display:flex;

gap:6px;

margin:20px 0;

}



.theme button{

flex:1;

height:34px;

border-radius:18px;

border:1px solid var(--main);

background:rgba(255,255,255,.05);

color:var(--light);

font-size:11px;

}




.stats{

display:flex;

gap:10px;

}



.stat{

flex:1;

padding:15px 5px;

border-radius:16px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.12);

text-align:center;

}




.label{

font-size:11px;

color:var(--sub);

}



.value{

margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--light);

}



.month{

margin:22px 0;

display:flex;

justify-content:space-between;

align-items:center;

}


.month button{

width:42px;

height:36px;

border-radius:18px;

background:none;

border:1px solid var(--main);

color:var(--light);

font-size:25px;

}



.month span{

font-size:20px;

font-weight:900;

color:var(--light);

}


.week{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

font-size:12px;

color:var(--sub);

margin-bottom:8px;

}



.grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;

}



.day{

height:58px;

border-radius:12px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.1);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

position:relative;

}



.day.active{

border-color:var(--main);

background:rgba(201,168,76,.15);

}




.day input{

width:90%;

height:22px;

border:0;

outline:0;

background:transparent;

text-align:center!important;

display:block;

margin:auto;

color:var(--light);

font-weight:900;

font-size:13px;

line-height:22px;

}



.day input::placeholder{

text-align:center;

color:rgba(255,255,255,.35);

}


.note-icon{

position:absolute;

right:3px;

top:2px;

font-size:10px;

}

<!-- 第2段开始：主体HTML -->

</style>

</head>


<body class="gold">


<div class="wrap">


<div class="card" id="captureArea">


<div class="inner"></div>



<div class="title">
磐石收益账本
</div>



<div class="sub">
财富记录 · 智能累计
</div>




<div class="theme export-hide">


<button onclick="changeTheme('gold')">
鎏金
</button>


<button onclick="changeTheme('jade')">
翡翠
</button>


<button onclick="changeTheme('blue')">
星耀
</button>


<button onclick="changeTheme('purple')">
紫晶
</button>


<button onclick="changeTheme('black')">
黑钻
</button>


</div>






<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>

</div>



<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>

</div>



<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>

</div>


</div>






<div class="month">

<button id="prev">
‹
</button>


<span id="ym"></span>


<button id="next">
›
</button>

</div>





<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>






<div class="grid" id="grid"></div>







<div class="note-box">


<div class="note-title">
📝 日期备注
</div>


<div id="noteList">
暂无备注
</div>


</div>







<div class="calculator export-hide">


<div class="calc-title">
📈 收益计算器
</div>



<input id="position"
type="number"
placeholder="输入仓位金额">



<select id="incomeType">

<option value="0.018">
动态收入（日息1.8%）
</option>


<option value="0.012">
静态收入（日息1.2%）
</option>


</select>




<input id="time"
type="number"
placeholder="输入时间（天）">





<button id="calcBtn">
计算盈利
</button>






<div class="calc-result">


<div>

纯利润

<span id="profit">
¥0
</span>

</div>



<div>

总金额

<span id="total">
¥0
</span>

</div>


</div>


</div>







<div class="buttons export-hide">


<button class="export" id="export">
📸 高清导出
</button>



<button class="clear" id="clear">
清空
</button>



</div>





<div class="brand">

P A N S H I · WEALTH

</div>



</div>


</div>






<div class="mask" id="mask">


<div class="panel">


<h3 id="noteTitle">
日期备注
</h3>



<textarea id="noteText"
placeholder="输入当天备注">
</textarea>




<button id="saveNote">
保存备注
</button>



</div>

</div>

<!-- 第3段开始：完整JS -->

<script>


function changeTheme(type){

document.body.className=type;

localStorage.setItem(
"ps_theme",
type
);

}



let oldTheme=
localStorage.getItem("ps_theme");


if(oldTheme){

document.body.className=oldTheme;

}



let now=new Date();



let income=
JSON.parse(
localStorage.getItem("ps_income")
||
"{}"
);



let notes=
JSON.parse(
localStorage.getItem("ps_notes")
||
"{}"
);





function getKey(){

return now.getFullYear()
+
"-"
+
now.getMonth();

}



let currentNoteDay=null;






function render(){


let y=now.getFullYear();

let m=now.getMonth();



document.getElementById("ym").innerHTML=
y+"年"+(m+1)+"月";




let grid=document.getElementById("grid");


grid.innerHTML="";



let start=
(new Date(y,m,1).getDay()+6)%7;



let total=
new Date(y,m+1,0).getDate();



for(let i=0;i<start;i++){


let e=document.createElement("div");

e.className="day";

e.style.visibility="hidden";

grid.appendChild(e);


}



let key=getKey();



if(!income[key]){

income[key]={};

}



if(!notes[key]){

notes[key]={};

}




for(let d=1;d<=total;d++){


let box=document.createElement("div");

box.className="day";



if(income[key][d]){

box.classList.add("active");

}




if(notes[key][d]){


let icon=document.createElement("span");


icon.className="note-icon";


icon.innerHTML="📝";


box.appendChild(icon);


}




let day=document.createElement("div");


day.innerHTML=d;


box.appendChild(day);





let input=document.createElement("input");

input.value=
income[key][d]||"";


input.placeholder="0";


input.inputMode="numeric";



input.oninput=function(){



this.value=this.value
.replace(/\D/g,"")
.substring(0,8);



if(this.value){


income[key][d]=Number(this.value);


box.classList.add("active");


}else{


delete income[key][d];


box.classList.remove("active");


}



localStorage.setItem(
"ps_income",
JSON.stringify(income)
);



calc();


};




input.onclick=function(e){

e.stopPropagation();

};





box.onclick=function(){

openNote(d);

};





box.appendChild(input);


grid.appendChild(box);



}


calc();

showNotes();


}









function calc(){


let key=getKey();


let sum=0;


let days=0;



for(let i in income[key]||{}){


if(income[key][i]){


sum+=Number(income[key][i]);


days++;


}


}




document.getElementById("sum").innerHTML=
"¥"+sum.toLocaleString();



document.getElementById("days").innerHTML=
days;



document.getElementById("avg").innerHTML=
"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}









function openNote(day){


currentNoteDay=day;


let key=getKey();



document.getElementById("noteTitle").innerHTML=
(now.getMonth()+1)
+
"月"
+
day
+
"日备注";




document.getElementById("noteText").value=
notes[key][day]||"";




document.getElementById("mask").style.display="flex";


}






document.getElementById("saveNote")
.onclick=function(){



let key=getKey();



let text=
document.getElementById("noteText")
.value
.trim();





if(!notes[key]){

notes[key]={};

}





if(text){


notes[key][currentNoteDay]=text;


}else{


delete notes[key][currentNoteDay];


}





localStorage.setItem(
"ps_notes",
JSON.stringify(notes)
);



document.getElementById("mask")
.style.display="none";



render();



};






document.getElementById("mask")
.onclick=function(e){


if(e.target===this){

this.style.display="none";

}


};







function showNotes(){



let box=document.getElementById("noteList");


let key=getKey();


let html="";



for(let d in notes[key]||{}){


html+=

"<div class='note-item'>📝 "
+
d
+
"日："
+
notes[key][d]
+
"</div>";



}



box.innerHTML=
html||"暂无备注";


}






document.getElementById("prev")
.onclick=function(){

now.setMonth(
now.getMonth()-1
);

render();

};



document.getElementById("next")
.onclick=function(){

now.setMonth(
now.getMonth()+1
);

render();

};






document.getElementById("clear")
.onclick=function(){


if(confirm("确定清空本月收益记录？")){


delete income[getKey()];


localStorage.setItem(
"ps_income",
JSON.stringify(income)
);



render();



}


};






document.getElementById("calcBtn")
.onclick=function(){


let position=
Number(
document.getElementById("position").value
);


let rate=
Number(
document.getElementById("incomeType").value
);


let time=
Number(
document.getElementById("time").value
);



if(!position||!time){

alert("请输入仓位和时间");

return;

}



let profit=
position*rate*time;



let total=
position+profit;



document.getElementById("profit")
.innerHTML=
"¥"+
Math.round(profit).toLocaleString();




document.getElementById("total")
.innerHTML=
"¥"+
Math.round(total).toLocaleString();



};






render();
<!-- 第4段开始：高清导出模块 -->


document.getElementById("export")
.onclick=function(){



let area=document.getElementById("captureArea");



// 导出前隐藏内容

let hidden=document.querySelectorAll(".export-hide");


hidden.forEach(function(el){

el.style.display="none";

});




// 临时调整导出比例

let oldWidth=area.style.width;

let oldPadding=area.style.padding;



area.style.width="440px";

area.style.padding="24px 18px";





html2canvas(area,{

scale:4,

useCORS:true,

backgroundColor:null,

logging:false

}).then(function(canvas){



let link=document.createElement("a");



link.download=

"磐石收益账本_"

+
now.getFullYear()

+
"年"

+
(now.getMonth()+1)

+
"月.png";



link.href=

canvas.toDataURL(
"image/png"
);



link.click();





//恢复页面

hidden.forEach(function(el){

el.style.display="";

});



area.style.width=oldWidth;

area.style.padding=oldPadding;



});



};





</script>


</body>

</html>
