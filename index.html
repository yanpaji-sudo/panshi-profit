<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>磐石收益账本</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

padding:15px;

background:#050505;

font-family:

"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;

}



/*================
主题
================*/


body.gold{

--main:#c9a84c;
--light:#f9e7a0;
--card:#111;
--bg:#050505;
--sub:#927b42;

}


body.jade{

--main:#20c997;
--light:#c8fff0;
--card:#08251b;
--bg:#02120d;
--sub:#5da88d;

}


body.blue{

--main:#4fa3ff;
--light:#d8ebff;
--card:#091a31;
--bg:#040b18;
--sub:#7694ba;

}



.wrap{

width:100%;

max-width:430px;

}



.card{

position:relative;

overflow:hidden;

background:

linear-gradient(
160deg,
rgba(255,255,255,.08),
transparent 40%
),

var(--card);


border:

1px solid var(--main);


border-radius:30px;

padding:26px 18px;

box-shadow:

0 20px 70px rgba(0,0,0,.8);

}




/* 光效 */

.card:before{

content:"";

position:absolute;

width:320px;

height:320px;

left:-120px;

top:-120px;


background:

radial-gradient(

circle,

rgba(255,255,255,.12),

transparent 70%

);


pointer-events:none;

z-index:0;

}




/* 内边框 */

.inner{

position:absolute;

left:5px;

right:5px;

top:5px;

bottom:5px;


border:

1px solid rgba(255,255,255,.12);


border-radius:25px;


pointer-events:none;

z-index:0;

}




/* 所有内容提高层级 */


.title,
.sub,
.theme,
.stats,
.month,
.week,
.grid,
.buttons,
.brand{

position:relative;

z-index:5;

}



/* 标题 */


.title{

text-align:center;

font-size:30px;

font-weight:900;

letter-spacing:5px;


background:

linear-gradient(

180deg,

#fff,

var(--light)

);


-webkit-background-clip:text;

color:transparent;

}



.sub{

text-align:center;

margin-top:8px;

font-size:12px;

letter-spacing:3px;

color:var(--sub);

}



/*主题*/


.theme{

display:flex;

gap:10px;

margin:20px 0;

}


.theme button{

flex:1;

height:38px;

border-radius:20px;


border:

1px solid var(--main);


background:

rgba(255,255,255,.05);


color:var(--light);

}



/*统计*/


.stats{

display:flex;

gap:10px;

}


.stat{

flex:1;

padding:15px 5px;

text-align:center;


border-radius:15px;


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.1);

}


.label{

font-size:11px;

color:var(--sub);

}


.value{

margin-top:8px;

font-size:20px;

font-weight:bold;

color:var(--light);

}




/*月份*/


.month{

margin:22px 0;

display:flex;

align-items:center;

justify-content:space-between;

}


.month button{

width:42px;

height:36px;


border-radius:18px;


border:

1px solid var(--main);


background:none;

color:var(--light);

font-size:22px;

}



.month span{

font-size:20px;

font-weight:bold;

color:var(--light);

}




.week{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

font-size:12px;

color:var(--sub);

margin-bottom:8px;

}





.grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;

}



.day{

height:56px;

border-radius:10px;


background:

rgba(255,255,255,.04);


border:

1px solid rgba(255,255,255,.12);


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


color:var(--light);

font-size:12px;


}



.day.active{

border-color:var(--main);

background:

rgba(201,168,76,.15);

}



.day input{

width:85%;

border:0;

outline:none;

background:none;


text-align:center;

font-size:11px;

color:var(--light);

}




.buttons{

display:flex;

gap:12px;

margin-top:22px;

}


.buttons button{

flex:1;

height:52px;


border-radius:18px;


font-size:15px;

font-weight:bold;

}



.export{

border:0;

background:

linear-gradient(

135deg,

var(--main),

var(--light)

);


color:#111;

}



.clear{

background:none;

border:

1px solid var(--main);


color:var(--light);

}



.brand{

margin-top:20px;

text-align:center;

font-size:11px;

letter-spacing:5px;

color:rgba(255,255,255,.3);

}



canvas{

display:none;

}


</style>

</head>


<body class="gold">


<div class="wrap">

<div class="card">


<div class="inner"></div>


<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 智能累计
</div>



<div class="theme">

<button onclick="changeTheme('gold')">
鎏金
</button>

<button onclick="changeTheme('jade')">
玉石
</button>

<button onclick="changeTheme('blue')">
星耀
</button>


</div>



<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>


</div>


<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>


</div>



<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>


</div>


</div>



<div class="month">

<button id="prev">
‹
</button>


<span id="ym"></span>


<button id="next">
›
</button>


</div>



<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>


<div class="grid" id="grid"></div>



<div class="buttons">


<button class="export" id="export">
📸 导出图片
</button>


<button class="clear" id="clear">
清空
</button>


</div>



<div class="brand">
P A N S H I · WEALTH
</div>


</div>

</div>


<canvas id="cv" width="1200" height="1800"></canvas><script>


//=========================
//主题
//=========================


function changeTheme(t){

document.body.className=t;

localStorage.setItem(
"ps_theme",
t
);

}



let saveTheme=
localStorage.getItem(
"ps_theme"
);


if(
saveTheme==="gold"||
saveTheme==="jade"||
saveTheme==="blue"
){

document.body.className=saveTheme;

}





//=========================
//数据
//=========================


let now=new Date();


let data=
JSON.parse(

localStorage.getItem(
"ps_income"
)

||
"{}"

);



function key(){

return now.getFullYear()
+
"-"
+
now.getMonth();

}





//=========================
//生成日历
//=========================


function render(){



let y=now.getFullYear();

let m=now.getMonth();



document
.getElementById("ym")
.innerHTML=
y+"年"+(m+1)+"月";



let grid=
document.getElementById("grid");


grid.innerHTML="";



let first=
new Date(
y,
m,
1
)
.getDay();



let start=
(first+6)%7;



let days=
new Date(
y,
m+1,
0
)
.getDate();





for(let i=0;i<start;i++){


let blank=
document.createElement("div");


blank.className="day";


blank.style.visibility="hidden";


grid.appendChild(blank);


}




let k=key();


if(!data[k]){

data[k]={};

}





for(let d=1;d<=days;d++){


let box=
document.createElement("div");


box.className="day";



let old=
data[k][d]||"";


if(old){

box.classList.add("active");

}



let num=
document.createElement("div");


num.innerHTML=d;



let input=
document.createElement("input");


input.type="number";


input.placeholder="0";


input.value=old;



input.addEventListener(
"input",
function(){


if(this.value){

data[k][d]=
Number(this.value);


box.classList.add(
"active"
);


}else{


delete data[k][d];


box.classList.remove(
"active"
);


}



localStorage.setItem(

"ps_income",

JSON.stringify(data)

);



calc();



}

);




box.appendChild(num);

box.appendChild(input);


grid.appendChild(box);



}



calc();


}





//=========================
//统计
//=========================


function calc(){


let k=key();


let sum=0;

let days=0;



Object.keys(
data[k]||{}
)
.forEach(function(i){


sum+=Number(
data[k][i]
);


days++;


});



document
.getElementById("sum")
.innerHTML=
"¥"+
sum.toLocaleString();



document
.getElementById("days")
.innerHTML=
days;



document
.getElementById("avg")
.innerHTML=
"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}






//=========================
//月份按钮
//=========================



document
.getElementById("prev")
.onclick=function(){

now.setMonth(
now.getMonth()-1
);

render();

};




document
.getElementById("next")
.onclick=function(){

now.setMonth(
now.getMonth()+1
);

render();

};





//=========================
//清空
//=========================


document
.getElementById("clear")
.onclick=function(){


if(
confirm(
"确定清空本月收益？"
)
){


delete data[key()];


localStorage.setItem(

"ps_income",

JSON.stringify(data)

);


render();


}


};






//=========================
//导出图片
//=========================


document
.getElementById("export")
.onclick=function(){



let canvas=
document.getElementById("cv");


let ctx=
canvas.getContext("2d");



let W=1200;

let H=1800;



ctx.clearRect(
0,
0,
W,
H
);




//主题颜色


let theme=
document.body.className;



let main="#c9a84c";

let light="#f9e7a0";

let bg="#111";



if(theme==="jade"){

main="#20c997";

light="#c8fff0";

bg="#08251b";

}



if(theme==="blue"){

main="#4fa3ff";

light="#d8ebff";

bg="#091a31";

}




//背景


let bgd=
ctx.createLinearGradient(
0,
0,
0,
H
);


bgd.addColorStop(
0,
bg
);


bgd.addColorStop(
1,
"#000"
);



ctx.fillStyle=bgd;

ctx.fillRect(
0,
0,
W,
H
);





//卡片


ctx.strokeStyle=main;

ctx.lineWidth=3;


ctx.strokeRect(
50,
50,
1100,
1650
);





//标题


ctx.textAlign="center";


ctx.fillStyle=light;


ctx.font=
"bold 70px Microsoft YaHei";


ctx.fillText(
"磐石收益账本",
600,
160
);



ctx.font=
"28px Microsoft YaHei";


ctx.fillText(
"财富记录 · 智能累计",
600,
220
);





//统计


let k=key();

let sum=0;

let count=0;


for(let i in data[k]||{}){


sum+=Number(data[k][i]);

count++;


}



ctx.font=
"32px Arial";


ctx.fillText(

"累计 ¥"+sum.toLocaleString()
+
"   天数 "+count,

600,

330

);





//月份


ctx.font=
"42px Microsoft YaHei";


ctx.fillText(

now.getFullYear()
+
"年"
+
(now.getMonth()+1)
+
"月",

600,

430

);





//日历


let y=520;

let bottom=520;



let first=
(new Date(
now.getFullYear(),
now.getMonth(),
1
).getDay()+6)%7;



let max=
new Date(
now.getFullYear(),
now.getMonth()+1,
0
)
.getDate();



for(let d=1;d<=max;d++){


let index=
first+d-1;


let row=
Math.floor(index/7);


let col=
index%7;



let x=
80+col*150;


let yy=
y+row*110;



bottom=yy+100;



ctx.strokeStyle=
"rgba(255,255,255,.2)";


ctx.strokeRect(
x,
yy,
130,
90
);



ctx.fillStyle=light;


ctx.font=
"24px Arial";


ctx.fillText(
d,
x+65,
yy+35
);



if(
data[k]&&data[k][d]
){


ctx.fillText(

data[k][d],

x+65,

yy+70

);


}


}





//水印自动避让


let wy=
bottom+120;



if(wy>1450){

wy=1450;

}



ctx.font=
"bold 58px Microsoft YaHei";


ctx.fillStyle=main;


ctx.globalAlpha=.7;



ctx.fillText(

"加入磐石开启财富人生",

600,

wy

);



ctx.globalAlpha=1;




canvas.toBlob(
function(blob){


let a=document.createElement("a");


a.href=
URL.createObjectURL(blob);


a.download=
"磐石收益账本.png";


a.click();


}
);


};




//启动

render();


</script>

</body>

</html>
