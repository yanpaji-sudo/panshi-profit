<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>磐石收益账本</title>
<style>
  /* 全局样式 - 背景提亮 */
  body {
    margin: 0;
    padding: 0;
    background: #1a1a1a; /* 原来是 #000，现在改为深炭灰 */
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 10px;
    box-sizing: border-box;
  }
  #app {
    width: 100%;
    max-width: 430px;
  }
  /* Canvas 画布 */
  canvas {
    width: 100%;
    display: block;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  /* 按钮容器 */
  .btns {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.97);
  }
  #exportBtn {
    background: linear-gradient(135deg, #f9e7a0, #c9a84c);
    color: #1a1a1a;
  }
  #clearBtn {
    background: transparent;
    border: 2px solid #c9a84c;
    color: #c9a84c;
  }
</style>
</head>
<body>
<div id="app">
  <!-- 这里是图片本体 -->
  <canvas id="cv" width="860" height="1200"></canvas>
  
  <!-- 这里是真实的按钮，不是画出来的 -->
  <div class="btns">
    <button id="exportBtn">📸 导出图片</button>
    <button id="clearBtn">清空本月</button>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  // 当前年月（示例：2026年8月）
  let y = 2026, m = 7; 
  
  // 读取本地存储
  let data = JSON.parse(localStorage.getItem('panshi_data') || '{}');
  if(!data[y]) data[y] = {};
  if(!data[y][m]) data[y][m] = {};

  // 初始化一些演示数据（方便你测试导出）
  function initData(){
    for(let i=1;i<=16;i++){ if(!data[y][m][i]) data[y][m][i] = Math.floor(Math.random()*5000)+1000; }
    localStorage.setItem('panshi_data', JSON.stringify(data));
  }
  initData();

  // 主绘制函数
  function render(){
    // 1. 背景填充（已提亮）
    ctx.fillStyle = '#1a1a1a'; // 主背景
    ctx.fillRect(0,0,W,H);

    // 2. 外框
    ctx.strokeStyle = '#c9a84c';
    ctx.lineWidth = 4;
    ctx.strokeRect(20,20,W-40,H-40);

    // 3. 标题
    ctx.fillStyle = '#f9e7a0';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('磐石收益账本', W/2, 50);
    
    ctx.font = '24px sans-serif';
    ctx.fillStyle = '#a09060';
    ctx.fillText('本地记录 · 关闭后自动累计', W/2, 110);

    // 4. 统计卡片（背景提亮）
    let sum=0, days=0;
    const monthData = data[y][m];
    Object.keys(monthData).forEach(k=>{ sum+=monthData[k]; if(monthData[k]>0) days++; });
    let avg = days ? Math.round(sum/days) : 0;

    const stats = [['累计收益','¥'+sum.toLocaleString()],['收益天数',days],['日均金额','¥'+avg.toLocaleString()]];
    stats.forEach((s,i)=>{
      const x = 50 + i*260, y0 = 160;
      ctx.fillStyle = '#252525'; // 原来是 #0d0d0d，现在提亮
      ctx.fillRect(x,y0,240,90);
      ctx.strokeStyle = '#c9a84c';
      ctx.lineWidth=1;
      ctx.strokeRect(x,y0,240,90);
      ctx.fillStyle = '#a09060';
      ctx.font='22px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(s[0], x+120, y0+15);
      ctx.fillStyle = '#f9e7a0';
      ctx.font='bold 34px sans-serif';
      ctx.fillText(s[1], x+120, y0+45);
    });

    // 5. 月份
    ctx.fillStyle = '#f9e7a0';
    ctx.font='bold 38px sans-serif';
    ctx.fillText(`${y}年${m+1}月`, W/2, 280);

    // 6. 日历网格
    const startY = 350;
    const cellW = 100, cellH = 110, gap = 12;
    const offset = new Date(y,m,1).getDay() || 7;
    const dim = new Date(y,m+1,0).getDate();

    // 星期头
    ['一','二','三','四','五','六','日'].forEach((w,i)=>{
      ctx.fillStyle='#a09060';
      ctx.font='22px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(w, 55 + i*(cellW+gap), startY);
    });

    // 日期格子
    for(let d=1; d<=dim; d++){
      let idx = d-1 + offset - 1;
      let r = Math.floor(idx/7), c = idx%7;
      let x = 30 + c*(cellW+gap), y0 = startY + 30 + r*(cellH+gap);
      let val = monthData[d];

      // 格子背景（提亮）
      ctx.fillStyle = val ? 'rgba(201,168,76,0.25)' : '#252525';
      ctx.fillRect(x,y0,cellW,cellH);
      ctx.strokeStyle = val ? '#f9e7a0' : 'rgba(201,168,76,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x+1,y0+1,cellW-2,cellH-2);

      ctx.fillStyle = val ? '#fff' : '#a09060';
      ctx.font='bold 26px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(String(d), x+cellW/2, y0+12);
      if(val){
        ctx.fillStyle='#f9e7a0';
        ctx.font='bold 28px monospace';
        ctx.fillText(String(val), x+cellW/2, y0+60);
      }
    }

    // 7. 水印（固定在格子下方）
    const totalRows = Math.ceil((offset-1+dim)/7);
    const wmY = startY + 30 + totalRows*(cellH+gap) + 60;
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle = 'rgba(201,168,76,0.5)';
    ctx.fillText('加入磐石开启财富人生', W/2, wmY);

    // 8. 底部品牌
    ctx.fillStyle = 'rgba(201,168,76,0.2)';
    ctx.font='24px sans-serif';
    ctx.fillText('P A N S H I  ·  W E A L T H', W/2, wmY+60);
  }

  // 执行绘制
  render();

  // 9. 导出功能（真实按钮触发，100%有效）
  function downloadCanvas(){
    const dataURL = cv.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = `磐石收益账本_${y}年${m+1}月.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  document.getElementById('exportBtn').onclick = downloadCanvas;

  document.getElementById('clearBtn').onclick = function(){
    if(confirm('确定清空本月所有记录？')){
      data[y][m] = {};
      localStorage.setItem('panshi_data', JSON.stringify(data));
      initData(); // 重新填演示数据以便观察
      render(); // 重绘
    }
  };

})();
</script>
</body>
</html>
