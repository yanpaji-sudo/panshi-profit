<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>磐石收益账本</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

padding:16px;


font-family:

"PingFang SC",
"Microsoft YaHei",
Arial,sans-serif;


transition:.3s;

}



/*=====================
主题
=====================*/


body.gold{

--main:#c9a84c;
--light:#fff1b8;
--card:#111111;
--bg:#050505;
--sub:#9c8650;

}


body.jade{

--main:#20c997;
--light:#d9fff4;
--card:#08251b;
--bg:#02120c;
--sub:#61aa91;

}



body.blue{

--main:#4fa3ff;
--light:#e1f0ff;
--card:#091a31;
--bg:#040b18;
--sub:#7898c2;

}



body{

background:var(--bg);

}





.wrap{

width:100%;

max-width:430px;

}



/*=====================
卡片
=====================*/


.card{

position:relative;

overflow:hidden;


background:

linear-gradient(
160deg,
rgba(255,255,255,.1),
transparent 40%
),

var(--card);


border:

1.5px solid var(--main);


border-radius:32px;


padding:26px 18px;


box-shadow:

0 25px 80px rgba(0,0,0,.8);

}




.card:before{

content:"";


position:absolute;


width:350px;

height:350px;


left:-130px;

top:-130px;



background:

radial-gradient(

circle,

rgba(255,255,255,.15),

transparent 70%

);



pointer-events:none;

}





.inner{


position:absolute;


left:5px;

right:5px;

top:5px;

bottom:5px;


border:

1px solid rgba(255,255,255,.12);


border-radius:28px;


pointer-events:none;


}



/*内容层级*/


.title,
.sub,
.theme,
.stats,
.month,
.week,
.grid,
.buttons,
.brand{

position:relative;

z-index:5;

}





/*=====================
标题
=====================*/


.title{


text-align:center;


font-size:30px;


font-weight:900;


letter-spacing:5px;



background:

linear-gradient(

180deg,

#ffffff,

var(--light)

);



-webkit-background-clip:text;

color:transparent;


}



.sub{


margin-top:8px;


text-align:center;


font-size:12px;


letter-spacing:3px;


color:var(--sub);


}



/*=====================
主题按钮
=====================*/


.theme{


display:flex;

gap:10px;


margin:22px 0;

}



.theme button{


flex:1;


height:38px;


border-radius:20px;


background:

rgba(255,255,255,.06);



border:

1px solid var(--main);



color:var(--light);


font-weight:bold;


}





/*=====================
统计
=====================*/


.stats{


display:flex;


gap:10px;


}



.stat{


flex:1;


padding:15px 5px;


border-radius:16px;


text-align:center;



background:

rgba(255,255,255,.05);



border:

1px solid rgba(255,255,255,.12);


}




.label{


font-size:11px;


color:var(--sub);


}



.value{


margin-top:8px;


font-size:20px;


font-weight:900;


color:var(--light);


}





/*=====================
月份
=====================*/


.month{


display:flex;


align-items:center;


justify-content:space-between;


margin:22px 0;


}



.month button{


width:42px;


height:36px;


border-radius:20px;


background:none;


border:

1px solid var(--main);


color:var(--light);


font-size:24px;


}




.month span{


font-size:20px;


font-weight:900;


color:var(--light);


}





/*=====================
星期
=====================*/


.week{


display:grid;


grid-template-columns:repeat(7,1fr);


text-align:center;


font-size:12px;


margin-bottom:8px;


color:var(--sub);


}






/*=====================
日历
=====================*/


.grid{


display:grid;


grid-template-columns:repeat(7,1fr);


gap:6px;


}



.day{


height:58px;


border-radius:11px;


display:flex;


flex-direction:column;


justify-content:center;


align-items:center;


background:

rgba(255,255,255,.04);


border:

1px solid rgba(255,255,255,.12);



color:var(--light);


font-size:12px;


}



.day.active{


border-color:var(--main);



background:

rgba(201,168,76,.18);


}




.day input{


width:88%;


height:18px;


margin-top:4px;


padding:0;


border:0;


outline:0;


border-radius:6px;


background:

rgba(0,0,0,.25);



text-align:center;



font-size:12px;


font-weight:700;


line-height:18px;


color:var(--light);



appearance:none;

-webkit-appearance:none;

}



.day input::-webkit-inner-spin-button,
.day input::-webkit-outer-spin-button{


-webkit-appearance:none;

}





/*=====================
按钮
=====================*/


.buttons{


display:flex;


gap:12px;


margin-top:22px;


}



.buttons button{


flex:1;


height:52px;


border-radius:18px;


font-size:15px;


font-weight:bold;


}



.export{


border:0;


background:

linear-gradient(

135deg,

var(--main),

var(--light)

);


color:#111;


}



.clear{


background:none;


border:

1px solid var(--main);


color:var(--light);


}




.brand{


margin-top:20px;


text-align:center;


font-size:11px;


letter-spacing:5px;


color:rgba(255,255,255,.3);


}




</style>

</head>


<body class="gold">


<div class="wrap">


<div class="card" id="card">


<div class="inner"></div>


<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 智能累计
</div>



<div class="theme">

<button onclick="changeTheme('gold')">
鎏金
</button>


<button onclick="changeTheme('jade')">
玉石
</button>


<button onclick="changeTheme('blue')">
星耀
</button>


</div>



<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>

</div>


<div class="stat">

<div class="label">
收益天数
</div>

<div class="value" id="days">
0
</div>

</div>


<div class="stat">

<div class="label">
日均收益
</div>

<div class="value" id="avg">
¥0
</div>

</div>


</div>


<div class="month">

<button id="prev">
‹
</button>


<span id="ym"></span>


<button id="next">
›
</button>


</div>


<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>


<div class="grid" id="grid"></div>


<div class="buttons">

<button class="export" id="export">
📸 导出图片
</button>


<button class="clear" id="clear">
清空
</button>


</div>


<div class="brand">
P A N S H I · WEALTH
</div>


</div>

</div><script>


//=========================
//主题切换
//=========================


function changeTheme(type){


document.body.className=type;


localStorage.setItem(
"ps_theme",
type
);


}



let oldTheme=
localStorage.getItem(
"ps_theme"
);



if(
oldTheme==="gold"||
oldTheme==="jade"||
oldTheme==="blue"
){

document.body.className=oldTheme;

}





//=========================
//数据
//=========================


let current=
new Date();


let income=
JSON.parse(

localStorage.getItem(
"ps_income"
)

||

"{}"

);





function getKey(){


return current.getFullYear()
+
"-"
+
current.getMonth();


}





//=========================
//渲染日历
//=========================


function render(){



let y=current.getFullYear();


let m=current.getMonth();



document.getElementById("ym").innerHTML=

y+"年"+(m+1)+"月";




let grid=
document.getElementById("grid");



grid.innerHTML="";




let first=

new Date(
y,
m,
1
)
.getDay();



let offset=
(first+6)%7;



let total=

new Date(
y,
m+1,
0
)
.getDate();





for(let i=0;i<offset;i++){


let empty=
document.createElement("div");


empty.className="day";


empty.style.visibility="hidden";


grid.appendChild(empty);


}





let key=getKey();



if(!income[key]){

income[key]={};

}






for(let d=1;d<=total;d++){



let box=
document.createElement("div");



box.className="day";



let value=
income[key][d]||"";



if(value){

box.classList.add(
"active"
);

}





let number=
document.createElement("div");

number.innerHTML=d;





let input=
document.createElement("input");


input.type="number";


input.value=value;


input.placeholder="0";






input.oninput=function(){



this.value=
this.value.replace(
/\D/g,
""
)
.substring(0,8);





if(this.value){



income[key][d]=
Number(this.value);



box.classList.add(
"active"
);



}else{


delete income[key][d];


box.classList.remove(
"active"
);


}



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();


};





box.appendChild(number);


box.appendChild(input);



grid.appendChild(box);



}




calc();



}





//=========================
//统计
//=========================


function calc(){


let key=getKey();



let sum=0;


let days=0;




for(let i in income[key]||{}){


if(
income[key][i]
){

sum+=Number(
income[key][i]
);


days++;

}


}




document.getElementById("sum")
.innerHTML=
"¥"+
sum.toLocaleString();




document.getElementById("days")
.innerHTML=
days;




document.getElementById("avg")
.innerHTML=
"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}






//=========================
//月份切换
//=========================



document
.getElementById("prev")
.onclick=function(){


current.setMonth(
current.getMonth()-1
);


render();


};





document
.getElementById("next")
.onclick=function(){


current.setMonth(
current.getMonth()+1
);


render();


};






//=========================
//清空
//=========================


document
.getElementById("clear")
.onclick=function(){



if(
confirm(
"确定清空本月所有收益？"
)

){



delete income[getKey()];



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



render();


}



};





//初始化

render();



</script><script>


//=========================
//高清导出图片
//=========================


document
.getElementById("export")
.onclick=function(){



let card=
document.getElementById("card");



//创建水印

let watermark=
document.createElement("div");



watermark.innerHTML=
"加入磐石开启财富人生";



watermark.style.position=
"absolute";



watermark.style.left=
"0";



watermark.style.right=
"0";



watermark.style.bottom=
"85px";



watermark.style.textAlign=
"center";



watermark.style.fontSize=
"22px";



watermark.style.fontWeight=
"900";



watermark.style.letterSpacing=
"3px";



watermark.style.color=
"rgba(201,168,76,.65)";



watermark.style.textShadow=
"0 2px 8px rgba(0,0,0,.8)";



watermark.style.zIndex=
"50";



watermark.style.pointerEvents=
"none";





card.appendChild(
watermark
);







html2canvas(
card,
{


scale:3,


backgroundColor:null,


useCORS:true,


allowTaint:true,


logging:false


}

)

.then(function(canvas){



let link=
document.createElement("a");



link.download=

"磐石收益账本_"+
new Date().getTime()
+
".png";



link.href=

canvas.toDataURL(
"image/png",
1.0
);



link.click();




//删除临时水印

card.removeChild(
watermark
);



});



};



</script>


</body>

</html>
