<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,user-scalable=no">


<title>磐石收益账本 Pro</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

padding:15px;

font-family:
"PingFang SC",
"Microsoft YaHei",
Arial;

background:var(--bg);

overflow-x:hidden;

}



/*================
主题系统
================*/


body.gold{

--bg:#050505;
--card:#111;
--main:#d4af37;
--light:#fff0a6;
--sub:#a88935;

}


body.jade{

--bg:#03140e;
--card:#08251b;
--main:#22c997;
--light:#d8fff5;
--sub:#55a88b;

}



body.blue{

--bg:#061222;
--card:#0b1e38;
--main:#4fa3ff;
--light:#dceeff;
--sub:#7899c5;

}



body.black{

--bg:#000;
--card:#080808;
--main:#888;
--light:#eee;
--sub:#777;

}



body.purple{

--bg:#12051c;
--card:#21102f;
--main:#c77dff;
--light:#f0d9ff;
--sub:#aa7cc5;

}



body.red{

--bg:#210404;
--card:#2a0808;
--main:#ff5252;
--light:#ffe1e1;
--sub:#bd7777;

}



body.silver{

--bg:#101215;
--card:#191c20;
--main:#d8dde5;
--light:#ffffff;
--sub:#9299a5;

}



body.bronze{

--bg:#160b04;
--card:#251307;
--main:#c47a32;
--light:#ffe0ae;
--sub:#9d7045;

}





.wrap{

width:100%;

max-width:430px;

}



.card{


position:relative;

overflow:hidden;


background:

linear-gradient(
145deg,
rgba(255,255,255,.12),
transparent 35%
),

var(--card);



border:

1.5px solid var(--main);


border-radius:32px;


padding:25px 18px;


box-shadow:

0 30px 90px rgba(0,0,0,.8);



}



.card:before{

content:"";


position:absolute;

width:450px;

height:450px;

top:-220px;

left:-220px;


background:

radial-gradient(
circle,
rgba(255,255,255,.15),
transparent 65%
);


}




.card:after{

content:"";


position:absolute;

width:400px;

height:400px;


bottom:-250px;

right:-200px;


background:

radial-gradient(
circle,
rgba(255,215,100,.12),
transparent 65%
);


}



.content{

position:relative;

z-index:5;

}




.inner{

position:absolute;

inset:6px;


border:

1px solid rgba(255,255,255,.15);


border-radius:26px;

}



/*标题*/


.title{


text-align:center;


font-size:30px;


font-weight:900;


letter-spacing:5px;


background:

linear-gradient(
180deg,
#fff,
var(--light)

);


-webkit-background-clip:text;

color:transparent;


}



.sub{


text-align:center;


margin-top:8px;


font-size:12px;


letter-spacing:3px;


color:var(--sub);

}




/*主题选择*/


.theme{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:8px;

margin:22px 0;

}



.theme button{


height:32px;


border-radius:18px;


background:

rgba(255,255,255,.06);


border:

1px solid var(--main);


color:var(--light);


font-size:11px;


}




/*统计*/


.stats{

display:flex;

gap:10px;

}



.stat{


flex:1;


padding:15px 5px;


border-radius:16px;


background:

rgba(255,255,255,.06);


border:

1px solid rgba(255,255,255,.15);


text-align:center;

}


.label{

font-size:11px;

color:var(--sub);

}


.value{

margin-top:8px;

font-size:20px;

font-weight:900;

color:var(--light);

}




.month{


display:flex;

justify-content:space-between;

align-items:center;


margin:22px 0;


}



.month button{

width:40px;

height:36px;

border-radius:20px;


border:

1px solid var(--main);


background:none;


color:var(--light);


font-size:24px;


}


.month span{

font-size:20px;

font-weight:900;

color:var(--light);

}



/*星期*/


.week{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

font-size:12px;

color:var(--sub);

margin-bottom:8px;

}



/*日期*/


.grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:6px;

}


.day{

height:58px;

border-radius:12px;


display:flex;

flex-direction:column;


justify-content:center;

align-items:center;


background:

rgba(255,255,255,.04);


border:

1px solid rgba(255,255,255,.12);


color:var(--light);


}



.day.active{

border-color:var(--main);

background:

rgba(255,215,100,.18);


}



.day input{

width:90%;

height:18px;

margin-top:4px;


border:0;

outline:none;


background:

rgba(0,0,0,.25);


border-radius:6px;


text-align:center;


font-size:12px;

font-weight:700;


color:var(--light);


}



/*按钮*/


.buttons{

display:flex;

gap:12px;

margin-top:22px;

}



.buttons button{

flex:1;

height:52px;

border-radius:18px;

font-weight:bold;

}



.export{

background:

linear-gradient(
135deg,
var(--main),
var(--light)

);


border:0;


}



.clear{

background:none;

border:

1px solid var(--main);


color:var(--light);


}



.brand{

margin-top:20px;

text-align:center;

letter-spacing:5px;

font-size:11px;

color:rgba(255,255,255,.35);


}



</style>

</head><body class="gold">


<div class="wrap">


<div class="card" id="card">


<div class="inner"></div>


<div class="content">



<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 智能累计 · 品牌管理
</div>



<!--主题选择-->

<div class="theme">


<button onclick="changeTheme('gold')">
鎏金
</button>


<button onclick="changeTheme('jade')">
翡翠
</button>


<button onclick="changeTheme('blue')">
星辰
</button>


<button onclick="changeTheme('black')">
黑钻
</button>


<button onclick="changeTheme('purple')">
紫晶
</button>


<button onclick="changeTheme('red')">
红曜
</button>


<button onclick="changeTheme('silver')">
银白
</button>


<button onclick="changeTheme('bronze')">
古铜
</button>


</div>





<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>


</div>



<div class="stat">

<div class="label">
收益天数
</div>


<div class="value" id="days">
0
</div>


</div>




<div class="stat">

<div class="label">
日均收益
</div>


<div class="value" id="avg">
¥0
</div>


</div>


</div>





<div class="month">


<button id="prev">
‹
</button>


<span id="ym"></span>


<button id="next">
›
</button>


</div>





<div class="week">

<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
<div>日</div>

</div>





<div class="grid" id="grid"></div>





<div class="buttons">


<button class="export" id="export">
📸 导出品牌图片
</button>


<button class="clear" id="clear">
清空
</button>


</div>



<div class="brand">

P A N S H I · WEALTH

</div>




</div>

</div>

</div>





<script>


//======================
//主题
//======================



function changeTheme(t){


document.body.className=t;


localStorage.setItem(
"ps_theme",
t
);


}



let saveTheme=
localStorage.getItem(
"ps_theme"
);



if(saveTheme){

document.body.className=
saveTheme;

}







//======================
//数据
//======================


let date=
new Date();



let income=
JSON.parse(

localStorage.getItem(
"ps_income"
)

||

"{}"

);





function key(){


return date.getFullYear()
+
"-"
+
date.getMonth();


}







//======================
//生成日历
//======================


function render(){



let y=
date.getFullYear();


let m=
date.getMonth();



document.getElementById("ym")
.innerHTML=

y+"年"+(m+1)+"月";



let grid=
document.getElementById("grid");



grid.innerHTML="";





let first=

(new Date(
y,
m,
1
).getDay()+6)%7;




let days=

new Date(
y,
m+1,
0
)
.getDate();





for(let i=0;i<first;i++){


let e=document.createElement("div");

e.className="day";

e.style.visibility="hidden";


grid.appendChild(e);

}






let k=key();



if(!income[k]){

income[k]={};

}






for(let d=1;d<=days;d++){



let box=
document.createElement("div");



box.className="day";



let old=
income[k][d]||"";



if(old){

box.classList.add(
"active"
);

}





let num=
document.createElement("div");


num.innerHTML=d;






let input=
document.createElement("input");



input.type="number";


input.value=old;


input.placeholder="0";



input.oninput=function(){



this.value=

this.value
.replace(/\D/g,"")
.substring(0,8);




if(this.value){


income[k][d]=
Number(this.value);


box.classList.add(
"active"
);


}else{


delete income[k][d];


box.classList.remove(
"active"
);


}



localStorage.setItem(

"ps_income",

JSON.stringify(income)

);



calc();


};





box.appendChild(num);


box.appendChild(input);


grid.appendChild(box);


}



calc();


}






//======================
//统计
//======================


function calc(){



let k=key();


let sum=0;


let days=0;



for(let i in income[k]||{}){


if(income[k][i]){


sum+=
Number(income[k][i]);


days++;

}


}




document.getElementById("sum")
.innerHTML=

"¥"+
sum.toLocaleString();



document.getElementById("days")
.innerHTML=
days;



document.getElementById("avg")
.innerHTML=

"¥"+
(
days?
Math.round(sum/days):
0
)
.toLocaleString();



}





//月份


document.getElementById("prev")
.onclick=function(){


date.setMonth(
date.getMonth()-1
);


render();


};




document.getElementById("next")
.onclick=function(){


date.setMonth(
date.getMonth()+1
);


render();


};






//清空


document.getElementById("clear")
.onclick=function(){



if(confirm("确定清空本月记录？")){


delete income[key()];


localStorage.setItem(
"ps_income",
JSON.stringify(income)
);



render();



}


};




render();



</script><script>


//==============================
// LOGO水印配置
//==============================


//以后替换这里即可
//例如:
//let logo="logo.png";


let logoText="P A N S H I";





//==============================
//高清导出
//==============================


document
.getElementById("export")
.onclick=function(){



let card=
document.getElementById("card");



//保存原状态


let oldOverflow=
card.style.overflow;


card.style.overflow="hidden";





//创建水印层


let wm=
document.createElement("div");



wm.style.position=
"absolute";


wm.style.left="-40%";


wm.style.top="-20%";


wm.style.width="180%";


wm.style.height="180%";



wm.style.zIndex="2";



wm.style.pointerEvents="none";



wm.style.transform=
"rotate(-35deg)";



wm.style.display=
"flex";



wm.style.flexWrap=
"wrap";



wm.style.alignContent=
"center";



wm.style.gap=
"80px";





let color=
getComputedStyle(document.body)
.getPropertyValue("--main");




for(let i=0;i<20;i++){



let item=
document.createElement("div");



item.innerHTML=
logoText;



item.style.width="180px";


item.style.textAlign="center";


item.style.fontSize="26px";


item.style.fontWeight="900";


item.style.letterSpacing="5px";


item.style.color=color;



item.style.opacity=".08";



wm.appendChild(item);



}





card.appendChild(wm);





//底部品牌水印


let bottom=
document.createElement("div");



bottom.innerHTML=
"加入磐石开启财富人生";



bottom.style.position=
"absolute";



bottom.style.left="0";


bottom.style.right="0";



bottom.style.bottom="25px";



bottom.style.textAlign="center";



bottom.style.fontSize="14px";


bottom.style.fontWeight="bold";



bottom.style.color=color;



bottom.style.opacity=".6";



bottom.style.zIndex="20";



card.appendChild(bottom);







//生成图片


html2canvas(card,{

scale:4,


backgroundColor:null,


useCORS:true,


logging:false


})


.then(function(canvas){



let a=
document.createElement("a");



a.download=
"磐石收益账本_品牌版.png";



a.href=
canvas.toDataURL(
"image/png",
1
);



a.click();





//清理


card.removeChild(wm);


card.removeChild(bottom);


card.style.overflow=
oldOverflow;



});



};



</script>


</body>

</html>
