.wrap{width:100%;max-width:440px;}
.card{position:relative;overflow:hidden;width:100%;padding:24px 18px;border-radius:30px;border-width:1px;border-style:solid;}
.card:before{content:"";position:absolute;width:420px;height:420px;left:-160px;top:-160px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);pointer-events:none;}
.inner{position:absolute;inset:6px;border-radius:25px;border:1px solid rgba(255,255,255,.1);pointer-events:none;}
.title{position:relative;text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;}
.sub{text-align:center;margin-top:8px;font-size:12px;letter-spacing:3px;}
.theme{display:flex;gap:5px;margin:20px 0;flex-wrap:wrap;}
.theme button{flex:1;min-width:60px;height:34px;border-radius:18px;background:rgba(255,255,255,.05);font-size:11px;cursor:pointer;border-width:1px;border-style:solid;}
.theme button:hover{filter:brightness(1.2);}
.stats{display:flex;gap:10px;}
.stat{flex:1;padding:15px 5px;border-radius:16px;text-align:center;border-width:1px;border-style:solid;}
.label{font-size:11px;}
.value{margin-top:8px;font-size:20px;font-weight:900;}
.month{margin:22px 0;display:flex;align-items:center;justify-content:space-between;}
.month button{width:42px;height:36px;border-radius:18px;background:none;font-size:25px;cursor:pointer;border-width:1px;border-style:solid;}
.month span{font-size:20px;font-weight:900;}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;margin-bottom:8px;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{height:58px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;cursor:pointer;border-width:1px;border-style:solid;}
.day-num{font-size:12px;font-weight:bold;line-height:1;margin-bottom:2px;}
.day input{width:90%;height:22px;border:0;outline:0;background:none;text-align:center!important;font-size:13px;font-weight:bold;}
.day input::placeholder{font-size:11px;}
.note-icon{position:absolute;right:3px;top:2px;font-size:11px;}
.note-box{margin-top:18px;padding:14px;border-radius:18px;border-width:1px;border-style:solid;}
.note-title{font-weight:bold;margin-bottom:10px;}
.note-item{font-size:12px;line-height:22px;}
.calculator{margin-top:18px;padding:15px;border-radius:20px;border-width:1px;border-style:solid;}
.calc-title{text-align:center;font-size:18px;font-weight:900;margin-bottom:15px;}
.calculator input,.calculator select{width:100%;height:45px;margin-bottom:12px;border-radius:12px;background:#000;outline:none;font-size:14px;text-align:center;border-width:1px;border-style:solid;}
#calcBtn{width:100%;height:45px;border-radius:15px;border:0;font-size:15px;font-weight:bold;cursor:pointer;}
.calc-result{margin-top:12px;background:#000;border-radius:15px;padding:10px;}
.calc-result div{display:flex;justify-content:space-between;padding:8px;font-size:13px;}
.calc-result span{font-size:20px;font-weight:900;}
.buttons{display:flex;gap:12px;margin-top:20px;}
.buttons button{flex:1;height:52px;border-radius:18px;font-size:15px;font-weight:bold;cursor:pointer;border-width:0;}
.export{border-width:0;}
.clear{background:transparent;}
.brand{margin-top:20px;text-align:center;font-size:11px;letter-spacing:5px;color:rgba(255,255,255,.25);}
.mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:999;}
.panel{width:85%;padding:20px;border-radius:22px;border-width:1px;border-style:solid;}
.panel h3{text-align:center;margin-bottom:15px;font-size:16px;}
.panel textarea{width:100%;height:130px;border-radius:15px;padding:10px;font-size:14px;resize:none;outline:none;background:#000;}
.panel button{width:100%;height:45px;margin-top:15px;border-radius:15px;font-size:15px;font-weight:bold;cursor:pointer;border-width:0;}
</style>
</head>

function getCurrentTheme(){var t=document.body.className;return themeColors[t]||themeColors.gold;}
function changeTheme(t){document.body.className=t;try{localStorage.setItem("ps_theme",t);}catch(e){}}
(function(){var t=localStorage.getItem("ps_theme");document.body.className=t?t:"gold";})();

var now=new Date();
var income={},notes={};
try{income=JSON.parse(localStorage.getItem("ps_income")||"{}");}catch(e){}
try{notes=JSON.parse(localStorage.getItem("ps_notes")||"{}");}catch(e){}
var currentDay=null;

function getKey(){return now.getFullYear()+"-"+now.getMonth();}

function render(){
var y=now.getFullYear(),m=now.getMonth();
document.getElementById("ym").innerHTML=y+"年"+(m+1)+"月";
var grid=document.getElementById("grid");
grid.innerHTML="";
var first=(new Date(y,m,1).getDay()+6)%7;
var total=new Date(y,m+1,0).getDate();
var key=getKey();
if(!income[key])income[key]={};
if(!notes[key])notes[key]={};
for(var i=0;i<first;i++){var e=document.createElement("div");e.className="day";e.style.visibility="hidden";grid.appendChild(e);}
for(var d=1;d<=total;d++){
var box=document.createElement("div");box.className="day";
if(income[key][d])box.classList.add("active");
if(notes[key][d]){var ic=document.createElement("span");ic.className="note-icon";ic.innerHTML="📝";box.appendChild(ic);}
var num=document.createElement("div");num.className="day-num";num.innerHTML=d;box.appendChild(num);
var inp=document.createElement("input");inp.value=income[key][d]||"";inp.placeholder="0";inp.inputMode="numeric";
(function(k,day,box){inp.oninput=function(){this.value=this.value.replace(/\D/g,"").substring(0,8);if(this.value){income[k][day]=Number(this.value);box.classList.add("active");}else{delete income[k][day];box.classList.remove("active");}try{localStorage.setItem("ps_income",JSON.stringify(income));}catch(e){}calc();};})(key,d,box);
inp.onclick=function(e){e.stopPropagation();};
box.onclick=(function(day){return function(){openNote(day);};})(d);
box.appendChild(inp);grid.appendChild(box);
}
calc();showNotes();
}

function calc(){
var key=getKey(),sum=0,days=0;
for(var i in income[key]||{}){if(income[key][i]){sum+=income[key][i];days++;}}
document.getElementById("sum").innerHTML="¥"+sum.toLocaleString();
document.getElementById("days").innerHTML=days;
document.getElementById("avg").innerHTML="¥"+(days?Math.round(sum/days):0).toLocaleString();
}

function openNote(day){
currentDay=day;
var key=getKey();
document.getElementById("noteTitle").innerHTML=(now.getMonth()+1)+"月"+day+"日备注";
document.getElementById("noteText").value=(notes[key]&&notes[key][day])||"";
document.getElementById("mask").style.display="flex";
}
document.getElementById("saveNote").onclick=function(){
var key=getKey(),txt=document.getElementById("noteText").value.trim();
if(!notes[key])notes[key]={};
if(txt)notes[key][currentDay]=txt;else delete notes[key][currentDay];
try{localStorage.setItem("ps_notes",JSON.stringify(notes));}catch(e){}
document.getElementById("mask").style.display="none";render();
};
document.getElementById("mask").onclick=function(e){if(e.target===this)this.style.display="none";};
function showNotes(){
var key=getKey(),box=document.getElementById("noteList"),html="";
for(var d in notes[key]||[])html+="<div>📝 "+d+"日："+notes[key][d]+"</div>";
box.innerHTML=html||"<span style='opacity:.5'>暂无备注</span>";
}

document.getElementById("prev").onclick=function(){now.setMonth(now.getMonth()-1);render();};
document.getElementById("next").onclick=function(){now.setMonth(now.getMonth()+1);render();};
document.getElementById("clear").onclick=function(){if(confirm("确定清空本月收益？")){delete income[getKey()];try{localStorage.setItem("ps_income",JSON.stringify(income));}catch(e){}render();}};
document.getElementById("calcBtn").onclick=function(){
var money=Number(document.getElementById("position").value);
var rate=Number(document.getElementById("incomeType").value);
var days=Number(document.getElementById("time").value);
if(!money||!days){alert("请输入本金和天数");return;}
var total=money*Math.pow(1+rate,days);var profit=total-money;
document.getElementById("profit").innerHTML="¥"+Math.round(profit).toLocaleString();
document.getElementById("total").innerHTML="¥"+Math.round(total).toLocaleString();
document.getElementById("rateShow").innerHTML=(rate*100).toFixed(1)+"%/天";
};

function getStatSum(){var k=getKey(),s=0;for(var i in income[k]||{})s+=income[k][i]||0;return s.toLocaleString();}
function getStatDays(){var k=getKey(),d=0;for(var i in income[k]||{})if(income[k][i])d++;return d;}
function getStatAvg(){var k=getKey(),s=0,d=0;for(var i in income[k]||{}){if(income[k][i]){s+=income[k][i];d++;}}return d?Math.round(s/d).toLocaleString():0;}

/* ========= 导出 - 生成精美HTML卡片页面 ========= */
document.getElementById("export").onclick=function(){
var btn=this;
btn.innerHTML="⏳ 生成中...";
btn.disabled=true;

setTimeout(function(){
var tc=getCurrentTheme();
var M=tc.main,L=tc.light,D=tc.dark;
var k=getKey();
var sum=getStatSum(),days=getStatDays(),avg=getStatAvg();
var first=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7;
var totalDays=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();

// 生成日历格子HTML
var calHTML="";
for(var d=1;d<=totalDays;d++){
var idx=first+d-1;
if(idx%7===0)calHTML+='<div style="display:flex;gap:4px;margin-top:4px">';
var active=income[k]&&income[k][d];
calHTML+='<div style="flex:1;min-width:28px;height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;'+(active?'background:rgba('+hexToRgb(M)+',0.2);border:1px solid '+M+';color:'+L:'color:rgba(255,255,255,0.3)')+'">';
calHTML+='<span style="font-weight:bold;font-size:11px">'+d+'</span>';
if(active){var v=String(income[k][d]);if(v.length>5)v=v.substring(0,5)+"..";calHTML+='<span style="font-size:8px;color:'+L+'">'+v+'</span>';}
calHTML+='</div>';
if(idx%7===6)calHTML+='</div>';
}
if((first+totalDays)%7!==0)calHTML+='</div>';

// 备注HTML
var noteHTML="";
if(notes[k]&&Object.keys(notes[k]).length>0){
var n=0;
for(var dk in notes[k]){
if(n>=4)break;
noteHTML+='<div style="color:rgba(255,255,255,0.5);font-size:11px;margin:3px 0">• '+dk+'日  '+notes[k][dk]+'</div>';
n++;
}
if(Object.keys(notes[k]).length>4)noteHTML+='<div style="color:rgba(255,255,255,0.3);font-size:10px">... 还有'+(Object.keys(notes[k]).length-4)+'条备注</div>';
}else{
noteHTML='<div style="color:rgba(255,255,255,0.2);font-size:11px">暂无备注记录</div>';
}

// 粒子HTML
var particleHTML="";
for(var p=0;p<30;p++){
particleHTML+='<span style="position:absolute;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;color:'+rgba(M,0.1)+';font-size:14px">'+tc.particles[p%tc.particles.length]+'</span>';
}

var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>磐石收益账本 · '+tc.name+'</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,'+tc.bg1+','+tc.bg3+');min-height:100vh;padding:20px 15px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center}.wrap{width:100%;max-width:400px;position:relative}.card{background:linear-gradient(160deg,rgba('+hexToRgb(M)+',0.1),transparent 60%),'+tc.cardBg+';border:2px solid '+M+';border-radius:28px;padding:25px 18px 20px;position:relative;overflow:hidden;box-shadow:0 25px 80px '+tc.glow+';}.card::before{content:"";position:absolute;width:300px;height:300px;left:-100px;top:-100px;background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);pointer-events:none}.inner-border{position:absolute;inset:4px;border-radius:24px;border:1px solid rgba(255,255,255,0.08);pointer-events:none}.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}'+particleHTML+'</span>}.header{text-align:center;position:relative;z-index:1}.icon{font-size:40px;margin-bottom:5px}.title{font-size:28px;font-weight:900;background:linear-gradient(180deg,'+L+','+M+');-webkit-background-clip:text;color:transparent;letter-spacing:3px}.theme-name{color:'+rgba(M,0.7)+';font-size:12px;font-weight:bold;margin:5px 0}.date-sub{color:'+rgba(M,0.5)+';font-size:11px}.divider{display:flex;align-items:center;gap:10px;margin:20px 0;position:relative;z-index:1}.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,'+rgba(M,0.4)+',transparent)}.divider-dot{width:6px;height:6px;background:'+M+';border-radius:50%;box-shadow:0 0 8px '+rgba(M,0.8)+'}.stats-row{display:flex;gap:8px;margin:15px 0;position:relative;z-index:1}.stat-box{flex:1;background:rgba('+hexToRgb(M)+',0.08);border:1px solid rgba('+hexToRgb(M)+',0.2);border-radius:16px;padding:14px 6px;text-align:center}.stat-icon{font-size:22px}.stat-label{color:'+rgba(M,0.5)+';font-size:10px;margin:4px 0}.stat-value{font-size:18px;font-weight:900;color:'+L+'}.month-title{text-align:center;font-size:18px;font-weight:900;color:'+L+';margin:20px 0 12px;position:relative;z-index:1}.weekdays{display:flex;gap:4px;margin-bottom:6px;position:relative;z-index:1}.weekdays span{flex:1;min-width:28px;text-align:center;font-size:10px;font-weight:bold;color:'+rgba(M,0.6)+'}.calendar{position:relative;z-index:1}'+calHTML+'.notes-section{margin-top:20px;padding:14px;background:rgba('+hexToRgb(M)+',0.05);border:1px solid rgba('+hexToRgb(M)+',0.15);border-radius:16px;position:relative;z-index:1}.notes-title{font-size:14px;font-weight:bold;color:'+L+';margin-bottom:8px}'+noteHTML+'.footer{margin-top:25px;text-align:center;position:relative;z-index:1}.footer-text{font-size:9px;color:rgba(255,255,255,0.12);letter-spacing:3px}.save-tip{text-align:center;color:'+rgba(M,0.6)+';font-size:13px;padding:15px 0 5px;font-weight:bold}.save-tip2{text-align:center;color:rgba(255,255,255,0.3);font-size:11px;padding-bottom:20px}</style></head><body><div class="wrap"><div class="save-tip">⬇️ 长按下方卡片保存到相册 ⬇️</div><div class="card"><div class="inner-border"></div><div class="particles"></div><div class="header"><div class="icon">'+tc.icon+'</div><div class="title">磐石收益账本</div><div class="theme-name">'+tc.name+'</div><div class="date-sub">'+tc.desc+' · '+now.getFullYear()+'年'+(now.getMonth()+1)+'月</div></div><div class="divider"><div class="divider-line"></div><div class="divider-dot"></div><div class="divider-line"></div></div><div class="stats-row"><div class="stat-box"><div class="stat-icon">💰</div><div class="stat-label">累计收益</div><div class="stat-value">¥'+sum+'</div></div><div class="stat-box"><div class="stat-icon">📅</div><div class="stat-label">收益天数</div><div class="stat-value">'+days+'天</div></div><div class="stat-box"><div class="stat-icon">📊</div><div class="stat-label">日均收益</div><div class="stat-value">¥'+avg+'</div></div></div><div class="month-title">📆 '+now.getFullYear()+'年'+(now.getMonth()+1)+'月</div><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar">'+calHTML+'</div><div class="notes-section"><div class="notes-title">📝 本月备注</div>'+noteHTML+'</div><div class="footer"><div class="footer-text">P A N S H I · W E A L T H · '+new Date().getFullYear()+' | '+tc.name+'</div></div></div><div class="save-tip2">如无法保存，请截图</div></div></body></html>';

var win=window.open("","_blank");
if(win){
win.document.write(html);
win.document.close();
}else{
alert("请允许弹出窗口以查看卡片");
}

btn.innerHTML="📸 高清导出";
btn.disabled=false;
},300);
};

function hexToRgb(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return r+","+g+","+b;}
function rgba(hex,alpha){return "rgba("+hexToRgb(hex)+","+alpha+")";}

render();
</script>
