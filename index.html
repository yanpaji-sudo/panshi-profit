<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>磐石收益账本</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:#050505;
    display:flex;
    justify-content:center;
    padding:20px;
    font-family:
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}


/* =========================
   三套主题变量
========================= */


/* 黑金尊享 */
body.gold{

--bg:#070707;
--card:#101010;
--main:#d6b45c;
--light:#fff0ad;
--text:#f8e9b0;
--sub:#95804c;

}


/* 东方玉石 */
body.jade{

--bg:#03130f;
--card:#071d17;
--main:#21c89b;
--light:#b7ffe8;
--text:#d8fff4;
--sub:#579c86;

}


/* 星耀科技 */

body.star{

--bg:#050b18;
--card:#0b162c;
--main:#5da9ff;
--light:#d7eaff;
--text:#e5f2ff;
--sub:#6685a8;

}



/* 默认 */

body{
background:var(--bg);
}


/* =====================
主体
===================== */


.wrap{

width:100%;
max-width:520px;

}


.card{

position:relative;

background:
linear-gradient(
160deg,
rgba(255,255,255,.08),
transparent 30%
),
var(--card);


border-radius:32px;

padding:28px 22px 24px;

color:var(--text);

overflow:hidden;

border:

1.5px solid
color-mix(
in srgb,
var(--main),
transparent 35%
);


box-shadow:

0 20px 80px
rgba(0,0,0,.7),

inset 0 0 50px
rgba(255,255,255,.03);


}



/* 光效 */

.card::before{

content:"";

position:absolute;

width:400px;
height:400px;

top:-200px;
left:-120px;


background:

radial-gradient(

circle,

color-mix(
in srgb,
var(--main),
transparent 80%
),

transparent 70%

);


}



.inner{

position:absolute;

inset:5px;

border-radius:28px;

border:

1px solid
color-mix(
in srgb,
var(--main),
transparent 70%
);

}



/* 四角 */


.corner{

position:absolute;

width:25px;

height:25px;

border-color:var(--main);

}



.tl{

top:15px;
left:15px;

border-left:3px solid;
border-top:3px solid;

}


.tr{

top:15px;
right:15px;

border-right:3px solid;
border-top:3px solid;

}


.bl{

bottom:15px;
left:15px;

border-left:3px solid;
border-bottom:3px solid;

}


.br{

bottom:15px;
right:15px;

border-right:3px solid;
border-bottom:3px solid;

}




/* 标题 */


.title{

text-align:center;

font-size:32px;

font-weight:900;

letter-spacing:6px;

margin-top:12px;


background:

linear-gradient(

180deg,

#fff,

var(--main)

);


-webkit-background-clip:text;

color:transparent;


text-shadow:

0 5px 20px
rgba(0,0,0,.5);


}


.sub{

text-align:center;

font-size:13px;

margin-top:8px;

color:var(--sub);

letter-spacing:3px;


}



/* 主题按钮 */


.themes{

display:flex;

gap:10px;

margin:20px 0;


}


.themes button{


flex:1;

height:36px;

border-radius:20px;

background:

rgba(255,255,255,.05);


border:

1px solid
color-mix(
in srgb,
var(--main),
transparent 50%
);


color:var(--text);

}



/* 数据区域 */


.stats{


display:grid;

grid-template-columns:

repeat(3,1fr);

gap:12px;

margin-top:20px;


}



.stat{


background:

rgba(255,255,255,.05);


border-radius:18px;

padding:18px 5px;

text-align:center;

border:

1px solid
color-mix(
in srgb,
var(--main),
transparent 75%
);


}



.label{

font-size:12px;

color:var(--sub);

}


.value{

font-size:22px;

font-weight:900;

margin-top:8px;

color:var(--light);


}



/* 月份 */


.month{

display:flex;

justify-content:space-between;

align-items:center;

margin:22px 0;

}


.month button{


width:45px;

height:35px;

border-radius:15px;

border:

1px solid
var(--main);


background:none;

color:var(--main);

font-size:18px;


}


.month span{

font-size:22px;

font-weight:800;

}



/* 星期 */


.week{

display:grid;

grid-template-columns:

repeat(7,1fr);

text-align:center;

color:var(--sub);

font-size:13px;

margin-bottom:8px;

}



/* 日期 */

.calendar{

display:grid;

grid-template-columns:

repeat(7,1fr);

gap:8px;


}



.day{

height:65px;

border-radius:14px;

background:

rgba(255,255,255,.04);


border:

1px solid
rgba(255,255,255,.08);


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


}


.day.active{


background:

linear-gradient(

180deg,

color-mix(
in srgb,
var(--main),
transparent 70%
),

transparent

);


border-color:var(--main);


}



.day input{

width:80%;

background:none;

border:0;

outline:none;

text-align:center;

color:var(--light);

font-size:13px;

}



/* 底部按钮 */

.actions{

display:flex;

gap:15px;

margin-top:25px;


}


.actions button{

flex:1;

height:55px;

border-radius:18px;

font-size:16px;

font-weight:800;


}



.export{

background:

linear-gradient(

135deg,

var(--main),

var(--light)

);


border:0;

}



.clear{

background:none;

border:

1px solid var(--main);

color:var(--main);

}



.brand{

text-align:center;

margin-top:20px;

font-size:12px;

letter-spacing:6px;

opacity:.4;

}


</style>
</head>


<body class="gold">


<div class="wrap">


<div class="card">


<div class="inner"></div>


<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>



<div class="title">
磐石收益账本
</div>


<div class="sub">
财富记录 · 智能累计
</div>



<div class="themes">

<button onclick="setTheme('gold')">
鎏金
</button>


<button onclick="setTheme('jade')">
玉石
</button>


<button onclick="setTheme('star')">
星耀
</button>


</div>




<div class="stats">


<div class="stat">

<div class="label">
累计收益
</div>

<div class="value" id="sum">
¥0
</div>


</div>



<div class="stat">

<div class="label">
记录天数
</div>

<div class="value" id="days">
0
</div>

</div>




<div class="stat">

<div class="label">
平均每日
</div>

<div class="value" id="avg">
¥0
</div>

</div>


</div>




<div class="month">

<button id="prev">
‹
</button>


<span id="ym">
2026年8月
</span>


<button id="next">
›
</button>


</div>



<div class="week">

<span>一</span>
<span>二</span>
<span>三</span>
<span>四</span>
<span>五</span>
<span>六</span>
<span>日</span>

</div>



<div class="calendar" id="grid">

</div>




<div class="actions">


<button class="export" id="export">
高清导出
</button>


<button class="clear" id="clear">
清空
</button>


</div>



<div class="brand">
P A N S H I · WEALTH
</div>


</div>


</div>


<canvas id="cv" width="1200" height="1800"></canvas>


<script>

function setTheme(t){

document.body.className=t;

localStorage.setItem(
"theme",
t
);

}


let oldTheme=
localStorage.getItem("theme");

if(oldTheme){
document.body.className=oldTheme;
}



</script>


</body>
</html>
<script>


//======================
// 主题
//======================


function setTheme(t){

    document.body.className=t;

    localStorage.setItem(
        "panshi_theme",
        t
    );

}


let saveTheme=
localStorage.getItem(
"panshi_theme"
);


if(saveTheme){

document.body.className=saveTheme;

}



//======================
// 数据系统
//======================


let current=new Date();


let records=
JSON.parse(
localStorage.getItem(
"panshi_income"
)
||
"{}"
);



function monthKey(y,m){

return y+"-"+m;

}



//======================
// 渲染日历
//======================


function render(){


let y=current.getFullYear();

let m=current.getMonth();



document.getElementById("ym")
.innerHTML=
y+"年"+(m+1)+"月";



let grid=
document.getElementById("grid");


grid.innerHTML="";



let first=
new Date(
y,
m,
1
)
.getDay();



let offset=
(first+6)%7;



let days=
new Date(
y,
m+1,
0
)
.getDate();




// 空格

for(let i=0;i<offset;i++){

let empty=
document.createElement("div");

empty.className="day";

empty.style.opacity=0;

grid.appendChild(empty);

}




let key=
monthKey(y,m);



if(!records[key]){

records[key]={};

}




for(let d=1;d<=days;d++){



let box=
document.createElement("div");


let value=
records[key][d]
||
"";



box.className=
"day"+
(value?" active":"");




let num=
document.createElement("div");

num.innerHTML=d;


box.appendChild(num);




let input=
document.createElement("input");


input.type="text";

input.placeholder="收益";


input.value=value;



input.oninput=function(){


this.value=
this.value
.replace(/[^\d]/g,"")
.slice(0,8);



records[key][d]=
this.value
?
Number(this.value)
:
"";


localStorage.setItem(

"panshi_income",

JSON.stringify(records)

);



box.classList.toggle(
"active",
!!this.value
);



calc();


};



box.appendChild(input);



grid.appendChild(box);



}



calc();


}



//======================
// 数据统计
//======================


function calc(){


let y=current.getFullYear();

let m=current.getMonth();


let key=
monthKey(y,m);



let total=0;

let count=0;



for(let d in records[key]||{}){


if(records[key][d]){


total+=
Number(records[key][d]);


count++;


}


}




document.getElementById("sum")
.innerHTML=
"¥"+
total.toLocaleString();



document.getElementById("days")
.innerHTML=
count;



document.getElementById("avg")
.innerHTML=
"¥"+
(
count
?
Math.round(total/count)
:
0
)
.toLocaleString();



}



//======================
// 月份按钮
//======================



document
.getElementById("prev")
.onclick=function(){


current.setMonth(
current.getMonth()-1
);


render();


};



document
.getElementById("next")
.onclick=function(){


current.setMonth(
current.getMonth()+1
);


render();


};




//======================
// 清空
//======================



document
.getElementById("clear")
.onclick=function(){


if(
confirm(
"确定清空当前月份收益记录？"
)
){


delete records[
monthKey(
current.getFullYear(),
current.getMonth()
)
];


localStorage.setItem(

"panshi_income",

JSON.stringify(records)

);


render();



}


};




//启动


render();



</script><script>


//======================
// 高清导出
//======================


document
.getElementById("export")
.onclick=function(){



let cv=
document.getElementById("cv");


let ctx=
cv.getContext("2d");



let W=1200;

let H=1800;



ctx.clearRect(
0,
0,
W,
H
);




// 当前主题


let theme=
document.body.className;



let color="#d6b45c";

let light="#fff0ad";

let bg="#101010";



if(theme=="jade"){

color="#21c89b";
light="#b7ffe8";
bg="#071d17";

}


if(theme=="star"){

color="#5da9ff";
light="#d7eaff";
bg="#0b162c";

}



//======================
// 背景
//======================


let grd=
ctx.createLinearGradient(
0,
0,
0,
H
);


grd.addColorStop(
0,
bg
);


grd.addColorStop(
1,
"#020202"
);



ctx.fillStyle=grd;

ctx.fillRect(
0,
0,
W,
H
);




//======================
// 卡片
//======================


let x=50;

let y=50;

let w=1100;

let h=1700;


ctx.beginPath();

ctx.roundRect(
x,
y,
w,
h,
45
);


ctx.fillStyle=
"rgba(0,0,0,.65)";


ctx.fill();



ctx.lineWidth=3;

ctx.strokeStyle=color;


ctx.stroke();




// 内框


ctx.lineWidth=1;

ctx.strokeStyle=
"rgba(255,255,255,.15)";


ctx.roundRect(
x+10,
y+10,
w-20,
h-20,
40
);


ctx.stroke();




//======================
// 标题
//======================



ctx.textAlign="center";


let titleY=150;


let tg=
ctx.createLinearGradient(
0,
100,
0,
200
);


tg.addColorStop(
0,
"#fff"
);


tg.addColorStop(
1,
color
);



ctx.fillStyle=tg;


ctx.font=
"900 70px Microsoft YaHei";


ctx.fillText(
"磐石收益账本",
W/2,
titleY
);



ctx.font=
"26px Microsoft YaHei";


ctx.fillStyle=
light;


ctx.fillText(
"财富记录 · 智能累计",
W/2,
205
);




//======================
// 统计
//======================


let y0=270;


let total=0;

let count=0;



let key=
monthKey(
current.getFullYear(),
current.getMonth()
);



for(let d in records[key]||{}){

if(records[key][d]){

total+=Number(records[key][d]);

count++;

}

}



let avg=
count?
Math.round(total/count):
0;



let arr=[

["累计收益",
"¥"+total.toLocaleString()
],

[
"记录天数",
count
],

[
"平均每日",
"¥"+avg.toLocaleString()
]

];



for(let i=0;i<3;i++){


let bx=
100+i*340;



ctx.fillStyle=
"rgba(255,255,255,.06)";


ctx.roundRect(
bx,
y0,
280,
120,
20
);


ctx.fill();



ctx.strokeStyle=
"rgba(255,255,255,.15)";


ctx.stroke();



ctx.fillStyle=
light;


ctx.font=
"22px Microsoft YaHei";


ctx.fillText(
arr[i][0],
bx+140,
y0+40
);



ctx.font=
"bold 38px Arial";


ctx.fillText(
arr[i][1],
bx+140,
y0+85
);


}



//======================
// 月份
//======================



let monthY=470;


ctx.font=
"bold 42px Microsoft YaHei";


ctx.fillStyle=light;


ctx.fillText(

current.getFullYear()
+"年"
+
(current.getMonth()+1)
+"月收益",

W/2,

monthY

);




//======================
// 日历
//======================


let gx=90;

let gy=550;


let cw=140;

let ch=105;


let gap=12;



let week=[

"一","二","三","四","五","六","日"

];


ctx.font=
"26px Microsoft YaHei";


ctx.fillStyle=
color;



for(let i=0;i<7;i++){

ctx.fillText(

week[i],

gx+i*(cw+gap)+cw/2,

gy

);

}



let year=
current.getFullYear();


let mon=
current.getMonth();


let first=
new Date(
year,
mon,
1
)
.getDay();


let offset=
(first+6)%7;



let max=
new Date(
year,
mon+1,
0
)
.getDate();



let calendarBottom=gy;



for(let d=1;d<=max;d++){


let index=
offset+d-1;


let row=
Math.floor(index/7);


let col=
index%7;



let px=
gx+col*(cw+gap);


let py=
gy+40+row*(ch+gap);



calendarBottom=
py+ch;



ctx.fillStyle=
"rgba(255,255,255,.04)";


ctx.roundRect(
px,
py,
cw,
ch,
15
);


ctx.fill();



ctx.strokeStyle=
"rgba(255,255,255,.15)";


ctx.stroke();




ctx.fillStyle=
light;


ctx.font=
"bold 28px Arial";


ctx.fillText(
d,
px+cw/2,
py+38
);




let val=
records[key]&&records[key][d];



if(val){


ctx.font=
"bold 25px Arial";


ctx.fillText(

val,

px+cw/2,

py+75

);


}


}




//======================
// 自动水印区域
//======================



let watermarkY=
calendarBottom
+
120;



// 防止超过


if(watermarkY>1450){

watermarkY=1450;

}



ctx.textAlign="center";



let wm=
"加入磐石开启财富人生";



ctx.font=
"900 62px Microsoft YaHei";




// 黑描边


ctx.lineWidth=14;

ctx.strokeStyle=
"rgba(0,0,0,.8)";


ctx.strokeText(
wm,
W/2,
watermarkY
);




// 金色主体


ctx.fillStyle=
color;


ctx.globalAlpha=.65;


ctx.fillText(
wm,
W/2,
watermarkY
);


ctx.globalAlpha=1;




// 品牌


ctx.font=
"24px Arial";


ctx.fillStyle=
"rgba(255,255,255,.35)";


ctx.fillText(

"P A N S H I  ·  WEALTH",

W/2,

watermarkY+70

);





//======================
// 下载
//======================


cv.toBlob(

function(blob){


let url=
URL.createObjectURL(blob);



let a=
document.createElement("a");



a.href=url;



a.download=
"磐石收益账本.png";



a.click();



URL.revokeObjectURL(url);



},

"image/png"

);



};



</script>
